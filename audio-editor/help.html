<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to NoorEditor</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nooreditor.web.app/audio-editor/">
<!-- The video, audio and PDF editors now live at nooreditor.web.app. This page sends visitors
     there, keeping the address after the domain (so ?open=…, #… and help pages still work). -->
<script>
(function () {
  var target = 'https://nooreditor.web.app' + location.pathname + location.search + location.hash;
  // Retire the old offline copy of the editor installed on this site.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      list.forEach(function (r) { if (r.scope.indexOf(location.origin + '/audio-editor/') === 0) r.unregister(); });
    }).catch(function () {});
  }
  location.replace(target);
}());
</script>
<meta http-equiv="refresh" content="1; url=https://nooreditor.web.app/audio-editor/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf3e0; color: #3c2f26;
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  a { color: #1f4f40; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 style="font-weight:600;font-size:24px;margin:0 0 8px">The audio editor has moved</h1>
  <p>It now lives at <a href="https://nooreditor.web.app/audio-editor/">nooreditor.web.app</a>, together with the video, audio and PDF editors.</p>
  <p><a href="/">← Back to Diin Islaam</a></p>
</main>
</body>
</html>
