<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7778012722329637" crossorigin="anonymous"></script>
<title>99 Names of Allah — Kids Corner</title>
<meta name="description" content="Browse, flip, print and share flashcards for all 99 beautiful Names of Allah (Al-Asma-ul-Husna) — with Arabic, transliteration and meaning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-dark:#8a5a00; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --danger:#8a3324;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; padding:0;
    background:#e9e2cd; font-family:'Cormorant Garamond', serif; color:var(--ink-brown);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .arabic{ font-family:'Amiri', serif; }

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:var(--maxw); margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:38px; height:38px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none; }
  .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  .back-pill{
    display:flex; align-items:center; gap:6px; text-decoration:none; font-family:'Marcellus';
    font-size:14px; color:var(--ink-brown); background:#fff; border:1px solid var(--gold-soft);
    border-radius:20px; padding:8px 16px;
  }
  .back-pill:hover{ background:var(--parchment-deep); }

  .page-head{ text-align:center; padding:36px 20px 8px; }
  .eyebrow{ font-family:'Marcellus'; color:var(--gold-dark); font-size:14px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; }
  .page-head h1{ font-family:'Marcellus'; font-size:clamp(26px,4vw,38px); color:var(--ink-navy); margin:0 0 10px; }
  .page-head p{ font-size:16px; color:#6b5a3f; line-height:1.5; max-width:560px; margin:0 auto; }

  .toolbar{
    max-width:var(--maxw); margin:0 auto; padding:18px 20px 0; display:flex; align-items:center;
    justify-content:center; gap:12px; flex-wrap:wrap;
  }
  .toolbar input{
    font-family:'Cormorant Garamond', serif; font-size:16px; padding:10px 18px; border-radius:22px;
    border:1.5px solid var(--gold-soft); background:#fff; color:var(--ink-navy); min-width:240px;
  }
  .toolbar input:focus{ outline:2px solid var(--gold); }
  .btn{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:15px; padding:10px 22px; border-radius:22px; border:1.5px solid var(--gold-soft); cursor:pointer;
    background:#fff; color:var(--ink-navy); transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); background:var(--parchment-deep); }
  .btn.primary{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .btn.primary:hover{ background:var(--gold-dark); }

  .count-note{ text-align:center; font-size:14px; color:#8a7654; margin:10px 0 0; }

  .card-grid{
    max-width:var(--maxw); margin:0 auto; padding:22px 20px 90px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px;
  }
  .flash-card{
    background:none; border:none; padding:0; cursor:pointer; perspective:1200px; height:220px; width:100%;
    font-family:inherit;
  }
  .flash-card-inner{
    position:relative; width:100%; height:100%; text-align:center;
    transition:transform .5s; transform-style:preserve-3d;
  }
  .flash-card.flipped .flash-card-inner{ transform:rotateY(180deg); }
  .flash-front, .flash-back{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px;
    border:2px solid var(--gold-soft); box-shadow:0 6px 16px rgba(60,45,20,.10);
  }
  .flash-front{ background:#fff; }
  .flash-back{ background:var(--parchment); transform:rotateY(180deg); }
  .flash-num{ position:absolute; top:10px; left:12px; font-size:12px; color:var(--gold-dark); font-weight:700; }
  .flash-front .flash-arabic{ font-family:'Amiri', serif; font-size:34px; color:var(--ink-navy); direction:rtl; }
  .flash-front .flash-translit{ font-size:15px; color:#8a7654; font-style:italic; }
  .flash-front .flash-hint{ font-size:12px; color:var(--gold-dark); margin-top:8px; }
  .flash-back .flash-meaning{ font-family:'Marcellus'; font-size:18px; color:var(--ink-navy); line-height:1.35; }
  .flash-back .flash-arabic-small{ font-family:'Amiri', serif; font-size:22px; color:var(--gold-dark); direction:rtl; }
  .card-actions{ position:absolute; bottom:8px; right:8px; display:flex; gap:6px; z-index:2; }
  .icon-btn{
    background:#fff; border:1.5px solid var(--gold-soft); border-radius:50%; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; padding:0;
  }
  .icon-btn:hover{ background:var(--parchment-deep); }

  footer{ background:var(--ink-navy); color:#c9d2e0; padding:36px 20px 24px; text-align:center; margin-top:20px; }
  footer .flinks{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  footer .flinks a{ text-decoration:none; color:#c9d2e0; }
  footer .flinks a:hover{ color:#faf3e0; }
  footer .fine{ font-size:13px; color:#8b96ab; margin:0; }

  /* ---- printable single-name poster (rendered into #print-overlay) ---- */
  #print-overlay{ display:none; }
  .poster-page{ padding:30px; }
  .poster-card{
    max-width:900px; margin:0 auto; background:linear-gradient(135deg, #fffaf0, var(--parchment));
    border:3px double var(--gold); outline:8px solid var(--parchment-deep); outline-offset:-18px;
    border-radius:14px; padding:60px; text-align:center; position:relative;
  }
  .poster-corner{ position:absolute; width:26px; height:26px; opacity:.5; pointer-events:none; }
  .poster-corner::before, .poster-corner::after{ content:''; position:absolute; inset:0; border:2px solid var(--gold); }
  .poster-corner::after{ transform:rotate(45deg); }
  .poster-corner.tl{ top:14px; left:14px; } .poster-corner.tr{ top:14px; right:14px; }
  .poster-corner.bl{ bottom:14px; left:14px; } .poster-corner.br{ bottom:14px; right:14px; }
  .poster-eyebrow{ font-family:'Marcellus'; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin:0; }
  .poster-num{ font-size:15px; color:var(--gold-dark); font-weight:700; margin:6px 0 0; }
  .poster-arabic-big{ font-family:'Amiri', serif; font-size:64px; direction:rtl; color:var(--ink-navy); margin:24px 0 10px; }
  .poster-translit-big{ font-size:24px; font-style:italic; color:var(--ink-brown); margin:0 0 18px; }
  .poster-meaning-big{ font-family:'Marcellus'; font-size:26px; color:var(--ink-navy); margin:0; }
  .poster-divider{ margin:26px auto; max-width:280px; display:flex; align-items:center; gap:10px; color:var(--gold); }
  .poster-divider span{ flex:1; height:1px; background:var(--gold); opacity:.5; }
  .poster-footer{ font-size:13.5px; color:var(--gold); margin-top:10px; }
  .all-names-print{ display:none; }

  @media print{
    /* When printing a single name poster (#print-overlay is active),
       everything else on the page is hidden and only #print-overlay
       shows (see printSpecial() in the script below). */
    body.printing-special > *:not(#print-overlay){ display:none !important; }
    body.printing-special #print-overlay{ display:block !important; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="brand" href="/">
      <span class="brand-mark arabic">د</span>
      <span class="brand-text">Diin Islaam<small>دين الإسلام</small></span>
    </a>
    <a class="back-pill" href="kids.html">← Kids Corner</a>
  </div>
</header>

<div class="page-head">
  <p class="eyebrow">⭐ Flashcards</p>
  <h1>99 Names of Allah</h1>
  <p>Tap a card to flip it and reveal the meaning. Print a card as a poster, or share a Name with family and friends.</p>
</div>

<div class="toolbar">
  <input type="search" id="search-box" placeholder="Search a Name or meaning...">
  <button class="btn primary" id="print-all-btn">🖨️ Print all 99</button>
</div>
<p class="count-note" id="count-note"></p>

<div class="card-grid" id="card-grid"></div>

<footer>
  <p class="arabic">وَقُل رَّبِّ زِدْنِي عِلْمًا</p>
  <div class="flinks">
    <a href="kids.html">Kids Corner</a>
    <a href="kids-games.html">Games</a>
    <a href="/">Diin Islaam Home</a>
  </div>
  <p class="fine">© <span id="year"></span> Diin Islaam · diinislaam.com</p>
</footer>

<div id="print-overlay"></div>

<script src="data/kids-game-names-data.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* All 99 Names live in data/kids-game-names-data.js (see that file). */
const NAMES = window.NAMES_99;

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function cardHtml(item, idx){
  return '<button type="button" class="flash-card" data-idx="' + idx + '" aria-label="Flip card for ' + escapeHtml(item.translit) + '">' +
    '<div class="flash-card-inner">' +
      '<div class="flash-front">' +
        '<span class="flash-num">' + (idx + 1) + '</span>' +
        '<div class="flash-arabic">' + escapeHtml(item.ar) + '</div>' +
        '<div class="flash-translit">' + escapeHtml(item.translit) + '</div>' +
        '<div class="flash-hint">Tap to reveal meaning</div>' +
      '</div>' +
      '<div class="flash-back">' +
        '<span class="flash-num">' + (idx + 1) + '</span>' +
        '<div class="flash-arabic-small">' + escapeHtml(item.ar) + '</div>' +
        '<div class="flash-meaning">' + escapeHtml(item.meaning) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card-actions">' +
      '<button type="button" class="icon-btn print-one-btn" data-idx="' + idx + '" title="Print this Name">🖨️</button>' +
      '<button type="button" class="icon-btn share-one-btn" data-idx="' + idx + '" title="Share this Name">🔗</button>' +
    '</div>' +
  '</button>';
}

function renderGrid(filterText){
  const grid = document.getElementById('card-grid');
  const q = (filterText || '').trim().toLowerCase();
  const items = NAMES.map((item, idx) => ({ item, idx }))
    .filter(({ item }) => !q ||
      item.translit.toLowerCase().includes(q) ||
      item.meaning.toLowerCase().includes(q) ||
      item.ar.includes(q));
  grid.innerHTML = items.map(({ item, idx }) => cardHtml(item, idx)).join('');
  document.getElementById('count-note').textContent = q
    ? 'Showing ' + items.length + ' of ' + NAMES.length + ' Names'
    : 'All ' + NAMES.length + ' Names of Allah';
}

document.getElementById('card-grid').addEventListener('click', e => {
  const printBtn = e.target.closest('.print-one-btn');
  const shareBtn = e.target.closest('.share-one-btn');
  if(printBtn){ e.stopPropagation(); printOneName(Number(printBtn.dataset.idx)); return; }
  if(shareBtn){ e.stopPropagation(); shareOneName(Number(shareBtn.dataset.idx)); return; }
  const card = e.target.closest('.flash-card');
  if(card) card.classList.toggle('flipped');
});

document.getElementById('search-box').addEventListener('input', e => renderGrid(e.target.value));

/* Takes over the whole page for one printed sheet -- everything else is
   hidden via the "printing-special" body class (see CSS) and only
   #print-overlay's content shows, so a single-Name poster or the full
   99-Names sheet prints as a clean page instead of sitting inside the grid. */
function cleanupPrintSpecial(){
  document.body.classList.remove('printing-special');
  const pageStyle = document.getElementById('print-page-style');
  if(pageStyle) pageStyle.remove();
}
function printSpecial(html, pageCss){
  document.getElementById('print-overlay').innerHTML = html;
  document.body.classList.add('printing-special');
  if(!document.getElementById('print-page-style')){
    const pageStyle = document.createElement('style');
    pageStyle.id = 'print-page-style';
    pageStyle.textContent = pageCss || '@page{ size:landscape; margin:0.5in; }';
    document.head.appendChild(pageStyle);
  }
  window.print();
}
/* 'afterprint' alone isn't reliable enough for a JS-triggered print --
   Safari and some mobile browsers can skip it entirely, which would
   leave the whole page hidden behind #print-overlay forever. Also
   watching the print media query itself (the MDN-recommended
   workaround) makes sure the page always comes back. */
window.addEventListener('afterprint', cleanupPrintSpecial);
if(window.matchMedia){
  window.matchMedia('print').addEventListener('change', mql => { if(!mql.matches) cleanupPrintSpecial(); });
}

function buildPosterHtml(item, idx){
  const corners = '<span class="poster-corner tl"></span><span class="poster-corner tr"></span>' +
    '<span class="poster-corner bl"></span><span class="poster-corner br"></span>';
  return '<div class="poster-page"><div class="poster-card">' + corners +
    '<p class="poster-eyebrow">Al-Asma-ul-Husna · The 99 Names of Allah</p>' +
    '<p class="poster-num">Name ' + (idx + 1) + ' of ' + NAMES.length + '</p>' +
    '<div class="poster-arabic-big">' + escapeHtml(item.ar) + '</div>' +
    '<p class="poster-translit-big">' + escapeHtml(item.translit) + '</p>' +
    '<p class="poster-meaning-big">' + escapeHtml(item.meaning) + '</p>' +
    '<div class="poster-divider"><span></span><b>✦</b><span></span></div>' +
    '<p class="poster-footer">diinislaam.com</p>' +
    '</div></div>';
}
function printOneName(idx){
  const item = NAMES[idx];
  if(!item) return;
  printSpecial(buildPosterHtml(item, idx), '@page{ size:landscape; margin:0.5in; }');
}

function buildAllNamesHtml(){
  const rows = NAMES.map((item, idx) =>
    '<tr><td>' + (idx + 1) + '</td><td class="an-arabic">' + escapeHtml(item.ar) + '</td>' +
    '<td>' + escapeHtml(item.translit) + '</td><td>' + escapeHtml(item.meaning) + '</td></tr>'
  ).join('');
  return '<div class="all-names-sheet">' +
    '<h1>Al-Asma-ul-Husna — The 99 Names of Allah</h1>' +
    '<table><thead><tr><th>#</th><th>Arabic</th><th>Transliteration</th><th>Meaning</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<p class="an-footer">diinislaam.com</p>' +
    '</div>';
}
function printAllNames(){
  printSpecial(buildAllNamesHtml(), '@page{ size:portrait; margin:0.5in; }');
}
document.getElementById('print-all-btn').addEventListener('click', printAllNames);

async function shareOneName(idx){
  const item = NAMES[idx];
  if(!item) return;
  const text = item.translit + ' (' + item.ar + ') — ' + item.meaning;
  const shareData = {
    title: '99 Names of Allah',
    text: text,
    url: window.location.href
  };
  try{
    if(navigator.share){
      await navigator.share(shareData);
      return;
    }
    throw new Error('no-share-api');
  }catch(err){
    try{
      await navigator.clipboard.writeText(text + ' — ' + window.location.href);
      const btn = document.querySelector('.share-one-btn[data-idx="' + idx + '"]');
      if(btn){
        const old = btn.textContent;
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = old; }, 1400);
      }
    }catch(copyErr){
      window.prompt('Copy this to share:', text + ' — ' + window.location.href);
    }
  }
}

renderGrid('');
</script>

<style media="print">
  .all-names-sheet{ font-family:'Cormorant Garamond', serif; color:var(--ink-brown); padding:10px; }
  .all-names-sheet h1{ font-family:'Marcellus'; font-size:24px; color:var(--ink-navy); text-align:center; margin:0 0 18px; }
  .all-names-sheet table{ width:100%; border-collapse:collapse; font-size:14px; }
  .all-names-sheet th, .all-names-sheet td{ border:1px solid var(--gold-soft); padding:6px 10px; text-align:left; }
  .all-names-sheet th{ background:var(--parchment-deep); font-family:'Marcellus'; }
  .all-names-sheet .an-arabic{ font-family:'Amiri', serif; font-size:18px; direction:rtl; }
  .all-names-sheet .an-footer{ text-align:center; font-size:12px; color:var(--gold); margin-top:16px; }
</style>

<script src="/cursor.js" defer></script>
</body>
</html>
