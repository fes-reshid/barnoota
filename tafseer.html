<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafsīr Audio Library — Diin Islaam</title>
<meta name="description" content="Listen to Tafsīr (Qur'ān exegesis) audio lessons from Diin Islaam, organized by Sūrah.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; padding:0; background:#e9e2cd; font-family:'Cormorant Garamond', serif;
    color:var(--ink-brown); -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .arabic{ font-family:'Amiri', serif; }

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; max-width:var(--maxw); margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{
    width:38px; height:38px; border-radius:50%; background:var(--green);
    display:flex; align-items:center; justify-content:center;
    color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none;
  }
  .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  nav.main-links{ display:flex; align-items:center; gap:28px; }
  nav.main-links a{
    text-decoration:none; font-size:17px; color:var(--ink-brown); font-weight:600;
    padding:6px 2px; border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
  }
  nav.main-links a:hover{ color:var(--green); border-color:var(--gold-soft); }
  nav.main-links a.active{ color:var(--green); border-color:var(--green); }
  .menu-btn{ display:none; }
  @media (max-width:820px){
    nav.main-links{
      display:none; position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch;
      background:var(--parchment); border-bottom:1px solid var(--gold-soft);
      padding:10px 20px 18px; gap:4px; box-shadow:0 12px 20px rgba(60,45,20,.12);
    }
    nav.main-links.open{ display:flex; }
    nav.main-links a{ padding:10px 4px; border-bottom:1px solid rgba(169,124,37,.15); }
    .menu-btn{
      display:flex; align-items:center; justify-content:center;
      width:40px; height:40px; border-radius:8px; border:1px solid var(--gold-soft);
      background:#fff; cursor:pointer; flex-direction:column; gap:4px; padding:0;
    }
    .menu-btn span{ width:20px; height:2px; background:var(--ink-brown); display:block; }
  }

  .page-head{ text-align:center; padding:56px 20px 8px; }
  .eyebrow{
    font-family:'Marcellus'; color:var(--gold); font-size:14px; letter-spacing:.12em;
    text-transform:uppercase; margin:0 0 8px;
  }
  .page-head h1{ font-family:'Marcellus'; font-size:clamp(28px,4vw,42px); color:var(--ink-navy); margin:0 0 14px; }
  .page-head p{ font-size:19px; color:#6b5a3f; line-height:1.6; max-width:640px; margin:0 auto; }

  .search-row{ max-width:520px; margin:30px auto 0; padding:0 20px; }
  .search-row input{
    width:100%; font-family:'Cormorant Garamond', serif; font-size:17px; padding:12px 18px;
    border:1.5px solid var(--gold-soft); border-radius:24px; background:#fff; color:var(--ink-brown);
  }
  .search-row input:focus{ outline:none; border-color:var(--gold); }

  .library{ max-width:var(--maxw); margin:0 auto; padding:36px 20px 90px; }
  .surah-block{ margin-bottom:36px; }
  .surah-title{
    font-family:'Marcellus'; font-size:20px; color:var(--ink-navy); margin:0 0 14px;
    display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--gold-soft); padding-bottom:8px;
  }
  .surah-title .ar{ color:var(--gold); font-size:18px; }
  .episode-list{ display:flex; flex-direction:column; gap:14px; }
  .episode-card{
    background:var(--parchment); border:1.5px solid var(--gold-soft); border-radius:14px;
    padding:18px 22px; box-shadow:0 5px 14px rgba(60,45,20,.07);
  }
  .episode-top{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:6px; }
  .episode-title{ font-family:'Marcellus'; font-size:18px; color:var(--ink-navy); margin:0; }
  .episode-ref{ font-size:14px; color:var(--gold); font-family:'Marcellus'; white-space:nowrap; }
  .episode-desc{ font-size:15.5px; color:#6b5a3f; line-height:1.5; margin:0 0 12px; }
  .episode-card audio{ width:100%; }

  .empty-state{
    max-width:560px; margin:20px auto 0; text-align:center; background:var(--parchment);
    border:1.5px dashed var(--gold-soft); border-radius:16px; padding:44px 30px;
  }
  .empty-state .icon{ font-size:38px; margin-bottom:12px; }
  .empty-state h3{ font-family:'Marcellus'; font-size:21px; color:var(--ink-navy); margin:0 0 10px; }
  .empty-state p{ font-size:16px; color:#6b5a3f; line-height:1.6; margin:0; }
  .no-results{ text-align:center; font-size:17px; color:#8a7a5c; padding:30px 20px; }

  .btn{
    display:inline-block; text-align:center; text-decoration:none; font-family:'Cormorant Garamond', serif;
    font-weight:700; font-size:16px; padding:11px 26px; border-radius:26px;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn-primary{ background:var(--green); color:#faf3e0; }
  .btn-primary:hover{ background:var(--green-dark); }

  footer{ background:var(--ink-navy); color:#c9d2e0; padding:36px 20px 24px; text-align:center; }
  footer .flinks{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  footer .flinks a{ text-decoration:none; color:#c9d2e0; }
  footer .flinks a:hover{ color:#faf3e0; }
  footer .fine{ font-size:13px; color:#8b96ab; margin:0; }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="brand" href="/">
      <span class="brand-mark arabic">د</span>
      <span class="brand-text">Diin Islaam<small>دين الإسلام</small></span>
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="main-links" id="mainNav">
      <a href="/#classes" class="active">Classes</a>
      <a href="apps.html">Apps</a>
      <a href="/#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="page-head">
  <p class="eyebrow">Qur'ān Studies · Tafsīr</p>
  <h1>Tafsīr Audio Library</h1>
  <p>Listen to Tafsīr lessons, organized by Sūrah. New episodes are added regularly.</p>
</div>

<div class="search-row">
  <input type="text" id="searchBox" placeholder="Search by Sūrah or title…" autocomplete="off">
</div>

<div class="library" id="library"></div>

<footer>
  <div class="flinks">
    <a href="quran.html">Qur'ān Classes</a>
    <a href="apps.html">Apps</a>
    <a href="mailto:fesbackups@gmail.com">Contact</a>
  </div>
  <p class="fine">© <span id="year"></span> Diin Islaam · diinislaam.com</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- nav ---------- */
const menuBtn = document.getElementById('menuBtn');
const mainNav = document.getElementById('mainNav');
menuBtn.addEventListener('click', () => {
  const open = mainNav.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', open);
});
mainNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  mainNav.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}));

/*
  ============================================================
  HOW TO ADD A NEW TAFSĪR EPISODE
  ============================================================
  1. Put the audio file (.mp3 works everywhere) in the
     /tafseer-audio/ folder in this repository.
  2. Add one entry to the EPISODES array below, e.g.:

     { surah: "Al-Fatihah", surahAr: "الفاتحة", title: "Introduction & Verses 1-3",
       file: "tafseer-audio/01-al-fatihah-part1.mp3",
       desc: "An overview of the Surah's themes and the meaning of the first three ayat." }

  3. Commit and push (or upload the file + edit this file directly
     on github.com) — the episode appears automatically, grouped
     under its Sūrah, newest surah groups first in this list.

  Note: GitHub Pages works best with individual files under ~50MB
  and a total repo size under ~1GB, so keep audio at a reasonable
  bitrate (e.g. 64-96kbps mono for spoken word) if the library grows large.
  ============================================================
*/
const EPISODES = [
  // Add episodes here.
];

/* ---------- render ---------- */
const library = document.getElementById('library');
const searchBox = document.getElementById('searchBox');

function groupBySurah(episodes){
  const groups = [];
  const index = new Map();
  episodes.forEach(ep => {
    if (!index.has(ep.surah)){
      index.set(ep.surah, { surah: ep.surah, surahAr: ep.surahAr, episodes: [] });
      groups.push(index.get(ep.surah));
    }
    index.get(ep.surah).episodes.push(ep);
  });
  return groups;
}

function render(filterText){
  const term = (filterText || '').trim().toLowerCase();
  const filtered = term
    ? EPISODES.filter(ep =>
        ep.surah.toLowerCase().includes(term) ||
        ep.title.toLowerCase().includes(term) ||
        (ep.desc || '').toLowerCase().includes(term))
    : EPISODES;

  if (EPISODES.length === 0){
    library.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎧</div>
        <h3>The library is just getting started</h3>
        <p>Tafsīr audio episodes will appear here as they're added. Check back soon, or get in touch if you'd like to be notified when new episodes are posted.</p>
      </div>
    `;
    return;
  }

  if (filtered.length === 0){
    library.innerHTML = `<p class="no-results">No episodes match "${filterText}".</p>`;
    return;
  }

  const groups = groupBySurah(filtered);
  library.innerHTML = groups.map(g => `
    <div class="surah-block">
      <h2 class="surah-title">${g.surah} <span class="ar arabic">${g.surahAr || ''}</span></h2>
      <div class="episode-list">
        ${g.episodes.map(ep => `
          <div class="episode-card">
            <div class="episode-top">
              <h3 class="episode-title">${ep.title}</h3>
              ${ep.ref ? `<span class="episode-ref">${ep.ref}</span>` : ''}
            </div>
            ${ep.desc ? `<p class="episode-desc">${ep.desc}</p>` : ''}
            <audio controls preload="none" src="${ep.file}"></audio>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

searchBox.addEventListener('input', () => render(searchBox.value));
render('');
</script>
</body>
</html>
