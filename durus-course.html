<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدروس المهمة — Durūs al-Muhimmah (6-Week Course)</title>
<meta name="description" content="Durūs al-Muhimmah lil ʿĀmmah — Important Lessons for Every Muslim. A 6-week interactive course with weekly quizzes, a midterm, a final exam, and a certificate of completion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --scale:1.15;
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --red:#9c3d3d; --red-bg:#f4e0df;
    --blue:#5b8fc9; --blue-bg:#dfeaf7;
    --pink:#c9598a; --pink-bg:#fbe4ee;
    --purple:#7d5ba6; --purple-bg:#ece3f5;
  }
  *{ box-sizing:border-box; }
  html,body{ overflow-x:clip; }
  body{
    margin:0; background:var(--parchment); color:var(--ink-brown);
    font-family:'Cormorant Garamond', serif; font-size:calc(17px * var(--scale));
    line-height:1.65;
  }
  a{ color:inherit; }
  .arabic{ font-family:'Amiri', serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }

  /* ===== Main site header ===== */
  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  header.site .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; max-width:1120px; margin:0 auto;
  }
  header.site .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  header.site .brand-mark{
    width:38px; height:38px; border-radius:50%; background:var(--green);
    display:flex; align-items:center; justify-content:center;
    color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none;
  }
  header.site .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  header.site .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  header.site nav.site-links{ display:flex; align-items:center; gap:28px; }
  header.site nav.site-links a{
    text-decoration:none; font-size:17px; color:var(--ink-brown); font-weight:600;
    padding:6px 2px; border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
  }
  header.site nav.site-links a:hover{ color:var(--green); border-color:var(--gold-soft); }
  header.site nav.site-links a.active{ color:var(--green); border-color:var(--green); }
  header.site .menu-btn{ display:none; }
  @media (max-width:820px){
    header.site nav.site-links{
      display:none; position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch;
      background:var(--parchment); border-bottom:1px solid var(--gold-soft);
      padding:10px 20px 18px; gap:4px; box-shadow:0 12px 20px rgba(60,45,20,.12);
    }
    header.site nav.site-links.open{ display:flex; }
    header.site nav.site-links a{ padding:10px 4px; border-bottom:1px solid rgba(169,124,37,.15); }
    header.site .menu-btn{
      display:flex; align-items:center; justify-content:center;
      width:40px; height:40px; border-radius:8px; border:1px solid var(--gold-soft);
      background:#fff; cursor:pointer; flex-direction:column; gap:4px; padding:0;
    }
    header.site .menu-btn span{ width:20px; height:2px; background:var(--ink-brown); display:block; }
  }

  /* ===== Sticky top bar (course-level) ===== */
  .topbar{
    position:sticky; top:71px; z-index:20; background:var(--parchment);
    border-bottom:2px solid var(--gold-soft); padding:12px 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 2px 10px rgba(60,47,38,0.06); text-align:center;
  }
  .font-size-control{
    position:absolute; top:10px; right:14px; z-index:21;
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1.5px solid var(--gold-soft); border-radius:18px;
    padding:4px 10px;
  }
  .font-size-control button{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--gold-soft);
    background:var(--parchment); color:var(--ink-brown); font-size:15px; font-weight:700;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, transform .15s ease; padding:0;
  }
  .font-size-control button:hover{ background:var(--parchment-deep); transform:scale(1.08); }
  .font-size-control button:disabled{ opacity:.4; cursor:default; transform:none; }
  #font-size-readout{ font-size:12px; font-weight:700; color:var(--ink-brown); min-width:34px; text-align:center; }

  .back-to-weeks-btn{
    position:absolute; top:10px; left:14px; z-index:21;
    background:#fff; border:1.5px solid var(--gold-soft); border-radius:18px;
    padding:6px 12px; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:calc(12.5px * var(--scale)); color:var(--ink-brown); cursor:pointer;
    display:flex; align-items:center; gap:5px; transition:background .15s ease, transform .15s ease;
  }
  .back-to-weeks-btn:hover{ background:var(--parchment-deep); transform:scale(1.04); }

  .topbar-title{ display:flex; flex-direction:column; line-height:1.25; align-items:center; }
  .topbar-title .ar{ font-family:'Amiri', serif; font-size:calc(16px * var(--scale)); color:var(--gold); }
  .topbar-title .en{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:calc(14.5px * var(--scale)); color:var(--ink-navy); }

  /* ===== Name gate ===== */
  #name-gate{ display:flex; justify-content:center; padding:40px 10px; }
  .name-gate-box{
    max-width:420px; width:100%; text-align:center; background:#fff;
    border:2px solid var(--gold-soft); border-radius:16px; padding:30px 26px;
    box-shadow:0 4px 16px rgba(60,47,38,0.08);
  }
  #name-gate-label{ font-size:calc(15px * var(--scale)); color:var(--ink-brown); margin:0 0 14px; font-weight:700; }
  #student-name-input{
    width:100%; padding:12px 16px; border:1.5px solid var(--gold-soft); border-radius:10px;
    font-family:'Cormorant Garamond', serif; font-size:calc(16px * var(--scale)); text-align:center;
    background:var(--parchment); color:var(--ink-navy); margin-bottom:14px;
  }
  #student-name-input:focus{ outline:none; border-color:var(--gold); }
  .name-warning{ color:var(--red); font-size:calc(13px * var(--scale)); margin:-6px 0 12px; }
  #name-start-btn{
    background:var(--gold); color:#fff8ea; border:none; border-radius:22px;
    padding:11px 32px; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:calc(15px * var(--scale)); cursor:pointer; transition:transform .15s ease;
  }
  #name-start-btn:hover{ transform:scale(1.04); }

  /* ===== Week select hub ===== */
  #week-select{ max-width:520px; margin:10px auto 0; text-align:center; }
  .week-select-lead{ font-size:calc(14.5px * var(--scale)); color:var(--ink-brown); font-weight:700; margin:0 0 16px; }
  .week-select-grid{ display:flex; flex-direction:column; gap:12px; }
  .week-select-btn{
    background:var(--gold); color:#fff8ea; border:none; border-radius:22px;
    padding:14px 24px; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:calc(16px * var(--scale)); cursor:pointer; transition:transform .15s ease, background .15s ease;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .week-select-btn:hover{ transform:scale(1.03); background:#b8862c; }
  .week-select-btn.milestone{ background:var(--ink-navy); }
  .week-select-btn.milestone:hover{ background:#28395c; }
  .week-select-btn.finale{ background:var(--green); }
  .week-select-btn.finale:hover{ background:var(--green-dark); }
  .week-select-btn .wsb-ar{ font-family:'Amiri', serif; opacity:.9; }
  .week-select-btn .wsb-en::after{ content:' ·'; opacity:.7; }

  /* ===== Welcome banner ===== */
  .welcome-banner{
    max-width:560px; margin:6px auto 22px; text-align:center;
    background:var(--green-bg); border:1.5px solid var(--green); border-radius:14px;
    padding:14px 22px;
  }
  .welcome-line{ margin:0; font-size:calc(15.5px * var(--scale)); font-weight:700; color:var(--green); }
  .welcome-quote{ margin:8px 0 0; font-size:calc(13px * var(--scale)); color:var(--ink-brown); font-style:italic; line-height:1.6; }
  .welcome-quote .quote-ar{ display:block; font-family:'Amiri', serif; font-size:calc(15px * var(--scale)); direction:rtl; margin-bottom:3px; }
  .welcome-quote .quote-en{ display:block; }

  /* ===== Hero ===== */
  .hero{ text-align:center; padding:28px 10px 20px; }
  .hero-eyebrow{ color:var(--gold); font-family:'Amiri', serif; font-size:calc(16px * var(--scale)); margin:0 0 6px; }
  .week-badge{
    display:inline-block; background:var(--ink-navy); color:#fdf6e3; font-weight:700;
    font-size:calc(13px * var(--scale)); padding:5px 16px; border-radius:14px; margin:0 0 16px;
  }
  .hero h1{
    font-family:'Amiri', serif; font-weight:700; font-size:calc(30px * var(--scale));
    margin:0 0 8px; color:var(--ink-navy);
  }
  .hero h1.en-title{ font-family:'Cormorant Garamond', serif; font-size:calc(26px * var(--scale)); }
  .hero p{ color:var(--ink-brown); font-size:calc(16px * var(--scale)); max-width:520px; margin:0 auto; }

  /* ===== Section ===== */
  .section{ margin:34px 0; }
  .section-title{
    display:flex; align-items:center; gap:10px; margin:0 0 16px;
    font-family:'Amiri', serif; font-weight:700; font-size:calc(20px * var(--scale)); color:var(--ink-navy);
  }
  .section-title .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%; background:var(--gold); color:#fff8ea;
    font-family:'Cormorant Garamond', serif; font-weight:700; font-size:calc(15px * var(--scale)); flex-shrink:0;
  }
  .lead{ color:var(--ink-brown); margin:0 0 16px; }

  /* ===== Definition / info cards ===== */
  .def-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:560px){ .def-grid{ grid-template-columns:1fr 1fr; } }
  .def-grid.cols-3{ grid-template-columns:1fr; }
  @media(min-width:640px){ .def-grid.cols-3{ grid-template-columns:1fr 1fr 1fr; } }
  .def-card{ border-radius:14px; padding:18px 20px; border:2px solid; }
  .def-card.c-blue{ background:var(--blue-bg); border-color:var(--blue); }
  .def-card.c-pink{ background:var(--pink-bg); border-color:var(--pink); }
  .def-card.c-purple{ background:var(--purple-bg); border-color:var(--purple); }
  .def-card.c-green{ background:var(--green-bg); border-color:var(--green); }
  .def-card.c-red{ background:var(--red-bg); border-color:var(--red); }
  .def-card h3{ margin:0 0 8px; font-family:'Amiri', serif; font-size:calc(18px * var(--scale)); }
  .def-card.c-blue h3{ color:#2c5482; }
  .def-card.c-pink h3{ color:#93356a; }
  .def-card.c-purple h3{ color:#5b3d80; }
  .def-card.c-green h3{ color:var(--green-dark); }
  .def-card.c-red h3{ color:var(--red); }
  .def-card p{ margin:0 0 10px; font-size:calc(14.5px * var(--scale)); }
  .def-card .ex{
    font-family:'Amiri', serif; font-size:calc(15px * var(--scale)); background:rgba(255,255,255,0.55);
    border-radius:8px; padding:8px 12px; direction:rtl; text-align:center;
  }

  /* ===== Rule callout ===== */
  .rule-box{
    background:var(--parchment-deep); border-left:4px solid var(--gold); border-radius:10px;
    padding:16px 20px; margin:0 0 18px;
  }
  .rule-box ul{ margin:8px 0 0; padding-inline-start:20px; }
  .rule-box li{ margin-bottom:6px; font-size:calc(14.5px * var(--scale)); }

  /* ===== Numbered sub-rules ===== */
  .sub-rules{ display:flex; flex-direction:column; gap:10px; margin:14px 0; }
  .sub-rule{
    display:flex; gap:12px; align-items:flex-start; background:#fff;
    border:1.5px solid var(--gold-soft); border-radius:10px; padding:12px 14px;
  }
  .sub-rule .srnum{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--gold-soft);
    color:#fff8ea; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:calc(13px * var(--scale));
  }
  .sub-rule .srbody{ font-size:calc(14.5px * var(--scale)); }
  .sub-rule .srbody b{ color:var(--ink-navy); }
  .sub-rule .srex{ font-family:'Amiri', serif; direction:rtl; color:#5c4a30; font-size:calc(15px * var(--scale)); margin-top:4px; }

  /* ===== Note box ===== */
  .note-box{
    background:var(--green-bg); border:1.5px solid var(--green); border-radius:12px;
    padding:16px 20px; margin-top:10px;
  }
  .note-box .note-title{ font-weight:700; color:var(--green-dark); margin:0 0 8px; font-size:calc(14.5px * var(--scale)); }
  .note-box p{ margin:0; font-size:calc(14px * var(--scale)); }
  .note-box .term-pair{ font-family:'Amiri', serif; direction:rtl; display:inline-block; }

  hr.divider{ border:none; border-top:2px dashed var(--gold-soft); margin:38px 0; }

  /* ===== Stepper ===== */
  .step-progress-row{
    display:flex; align-items:center; gap:12px; margin:18px 0 26px;
    font-size:calc(13px * var(--scale)); color:var(--ink-brown); font-weight:700;
  }
  .step-progress-track{ flex:1; height:8px; background:var(--parchment-deep); border-radius:5px; overflow:hidden; }
  .step-progress-fill{ height:100%; background:var(--gold); border-radius:5px; transition:width .35s ease; width:0%; }
  #step-viewport{ min-height:200px; animation:step-fade-in .35s ease; }
  @keyframes step-fade-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .step-nav-row{
    display:flex; justify-content:space-between; align-items:center; margin:30px 0 10px;
    position:sticky; bottom:0; background:var(--parchment); padding:12px 0 6px;
  }
  #step-back-btn{ visibility:hidden; }
  #step-back-btn.show{ visibility:visible; }
  .qbtn.solid#step-next-btn{ padding:12px 30px; font-size:calc(15.5px * var(--scale)); }

  /* ===== Quiz section (reused engine) ===== */
  .quiz-shell{
    background:#fff; border:2px solid var(--gold-soft); border-radius:16px; padding:20px;
    box-shadow:0 4px 16px rgba(60,47,38,0.08);
  }
  .quiz-progress-row{ display:flex; justify-content:space-between; align-items:center; font-size:calc(13px * var(--scale)); margin-bottom:14px; color:var(--ink-brown); }
  .quiz-bar-track{ flex:1; height:8px; background:var(--parchment-deep); border-radius:5px; margin:0 12px; overflow:hidden; }
  .quiz-bar-fill{ height:100%; background:var(--gold); border-radius:5px; transition:width .3s ease; width:0%; }
  .q-head{ display:flex; gap:10px; align-items:flex-start; margin-bottom:14px; }
  .q-num{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:calc(13.5px * var(--scale));
  }
  .q-text{ font-weight:700; font-size:calc(16px * var(--scale)); color:var(--ink-navy); }
  .q-options{ display:flex; flex-direction:column; gap:9px; position:relative; }
  .q-option{
    display:flex; align-items:center; gap:10px; border:1.5px solid var(--gold-soft);
    border-radius:8px; padding:10px 14px; cursor:pointer; background:var(--parchment);
    font-size:calc(15px * var(--scale)); transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .q-option:hover{ background:var(--parchment-deep); transform:translateX(3px); }
  .q-option .letter{ font-weight:700; color:var(--blue); flex-shrink:0; }
  .q-option.selected{ background:var(--green-bg); border-color:var(--green); border-width:2px; }
  .q-option.selected .letter{ color:var(--green); }
  .q-option.opt-correct{ border-color:var(--green) !important; background:var(--green-bg) !important; }
  .q-option.opt-wrong{ border-color:var(--red) !important; background:var(--red-bg) !important; }
  .q-options.locked .q-option{ cursor:default; }
  .q-options.locked .q-option:hover{ transform:none; background:var(--parchment); }
  .q-options.locked .q-option.opt-correct:hover,
  .q-options.locked .q-option.opt-wrong:hover{ background:inherit; }
  .rq-explanation-inline{
    margin-top:14px; padding:12px 16px; border-radius:10px;
    background:var(--green-bg); border:1.5px solid var(--green);
    font-size:calc(13.5px * var(--scale)); color:#2f5233; line-height:1.7; text-align:start;
  }
  @keyframes celebrate-pop{
    0%{ transform:scale(1); } 35%{ transform:scale(1.03); } 60%{ transform:scale(0.99); } 100%{ transform:scale(1); }
  }
  .q-option.opt-correct.celebrate{ animation:celebrate-pop .45s ease; }
  @keyframes shake-wrong{
    0%, 100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(5px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(3px); }
  }
  .q-option.opt-wrong.shake{ animation:shake-wrong .4s ease; }
  .quiz-nav-row{ display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .qbtn{
    border:none; border-radius:22px; padding:10px 20px; font-family:'Cormorant Garamond', serif;
    font-weight:700; font-size:calc(14.5px * var(--scale)); cursor:pointer; transition:transform .15s ease, opacity .15s ease;
  }
  .qbtn:hover{ transform:scale(1.03); }
  .qbtn:disabled{ opacity:.4; cursor:default; transform:none; }
  .qbtn.ghost{ background:#fff; border:1.5px solid var(--gold-soft); color:var(--ink-brown); }
  .qbtn.solid{ background:var(--gold); color:#fff8ea; }
  .quiz-dots{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:16px; }
  .quiz-dot{ width:10px; height:10px; border-radius:50%; background:var(--parchment-deep); border:1px solid var(--gold-soft); }
  .quiz-dot.dot-current{ background:var(--gold); }
  .quiz-dot.dot-answered{ background:var(--gold-soft); }

  .quiz-summary{ display:none; text-align:center; }
  .quiz-summary.show{ display:block; }
  .quiz-summary .score-title{ font-size:calc(17px * var(--scale)); font-weight:700; color:var(--green); margin:0 0 4px; }
  .quiz-summary .score-pct{ font-family:'Amiri', serif; font-weight:700; font-size:calc(44px * var(--scale)); color:var(--ink-navy); margin:6px 0; }
  .quiz-summary .score-msg{ font-size:calc(15px * var(--scale)); color:var(--ink-brown); margin-bottom:18px; }
  .review-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0; }
  .review-num{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; font-weight:700;
    color:#fff; font-family:'Cormorant Garamond', serif; font-size:calc(13.5px * var(--scale));
  }
  .review-num.rn-correct{ background:var(--green); }
  .review-num.rn-wrong{ background:var(--red); }
  .review-detail{
    text-align:start; background:var(--parchment); border-radius:10px; padding:16px; margin-top:10px;
    display:none; font-size:calc(13.5px * var(--scale));
  }
  .review-detail.show{ display:block; }
  .review-detail .rd-q{ font-weight:700; color:var(--ink-navy); margin-bottom:8px; }
  .review-detail .rd-your{ color:var(--red); margin-bottom:4px; }
  .review-detail .rd-correct{ color:var(--green); margin-bottom:8px; }
  .review-detail .rd-expl{ background:#fff; border-radius:8px; padding:10px 12px; }
  .retake-btn{ background:var(--gold); color:#fff8ea; border:none; border-radius:22px; padding:11px 26px; font-family:'Cormorant Garamond', serif; font-weight:700; font-size:calc(14.5px * var(--scale)); cursor:pointer; margin-top:10px; }
  .cert-cta{ margin-top:18px; }
  .cert-cta .qbtn.solid{ background:var(--green); }
  .lock-msg{ margin-top:16px; font-size:calc(14px * var(--scale)); color:var(--red); font-weight:700; }

  /* ===== Certificate progress checklist ===== */
  .progress-list{ max-width:440px; margin:10px auto 0; display:flex; flex-direction:column; gap:10px; }
  .progress-row{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--gold-soft);
    border-radius:10px; padding:10px 14px; font-size:calc(14.5px * var(--scale));
  }
  .progress-row.pr-done{ border-color:var(--green); background:var(--green-bg); }
  .progress-row.pr-pending{ border-color:var(--red); background:var(--red-bg); }
  .pr-icon{ flex-shrink:0; }
  .pr-label{ flex:1; font-weight:700; color:var(--ink-navy); }
  .pr-jump-btn{
    background:var(--gold); color:#fff8ea; border:none; border-radius:16px; padding:6px 14px;
    font-family:'Cormorant Garamond', serif; font-weight:700; font-size:calc(12.5px * var(--scale));

/* ===================== FONT SIZE CONTROL ===================== */
var FONT_SCALE_MIN = 0.8;
var FONT_SCALE_MAX = 1.5;
var FONT_SCALE_STEP = 0.1;
var currentFontScale = 1.15;

function applyFontScale(){
  document.documentElement.style.setProperty('--scale', currentFontScale.toFixed(2));
  document.getElementById('font-size-readout').textContent = Math.round(currentFontScale * 100) + '%';
  document.getElementById('font-decrease-btn').disabled = (currentFontScale <= FONT_SCALE_MIN + 0.001);
  document.getElementById('font-increase-btn').disabled = (currentFontScale >= FONT_SCALE_MAX - 0.001);
}
document.getElementById('font-decrease-btn').addEventListener('click', function(){
  currentFontScale = Math.max(FONT_SCALE_MIN, +(currentFontScale - FONT_SCALE_STEP).toFixed(2));
  applyFontScale();
});
document.getElementById('font-increase-btn').addEventListener('click', function(){
  currentFontScale = Math.min(FONT_SCALE_MAX, +(currentFontScale + FONT_SCALE_STEP).toFixed(2));
  applyFontScale();
});
applyFontScale();

/* ===================== SOUND ENGINE ===================== */
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playNote(ctx, freq, startTime, duration, type, gainPeak){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.15, startTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function playClickSound(){
  var ctx = getAudioCtx();
  playNote(ctx, 720, ctx.currentTime, 0.09, 'sine', 0.10);
}
function playCorrectSound(){
  var ctx = getAudioCtx();
  var t = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach(function(freq, i){
    playNote(ctx, freq, t + i * 0.08, 0.2, 'triangle', 0.14);
  });
}
function playWrongSound(){
  var ctx = getAudioCtx();
  var t = ctx.currentTime;
  playNote(ctx, 196.00, t, 0.2, 'sawtooth', 0.11);
  playNote(ctx, 174.61, t + 0.13, 0.24, 'sawtooth', 0.11);
}

  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);

/* ===================== LESSON CONTENT ===================== */
var WEEK1_LESSON =
  '<div class="hero">' +
    '<p class="hero-eyebrow">القرآن الكريم</p>' +
    '<h1>The Qur\'an — Learning It, Reciting It, Reflecting On It</h1>' +

    '<div class="def-grid">' +
      '<div class="def-card c-green"><h3>Its Content</h3><p>Praise of Allah, affirmation of His Lordship and the Last Day, and a direct plea: guide us to the Straight Path — the path of those You have favored, not of those who earned Your anger or went astray.</p></div>' +

/* ===================== PROGRESS TRACKING (recorded per student, per browser) ===================== */
var stepDone = new Array(STEP_DEFS.length).fill(false);

function progressKey(name){ return 'durusProgress_' + name.trim().toLowerCase(); }

function saveProgress(){
  if(!studentName) return;
  try{
    localStorage.setItem(progressKey(studentName), JSON.stringify({
      stepDone: stepDone,
      finalExamScorePct: finalExamScorePct
    }));
  } catch(e){ /* localStorage unavailable — progress just won't persist */ }
}

function loadProgress(name){
  try{
    var raw = localStorage.getItem(progressKey(name));
    if(!raw) return null;
    var data = JSON.parse(raw);
    if(!data || !Array.isArray(data.stepDone) || data.stepDone.length !== STEP_DEFS.length) return null;
    return data;
  } catch(e){ return null; }
}

function unitComplete(unit){
  return unit.steps.every(function(s){ return !!stepDone[s]; });
}

function weekBadgeHTML(def){
  return def.weekLabel ? ('<div class="week-badge">' + def.weekLabel + '</div>') : '';
}

function updateStepProgress(){
  document.getElementById('step-progress-text').textContent = 'Step ' + (currentStepIndex + 1) + ' / ' + STEP_DEFS.length;
  var pct = Math.round((currentStepIndex / (STEP_DEFS.length - 1)) * 100);
  document.getElementById('step-progress-fill').style.width = pct + '%';
}

var finalExamScorePct = null;

  var finalExamStepIndex = STEP_DEFS.length - 2;
  var passed = stepDone[finalExamStepIndex] === true;
  if(!passed){

      : 'Score ' + PASS_THRESHOLD + '% or higher on the Final Exam to unlock your certificate.';

function escapeHTML(str){
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderStep(i){
  currentStepIndex = i;
  var def = STEP_DEFS[i];
  var viewport = document.getElementById('step-viewport');
  var nextBtn = document.getElementById('step-next-btn');
  var backBtn = document.getElementById('step-back-btn');

  backBtn.classList.toggle('show', i > 0);
  backBtn.textContent = 'Back';

  if(def.type === 'lesson'){
    viewport.innerHTML = weekBadgeHTML(def) + window[def.html];
    nextBtn.style.display = '';
    nextBtn.disabled = false;
    nextBtn.textContent = 'Next';
    activeQuizInstance = null;
    stepDone[i] = true;
    saveProgress();
  } else if(def.type === 'quiz'){
    viewport.innerHTML = weekBadgeHTML(def) +
      '<div class="section">' +
        '<h2 class="section-title"><span class="num">📝</span><span>' + def.title + '</span></h2>' +
        '<p class="lead">' + def.lead + '</p>' +
        '<div class="quiz-shell" id="active-quiz-slot"></div>' +
      '</div>';
    var slot = document.getElementById('active-quiz-slot');
    slot.innerHTML = quizShellTemplate('sq');
    var bank = window[def.bank];
    nextBtn.style.display = 'none';
    nextBtn.textContent = 'Next';
    activeQuizInstance = createQuizInstance('sq', bank, function(pct){
      if(def.isFinalExam){ finalExamScorePct = pct; }
      if(def.passGate){
        if(pct >= PASS_THRESHOLD){
          stepDone[i] = true;
          nextBtn.style.display = '';
          nextBtn.textContent = def.isFinalExam ? 'View Certificate' : 'Next';
        } else {
          nextBtn.style.display = 'none';
        }
      } else {
        stepDone[i] = true;
        nextBtn.style.display = '';
      }
      saveProgress();
    }, function(){
      nextBtn.style.display = 'none';
    }, !!def.immediate);
  } else if(def.type === 'certificate'){
    renderCertificateStep();
  }

  updateStepProgress();
  document.querySelector('.wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function createQuizInstance(prefix, questions, onFinish, onReset, immediate){
  var index = 0, answered = [], selected = [];
  var justAnsweredAnimate = false;
  var els = {};

  function cacheEls(){
    els.activeArea = document.getElementById(prefix + '-active-area');
    els.summary = document.getElementById(prefix + '-summary');
    els.stage = document.getElementById(prefix + '-stage');
    els.dots = document.getElementById(prefix + '-dots');
    els.barFill = document.getElementById(prefix + '-bar-fill');
    els.progressText = document.getElementById(prefix + '-progress-text');
    els.pctText = document.getElementById(prefix + '-pct-text');
    els.prevBtn = document.getElementById(prefix + '-prev-btn');
    els.nextBtn = document.getElementById(prefix + '-next-btn');
    els.scoreTitle = document.getElementById(prefix + '-score-title');
    els.scorePct = document.getElementById(prefix + '-score-pct');
    els.scoreMsg = document.getElementById(prefix + '-score-msg');
    els.lockMsg = document.getElementById(prefix + '-lock-msg');
    els.reviewGrid = document.getElementById(prefix + '-review-grid');
    els.reviewDetail = document.getElementById(prefix + '-review-detail');
    els.retakeBtn = document.getElementById(prefix + '-retake-btn');
  }

  function renderDots(){
    els.dots.innerHTML = '';
    for(var i = 0; i < questions.length; i++){
      var dot = document.createElement('span');
      dot.className = 'quiz-dot';
      if(i === index) dot.classList.add('dot-current');
      else if(answered[i]) dot.classList.add('dot-answered');
      els.dots.appendChild(dot);
    }
  }

  function renderQuestion(){
    var item = questions[index];
    els.progressText.textContent = 'Question ' + (index + 1) + ' / ' + questions.length;
    var pct = Math.round((index / questions.length) * 100);
    els.barFill.style.width = pct + '%';
    els.pctText.textContent = pct + '%';

    var qDiv = document.createElement('div');
    var headDiv = document.createElement('div');
    headDiv.className = 'q-head';
    headDiv.innerHTML = '<span class="q-num">' + (index + 1) + '</span><span class="q-text">' + item.q + '</span>';
    qDiv.appendChild(headDiv);

    var isAnswered = !!answered[index];
    var showFeedback = immediate && isAnswered;
    var wasCorrect = (selected[index] === item.correct);
    var playAnim = showFeedback && justAnsweredAnimate;
    justAnsweredAnimate = false;

    var optsDiv = document.createElement('div');
    optsDiv.className = 'q-options' + (showFeedback ? ' locked' : '');
    item.options.forEach(function(optText, oIndex){
      var optDiv = document.createElement('div');
      optDiv.className = 'q-option';
      optDiv.innerHTML = '<span class="letter">' + QUIZ_STRINGS.letters[oIndex] + '.</span><span>' + optText + '</span>';
      if(oIndex === selected[index]){ optDiv.classList.add('selected'); }
      if(showFeedback){
        if(oIndex === item.correct){ optDiv.classList.add('opt-correct'); }
        else if(oIndex === selected[index]){ optDiv.classList.add('opt-wrong'); }
        if(playAnim && oIndex === selected[index]){
          optDiv.classList.add(wasCorrect ? 'celebrate' : 'shake');
        }
      }
      optDiv.addEventListener('click', function(){ selectOption(oIndex); });
      optsDiv.appendChild(optDiv);
    });
    qDiv.appendChild(optsDiv);

    if(showFeedback){
      var explDiv = document.createElement('div');
      explDiv.className = 'rq-explanation-inline';
      explDiv.textContent = item.explanation;
      qDiv.appendChild(explDiv);
    }

    els.stage.innerHTML = '';
    els.stage.appendChild(qDiv);

    els.prevBtn.disabled = (index === 0);
    els.nextBtn.textContent = (index === questions.length - 1) ? 'Finish' : 'Next';
    renderDots();
  }

  function selectOption(oIndex){
    if(immediate && answered[index]) return;
    answered[index] = true;
    selected[index] = oIndex;
    if(immediate){
      var item = questions[index];
      justAnsweredAnimate = true;
      if(oIndex === item.correct){ playCorrectSound(); } else { playWrongSound(); }
    } else {
      playClickSound();
    }
    renderQuestion();
  }

  function finish(){
    var correctCount = 0;
    questions.forEach(function(item, i){ if(selected[i] === item.correct) correctCount++; });
    var pct = Math.round((correctCount / questions.length) * 100);

    els.activeArea.style.display = 'none';
    els.summary.classList.add('show');

    var name = studentName || '';
    els.scoreTitle.textContent = name ? ('Well done, ' + name + '! 🌟') : '';
    els.scorePct.textContent = pct + '%';

    var msg = '';
    for(var i = 0; i < QUIZ_STRINGS.scoreMsgs.length; i++){
      if(pct >= QUIZ_STRINGS.scoreMsgs[i][0]){ msg = QUIZ_STRINGS.scoreMsgs[i][1]; break; }
    }
    els.scoreMsg.textContent = msg;

    if(els.lockMsg){
      els.lockMsg.style.display = 'none';
    }

    els.reviewGrid.innerHTML = '';
    questions.forEach(function(item, i){
      var correct = (selected[i] === item.correct);
      var btn = document.createElement('button');
      btn.className = 'review-num ' + (correct ? 'rn-correct' : 'rn-wrong');
      btn.textContent = (i + 1);
      btn.addEventListener('click', function(){ playClickSound(); showDetail(i); });
      els.reviewGrid.appendChild(btn);
    });
    els.reviewDetail.classList.remove('show');
    els.retakeBtn.textContent = 'Retake Quiz';

    if(name){ speakResult(name, correctCount, questions.length, pct); }

    if(typeof onFinish === 'function'){ onFinish(pct); }
  }

  function showDetail(i){
    var item = questions[i];
    var yourIdx = selected[i];
    var yourText = (yourIdx === null || yourIdx === undefined) ? '(no answer)' : item.options[yourIdx];
    var html = '<div class="rd-q">' + (i + 1) + '. ' + item.q + '</div>';
    html += '<div class="rd-your">Your answer: ' + yourText + '</div>';
    html += '<div class="rd-correct">Correct answer: ' + item.options[item.correct] + '</div>';
    html += '<div class="rd-expl">' + item.explanation + '</div>';
    els.reviewDetail.innerHTML = html;
    els.reviewDetail.classList.remove('show');
    void els.reviewDetail.offsetWidth;
    els.reviewDetail.classList.add('show');
    els.reviewDetail.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function reset(){
    index = 0;
    answered = new Array(questions.length).fill(false);
    selected = new Array(questions.length).fill(null);
    els.summary.classList.remove('show');
    els.activeArea.style.display = '';
    els.prevBtn.textContent = 'Previous';
    els.nextBtn.textContent = 'Next';
    renderQuestion();
    if(typeof onReset === 'function'){ onReset(); }
  }

  function bindNav(){
    els.prevBtn.addEventListener('click', function(){
      playClickSound();
      if(index > 0){ index--; renderQuestion(); }
    });
    els.nextBtn.addEventListener('click', function(){
      playClickSound();
      if(index < questions.length - 1){ index++; renderQuestion(); }
      else { finish(); }
    });
    els.retakeBtn.addEventListener('click', function(){ playClickSound(); reset(); });
  }

  cacheEls();
  bindNav();
  reset();

  return {};
}

/* ===================== INIT ===================== */
document.getElementById('student-name-input').focus();
</script>

</body>
