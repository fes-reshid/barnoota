<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Noor Shield</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0E241C;
    color: #F6F5F0;
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  svg { width: 56px; height: 56px; fill: #D9C27E; }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid rgba(246, 245, 240, 0.25);
    border-top-color: #D9C27E;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dhikr {
    text-align: center;
    min-height: 46px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .dhikr.visible { opacity: 1; }
  .dhikr-ar {
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 1.35rem;
    color: #D9C27E;
    line-height: 1.4;
  }
  .dhikr-en {
    font-size: 0.68rem;
    color: rgba(246, 245, 240, 0.5);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12,1L3,5v6c0,5.55 3.84,10.74 9,12c5.16,-1.26 9,-6.45 9,-12V5L12,1zM12,11.99h7c-0.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
    </svg>
    <h1>Noor Shield</h1>
    <div class="spinner" aria-hidden="true"></div>
    <div class="dhikr" id="dhikr" dir="rtl" lang="ar">
      <div class="dhikr-ar" id="dhikr-ar"></div>
      <div class="dhikr-en" id="dhikr-en"></div>
    </div>
  </div>

  <script>
    var PHRASES = [
      { ar: "سُبْحَانَ اللَّهِ", en: "SubhanAllah" },
      { ar: "الْحَمْدُ لِلَّهِ", en: "Alhamdulillah" },
      { ar: "اللَّهُ أَكْبَرُ", en: "Allahu Akbar" }
    ];

    var index = 0;
    var dhikr = document.getElementById("dhikr");
    var arEl = document.getElementById("dhikr-ar");
    var enEl = document.getElementById("dhikr-en");

    function showPhrase(i) {
      arEl.textContent = PHRASES[i].ar;
      enEl.textContent = PHRASES[i].en;
      dhikr.classList.add("visible");
    }

    showPhrase(index);
    setInterval(function () {
      dhikr.classList.remove("visible");
      setTimeout(function () {
        index = (index + 1) % PHRASES.length;
        showPhrase(index);
      }, 400);
    }, 2200);
  </script>
</body>
</html>
