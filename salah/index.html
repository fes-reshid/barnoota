{en:'Second Sujūd & next Rakʿah',ar:'السجدة الثانية والركعة التالية',kind:'repeat',color:'#dbf0ff',icon:'🔁',desc:'Make the second Sujūd. When there is another rakʿah, stand and repeat the prayer cycle.',arab:'رَكْعَةٌ جَدِيدَةٌ',trans:'A new rakʿah',words:[['سَجْدَة','a prostration'],['رَكْعَة','unit of prayer'],['قِيَام','standing']],order:['Sit between the Sujūds','Make the second Sujūd','Stand for the next rakʿah if needed'],q:'How many Sujūds are in one rakʿah?',opts:['Two','One','Four','None'],answer:0,missing:['رَكْعَةٌ','جَدِيدَةٌ'],tip:'Prayer has different numbers of rakʿahs. Learn each prayer with your teacher.'},

];
const activities=[['🔎','Explore'],['📖','Learn'],['🔤','Words'],['🔊','Listen'],['🧩','Put in order'],['✍️','Missing words'],['🎯','Choose'],['🤲','Practise'],['🏆','Challenge']];
let state;try{state=JSON.parse(localStorage.getItem('salahAdventureV1'))||{done:{},stars:0,sound:true}}catch{state={done:{},stars:0,sound:true}};let map=0,act=0,answered=false,selected=[],sequence=0,quiz=0,quizScore=0,flipped={};const root=document.querySelector('#root');function save(){localStorage.setItem('salahAdventureV1',JSON.stringify(state));document.querySelector('#stars').textContent='⭐ '+state.stars;document.querySelector('#sound').textContent=state.sound?'🔊 Sound on':'🔇 Sound off'}function chime(good=true){if(!state.sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)();[0,1,2].forEach((n)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=(good?[523,659,784]:[260,220,190])[n];g.gain.setValueAtTime(.0001,c.currentTime+n*.1);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+n*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+n*.1+.16);o.connect(g).connect(c.destination);o.start(c.currentTime+n*.1);o.stop(c.currentTime+n*.1+.17)});setTimeout(()=>c.close(),700)}catch{}}function speak(s,lang='ar-SA'){if(!('speechSynthesis'in window)){feedback('Speech is unavailable here. Read the phrase aloud with a teacher.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=lang;u.rate=.75;speechSynthesis.speak(u)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function art(l,large=false){let pose=l.kind;let person='';let head='<circle cx="175" cy="68" r="22" fill="#f5bd93" stroke="#235e56" stroke-width="4"/>';let body='<path d="M151 91 Q175 82 199 91 L211 170 H139 Z" fill="#278b79" stroke="#235e56" stroke-width="5" stroke-linejoin="round"/>';let limbs='<path d="M146 110 L128 153 M203 109 L220 153 M155 167 L151 195 M195 167 L198 195" fill="none" stroke="#235e56" stroke-width="13" stroke-linecap="round"/>';
if(pose==='bow'){head='<circle cx="223" cy="104" r="21" fill="#f5bd93" stroke="#235e56" stroke-width="4"/>';body='<path d="M150 95 Q178 76 210 91 L224 117 Q185 119 151 118Z" fill="#278b79" stroke="#235e56" stroke-width="5"/>';limbs='<path d="M151 112 L150 190 M178 115 L178 190 M207 112 L185 143 L180 160" fill="none" stroke="#235e56" stroke-width="13" stroke-linecap="round"/>'}
if(['sit','tashahhud'].includes(pose)){head='<circle cx="176" cy="99" r="22" fill="#f5bd93" stroke="#235e56" stroke-width="4"/>';body='<path d="M153 122 Q175 112 198 122 L203 174 Q166 184 143 174Z" fill="#278b79" stroke="#235e56" stroke-width="5"/>';limbs='<path d="M150 145 L139 176 M202 143 L218 175 M153 179 Q175 201 218 183" fill="none" stroke="#235e56" stroke-width="13" stroke-linecap="round"/>'}
if(pose==='prostrate'||pose==='repeat'){head='<circle cx="226" cy="160" r="19" fill="#f5bd93" stroke="#235e56" stroke-width="4"/>';body='<path d="M125 155 Q145 122 186 128 L224 152 L212 172 Q168 158 132 180Z" fill="#278b79" stroke="#235e56" stroke-width="5"/>';limbs='<path d="M135 160 L115 188 L149 190 M201 163 L200 189 M238 169 L241 190" fill="none" stroke="#235e56" stroke-width="12" stroke-linecap="round"/>'}
if(pose==='qiblah')person='<path d="M77 85 L77 177 L117 177 L117 85 L97 67 Z" fill="#f3c474" stroke="#ab7631" stroke-width="4"/><path d="M78 115 H116 M78 148 H116" stroke="#ab7631" stroke-width="4"/><path d="M104 54 L94 31 L84 54" fill="none" stroke="#d1983f" stroke-width="5"/>';
if(pose==='read')person='<path d="M210 105 Q257 83 271 114 L269 157 Q240 136 210 157Z" fill="#fff" stroke="#a76e3b" stroke-width="4"/><path d="M210 105 Q164 83 150 114 L151 157 Q180 136 210 157Z" fill="#fff" stroke="#a76e3b" stroke-width="4"/><path d="M210 103V158" stroke="#a76e3b" stroke-width="4"/>';
if(pose==='ready')person='<path d="M55 80 Q80 50 107 82 V113 Q80 130 55 113Z" fill="#bfece0" stroke="#3c9e8c" stroke-width="4"/><path d="M80 76 V108 M65 92 H95" stroke="#3c9e8c" stroke-width="5"/>';
return `<svg viewBox="0 0 350 225" role="img" aria-label="Illustration of ${escapeHTML(l.en)}"><circle cx="175" cy="117" r="104" fill="#ffffff99"/><path d="M32 194 Q175 207 318 194" stroke="#88b9a3" stroke-width="7" fill="none"/><path d="M104 189 Q175 178 246 189 L262 207 H88Z" fill="#f4c982" stroke="#c99b50" stroke-width="4"/><path d="M104 189 Q175 177 246 189" stroke="#ec9b6f" stroke-width="5" fill="none"/>${person}${head}${body}${limbs}<circle cx="288" cy="47" r="20" fill="#ffda78"/><path d="M282 47h12M288 41v12" stroke="#b68639" stroke-width="3"/></svg>`}
function home(){if('speechSynthesis'in window) speechSynthesis.cancel();const completed=lessons.filter((_,i)=>state.done[i]).length;const nextIndex=lessons.findIndex((_,i)=>!state.done[i]);const current=nextIndex<0?10:nextIndex;const chapters=[{title:'Getting ready',range:[0,2],hint:'Prepare your heart and begin'},{title:'The prayer movements',range:[2,9],hint:'Learn each movement step by step'},{title:'The final sitting',range:[9,11],hint:'Finish with peace'}];const card=(l,i)=>`<button class="journey-card ${state.done[i]?'complete':i===current?'current':''}" data-map="${i}" style="--tint:${l.color}" aria-label="Map ${i+1}: ${escapeHTML(l.en)}${state.done[i]?', completed':''}"><span class="journey-number">${state.done[i]?'✓':i+1}</span><div class="journey-art">${art(l)}</div><h3>${escapeHTML(l.en)}</h3><div class="ar" dir="rtl">${escapeHTML(l.ar)}</div><div class="journey-footer"><span>${l.icon} Map ${i+1} of 11</span><b>${state.done[i]?'Complete':i===current?'Play now':'Explore →'}</b></div></button>`;root.innerHTML=`<section class="home-hero"><div class="hero-copy"><span class="eyebrow">DIIN ISLAAM • CHILDREN'S COURSE</span><h1>My Salah Adventure <span dir="rtl">رِحْلَتِي مَعَ الصَّلَاةِ</span></h1><p>Learn to pray, one little step at a time. Explore pictures, hear Arabic, play word games and collect stars across 11 maps.</p><button class="primary" id="start">${completed?'Continue my journey':'Start the journey'} →</button></div><div class="hero-stage"><div class="hero-arch"></div>${art(lessons[2],true)}<span class="hero-spark a">✦</span><span class="hero-spark b">✧</span></div></section><section class="progress-panel" aria-label="Course progress"><div class="progress-ring" style="--progress:${Math.round(completed/11*100)}%"><strong>${Math.round(completed/11*100)}%</strong></div><div><h2>${completed===11?'All 11 maps completed!':completed?'Your journey continues':'Your adventure starts here'}</h2><p>${completed} of 11 maps completed · ${completed===11?'You can revisit any map':`Next: Map ${current+1} — ${escapeHTML(lessons[current].en)}`}</p></div><div class="star-count">⭐ ${state.stars} stars</div></section><div class="journey-title"><span class="eyebrow">CHOOSE A MAP</span><h2>Follow the Salah journey</h2><p>Tap any map to explore its nine playful activities.</p></div>${chapters.map((c,n)=>`<section class="chapter"><div class="chapter-heading"><span>Chapter ${n+1} · ${c.title}</span><small>${c.hint}</small></div><div class="journey-grid">${lessons.slice(...c.range).map((l,j)=>card(l,c.range[0]+j)).join('')}</div></section>`).join('')}<div class="home-note"><span>🌱</span><p>Practice the movements and recitation with a parent or teacher. <a href="../salah.html">Explore Fiqh of Salah</a> for another course.</p></div>`;document.querySelector('#start').onclick=()=>openMap(current);document.querySelectorAll('[data-map]').forEach(el=>el.onclick=()=>openMap(+el.dataset.map))}
function openMap(i){map=i;act=0;render()}function feedback(msg,bad=false){let e=document.querySelector('#feedback');if(e){e.textContent=msg;e.className='feedback'+(bad?' try':'')}}function next(){if(act<8){act++;render()}else{if(!state.done[map]){state.done[map]=true;state.stars+=10;chime();save()}root.innerHTML=`<div class="stage" style="text-align:center;margin:30px auto;max-width:700px"><div class="reward">🏆</div><h1>Map ${map+1} complete!</h1><p class="arabic">أَحْسَنْتَ! أَحْسَنْتِ!</p><p>You earned 10 stars. Review this map anytime.</p><div class="controls" style="justify-content:center"><button class="secondary" onclick="home()">🗺️ All maps</button><button class="primary" onclick="openMap(${Math.min(map+1,10)})">${map<10?'Next map →':'Review final map'}</button></div></div>`}}
function render(){answered=false;selected=[];sequence=0;quiz=0;quizScore=0;flipped={};let l=lessons[map],a=activities[act];root.innerHTML=`<div class="lesson-head"><button class="secondary" onclick="home()">← Maps</button><div><h1>Map ${map+1}: ${escapeHTML(l.en)}</h1><p dir="rtl" class="arabic" style="font-size:25px">${escapeHTML(l.ar)}</p></div></div><div class="lesson-layout"><div class="stage"><div class="stepbar" aria-label="Activity progress">${activities.map((x,n)=>`<button title="${x[1]}" class="stepdot ${n<act?'complete':n===act?'active':''}" onclick="setActivity(${n})" aria-label="Activity ${n+1}: ${x[1]}"></button>`).join('')}</div><div class="activity-top"><span>Activity ${act+1} of 9</span><strong>${a[0]} ${a[1]}</strong></div><div id="activity" class="activity"></div><div id="feedback" role="status" aria-live="polite"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">${act===8?'Finish map':'Next activity'} →</button></div></div><aside class="sidebar"><span class="side-label">Your learning card</span><h3>${l.icon} ${escapeHTML(l.en)}</h3><div class="arabic">${escapeHTML(l.ar)}</div><p>${escapeHTML(l.desc)}</p><div class="tip"><strong>🌟 Helpful hint</strong><br>${escapeHTML(l.tip)}</div><div class="tip"><strong>🧭 Journey</strong><br>Map ${map+1} / 11 • ${act+1} / 9 activities</div></aside></div>`;document.querySelector('#prev').onclick=()=>{if(act>0){act--;render()}else home()};document.querySelector('#next').onclick=next;drawActivity()}
function setActivity(n){act=n;render()}
function drawActivity(){const l=lessons[map],e=document.querySelector('#activity');let phrase=`<div class="phrase"><div class="arabic">${escapeHTML(l.arab)}</div><small>${escapeHTML(l.trans)}</small></div>`;if(act===0){e.innerHTML=`<h2>Discover the picture</h2><p>Look closely at this step. Tap the picture to reveal the learning clue.</p><button class="big-visual" style="width:100%;border:0" id="reveal" aria-label="Reveal picture clue">${art(l,true)}</button><div id="clue" class="tip" hidden><strong>🔎 I notice:</strong> ${escapeHTML(l.desc)}</div>`;document.querySelector('#reveal').onclick=()=>{document.querySelector('#clue').hidden=false;chime()}}
if(act===1){e.innerHTML=`<h2>Learn the step</h2><div class="big-visual">${art(l,true)}</div><p style="font-size:20px"><strong>${escapeHTML(l.desc)}</strong></p>${phrase}<button class="secondary" id="hear">🔊 Hear Arabic</button>`;document.querySelector('#hear').onclick=()=>speak(l.arab)}
if(act===2){e.innerHTML=`<h2>Flip the word cards</h2><p>Tap each Arabic word to see what it means.</p><div class="vocab-grid">${l.words.map((w,i)=>`<button class="flip" data-flip="${i}"><span class="arabic">${escapeHTML(w[0])}</span><br><span class="muted">Tap to reveal</span></button>`).join('')}</div>`;document.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{let i=+b.dataset.flip;flipped[i]=!flipped[i];b.innerHTML=flipped[i]?`<strong>${escapeHTML(l.words[i][1])}</strong><br><small>${escapeHTML(l.words[i][0])}</small>`:`<span class="arabic">${escapeHTML(l.words[i][0])}</span><br><span class="muted">Tap to reveal</span>`;chime()})}
if(act===3){e.innerHTML=`<h2>Listen and say it</h2><p>Tap to hear the Arabic, then say it aloud yourself. Speech uses your device’s available voice.</p>${phrase}<div class="controls" style="justify-content:start"><button class="primary" id="playarab">▶ Hear Arabic</button><button class="secondary" id="playeng">▶ Hear English</button></div><p class="muted">If your device has no Arabic voice, ask a teacher to model the pronunciation.</p>`;document.querySelector('#playarab').onclick=()=>speak(l.arab);document.querySelector('#playeng').onclick=()=>speak(l.trans,'en-US')}
if(act===4){let items=[...l.order].reverse();e.innerHTML=`<h2>Put the steps in order</h2><p>Tap each action in the right order, starting with the first.</p><div class="answerbox" id="sequenceAnswer">1 → 2 → 3</div><div class="sequence">${items.map((s,i)=>`<button class="order" data-order="${escapeHTML(s)}">${escapeHTML(s)}</button>`).join('')}</div>`;document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(b.textContent===l.order[sequence]){sequence++;b.classList.add('disabled');document.querySelector('#sequenceAnswer').textContent=l.order.slice(0,sequence).map((v,i)=>`${i+1}. ${v}`).join('  →  ');chime();if(sequence===3)feedback('Excellent! You put the steps in order.')}else{chime(false);feedback('Try another step first.',true)}})}
if(act===5){let tokens=[...l.missing].reverse();e.innerHTML=`<h2>Build the missing words</h2><p>Tap the Arabic words in the right order to complete the phrase.</p><div class="answerbox arabic" id="built" dir="rtl">…</div><div class="wordbank">${tokens.map((w,i)=>`<button class="word arabic" data-word="${i}">${escapeHTML(w)}</button>`).join('')}</div><button class="secondary" id="resetwords">↻ Try again</button>`;let buttons=[...document.querySelectorAll('[data-word]')];buttons.forEach(b=>b.onclick=()=>{let word=tokens[+b.dataset.word];if(word===l.missing[selected.length]){selected.push(word);b.classList.add('disabled');document.querySelector('#built').textContent=selected.join(' ');chime();if(selected.length===l.missing.length)feedback('Beautiful! You completed the Arabic phrase.')}else{chime(false);feedback('Try a different word.',true)}});document.querySelector('#resetwords').onclick=()=>{selected=[];buttons.forEach(b=>b.classList.remove('disabled'));document.querySelector('#built').textContent='…';feedback('Ready to try again.')}}
if(act===6){e.innerHTML=`<h2>Choose the answer</h2><p>${escapeHTML(l.q)}</p><div class="choices">${l.opts.map((v,i)=>`<button class="choice" data-choice="${i}">${escapeHTML(v)}</button>`).join('')}</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;if(+b.dataset.choice===l.answer){answered=true;b.classList.add('correct');chime();feedback('Correct! ⭐')}else{b.classList.add('wrong');chime(false);feedback('Have another try.',true)}})}
if(act===7){e.innerHTML=`<h2>Practise with a grown-up</h2><div class="big-visual">${art(l,true)}</div><p>Point to the picture, say the step in English or Arabic, and practise gently with your teacher or parent.</p><label class="tip" style="display:block"><input type="checkbox" id="practised" style="width:22px;height:22px;vertical-align:middle"> I practised this step</label>`;document.querySelector('#practised').onchange=(ev)=>{if(ev.target.checked){chime();feedback('Wonderful practice!')}}}
if(act===8){let qs=[{q:l.q,o:l.opts,a:l.answer},{q:'What is the Arabic word or phrase for this map?',o:[l.arab,lessons[(map+4)%11].arab,lessons[(map+7)%11].arab],a:0},{q:'What comes first?',o:[l.order[2],l.order[0],l.order[1]],a:1}];let show=()=>{if(quiz===3){e.innerHTML=`<div class="reward" style="text-align:center">${quizScore===3?'🏆':'⭐'}</div><h2>Challenge complete!</h2><p>You got ${quizScore} of 3 questions right. You can review any activity, then finish this map.</p><button class="secondary" id="retry">↻ Try challenge again</button>`;document.querySelector('#retry').onclick=()=>{quiz=0;quizScore=0;show()};return}let q=qs[quiz];e.innerHTML=`<h2>Mini challenge • ${quiz+1} / 3</h2><p>${escapeHTML(q.q)}</p><div class="choices">${q.o.map((v,i)=>`<button class="choice" data-quiz="${i}">${escapeHTML(v)}</button>`).join('')}</div>`;document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{if(+b.dataset.quiz===q.a){quizScore++;chime();quiz++;feedback('Great answer!');setTimeout(show,450)}else{b.classList.add('wrong');chime(false);feedback('Try again. You can do it!',true)}})};show()}}
document.querySelector('#home').onclick=home;document.querySelector('#sound').onclick=()=>{state.sound=!state.sound;save()};save();home();
</script></body></html>
