const cm=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const G=(q,ans,wrongs,why,o)=>{const a=String(ans);return Object.assign({q,ans:a,wrongs:[...new Set(wrongs.map(String))].filter(x=>x!==a).slice(0,3),why,num:/^\d{1,4}$/.test(a)},o||{})};
const wn=(ans,steps)=>{const s=new Set();shuffle(steps.flatMap(t=>[ans+t,ans-t])).forEach(v=>{if(v>=0&&v!==ans&&s.size<3)s.add(v)});let g=1;while(s.size<3){s.add(ans+g++)}return[...s]};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(a,b)=>a+"/"+b;
const digs=k=>shuffle([1,2,3,4,5,6,7,8,9]).slice(0,k);
const PLACES=["ones","tens","hundreds","thousands"];
function customWorld(o){
 const asQ=(x,inp)=>{if(inp&&x.num&&Math.random()<.5)return{t:"inp",q:x.q,v:+x.ans,vis:x.vis,why:x.why};
  const op=shuffle([x.ans,...x.wrongs]);return{t:"mcq",q:x.q,vis:x.vis,o:op,a:op.indexOf(x.ans),why:x.why}};
 const dd=(i,n)=>n>1?i/(n-1):1;
 const w=Object.assign({},o);
 w.quiz=(i,n)=>asQ(pick(o.gq)(dd(i,n)),true);
 w.word=(i,n)=>asQ(pick(o.gw)(dd(i,n)),true);
 w.gameQ=(i,n)=>o.game(i,n);
 w.tf=(i,n)=>{const x=pick([...o.gq,...o.gw])(dd(i,n)),truth=i%2===0,a=truth?x.ans:pick(x.wrongs),s=x.s||(v=>x.q.replace("▢",v));return{t:"tf",q:s(a),a:truth,why:x.why}};
 w.popQ=o.pop;
 WORLDS.push(w)}

/* ---- Place Value Peaks ---- */
const pvA=d=>{const k=d<.34?3:4,a=digs(k),n=+a.join(""),p=R(0,k-1),dg=+String(n)[k-1-p];
 return G(`In ${cm(n)}, the digit ${dg} is in the ▢ place.`,PLACES[p],PLACES.filter((_,j)=>j!==p),`${dg} is in the ${PLACES[p]} place.`)};
const pvB=d=>{const k=d<.34?3:4,a=digs(k),n=+a.join(""),p=R(0,k-1),dg=+String(n)[k-1-p],v=dg*10**p;
 return G(`In ${cm(n)}, the digit ${dg} stands for ▢.`,v,[0,1,2,3].filter(j=>j!==p).map(j=>dg*10**j),`${dg} in the ${PLACES[p]} place is worth ${v}.`)};
const pvC=d=>{const u=d<.4?10:d<.75?100:1000;let n=u===10?R(12,999):u===100?R(101,d>.9?9999:999):R(1001,9999);if(n%u===0)n++;
 const r=Math.round(n/u)*u;return G(`${cm(n)} rounded to the nearest ${u} is ▢`,r,wn(r,[u,2*u]).map(x=>cm(x)).concat([]),`Look at the digit to the right: 5 or more rounds up. ${cm(n)} → ${cm(r)}.`,{num:false,fmtAns:true,ans:cm(r)})};
const pvD=d=>{const n=R(1100,9899),th=Math.floor(n/1000),h=Math.floor(n/100)%10,t=Math.floor(n/10)%10,o=n%10;
 return G(`${cm(n)} = ${th} thousands + ▢ hundreds + ${t} tens + ${o} ones`,h,wn(h,[1,2]),`${cm(n)} has ${h} hundreds.`)};
const pvE=d=>{const st=d<.4?10:d<.7?100:1000,more=Math.random()<.5;let n=R(1200,8800);const r=more?n+st:n-st;
 return G(`${cm(st)} ${more?"more":"less"} than ${cm(n)} is ▢`,cm(r),[r+st,r-st,r+(more?-1:1)*st*2,r+2*st].filter(v=>v>=0&&v!==r).map(cm),`${cm(n)} ${more?"+":"−"} ${cm(st)} = ${cm(r)}.`,{num:false})};
const pvW1=d=>{const u=d<.5?10:100,n=u===10?R(12,999):R(101,9999),n2=n%u===0?n+1:n,r=Math.round(n2/u)*u,[N]=pick(NAMES),[it]=pick(ITEMS);
 return G(`${N}'s school has ${cm(n2)} ${it}. About how many is that to the nearest ${u}? ▢`,cm(r),wn(r,[u,2*u]).map(cm),`${cm(n2)} rounds to ${cm(r)}.`,{num:false,s:v=>`${N}'s school has ${cm(n2)} ${it}, which is about ${v} to the nearest ${u}.`})};
const pvW2=d=>{const a=digs(4),dg=a[0],p=R(1,3),rest=shuffle(a.slice(1)),arr=[];let ri=0;for(let i=0;i<4;i++)arr.push(i===3-p?dg:rest[ri++]);
 const ans=arr.join(""),ws=new Set();let g=0;while(ws.size<3&&g++<200){const t=shuffle(a);if(t[3-p]!==dg)ws.add(t.join(""))}
 return G(`Which number has the digit ${dg} in the ${PLACES[p]} place?`,cm(ans),[...ws].map(cm),`In ${cm(ans)}, ${dg} is in the ${PLACES[p]} place.`,{num:false,s:v=>`${v} has the digit ${dg} in the ${PLACES[p]} place.`})};
const pvW3=d=>{const a=digs(4),n=+a.join(""),ws=new Set();let g=0;while(ws.size<3&&g++<200){const t=shuffle(a).join("");if(+t!==n)ws.add(cm(+t))}
 return G(`A number has ${a[0]} thousands, ${a[1]} hundreds, ${a[2]} tens and ${a[3]} ones. What is it?`,cm(n),[...ws],`${a[0]} thousands + ${a[1]} hundreds + ${a[2]} tens + ${a[3]} ones = ${cm(n)}.`,{num:false,s:v=>`The number with ${a[0]} thousands, ${a[1]} hundreds, ${a[2]} tens and ${a[3]} ones is ${v}.`})};
const pvG=d=>{const k=d<.5?3:4,a=digs(k),big=Math.random()<.5,sorted=a.slice().sort((x,y)=>big?y-x:x-y),ans=+sorted.join(""),ws=new Set();let g=0;
 while(ws.size<3&&g++<300){const t=+shuffle(a).join("");if(t!==ans)ws.add(t)}
 return G(`Make the ${big?"BIGGEST":"SMALLEST"} number you can with the digits ${a.join(", ")}: ▢`,ans,[...ws],`Put the ${big?"biggest digit first":"smallest digit first"}: ${ans}.`,{s:v=>`The ${big?"biggest":"smallest"} number you can make with the digits ${a.join(", ")} is ${v}.`})};
customWorld({id:"pv",name:"Place Value Peaks",emoji:"🗻",c:"#0d9488",c2:"#5eead4",badge:"🔭",bname:"Place Value Pro",gameKey:"digits",
 gq:[pvA,pvB,pvC,pvD,pvE],gw:[pvW1,pvW2,pvW3],
 game:(i,n)=>{const x=pvG(i/(n-1)),op=shuffle([x.ans,...x.wrongs]);return Math.random()<.5&&x.num?{t:"inp",q:x.q,v:+x.ans,why:x.why}:{t:"mcq",q:x.q,o:op,a:op.indexOf(x.ans),why:x.why}},
 pop:u=>{const rules=[
  ()=>{const X=R(2,9)*100,gd=new Set(),bd=new Set();while(gd.size<4)gd.add(X-49+R(0,98));while(bd.size<5){const v=R(100,999);if(Math.abs(v-X)>=50)bd.add(v)}
   return{t:"pop",q:`Pop every number that rounds to ${X} (nearest 100)!`,w:shuffle([...gd].map(x=>[String(x),1]).concat([...bd].map(x=>[String(x),0]))),why:`Numbers from ${X-49} to ${X+49} round to ${X}.`}},
  ()=>{const dg=R(2,9),gd=new Set(),bd=new Set();while(gd.size<4)gd.add(+(R(1,9)+""+dg+R(0,9)+R(0,9)));while(bd.size<5){const v=+(R(1,9)+""+R(0,9)+R(0,9)+R(0,9));if(Math.floor(v/100)%10!==dg)bd.add(v)}
   return{t:"pop",q:`Pop every number with ${dg} in the hundreds place!`,w:shuffle([...gd].map(x=>[cm(x),1]).concat([...bd].map(x=>[cm(x),0]))),why:`The hundreds digit is the 2nd digit of a 4-digit number.`}},
  ()=>{const T=R(3,7)*1000,gd=new Set(),bd=new Set();while(gd.size<4)gd.add(R(T+100,9999));while(bd.size<5)bd.add(R(1000,T-100));
   return{t:"pop",q:`Pop every number BIGGER than ${cm(T)}!`,w:shuffle([...gd].map(x=>[cm(x),1]).concat([...bd].map(x=>[cm(x),0]))),why:`Compare the thousands digit first.`}}];
  const free=[0,1,2].filter(k=>!u.includes(k)),k=free.length?pick(free):R(0,2);u.push(k);return rules[k]()},
 pairs:()=>{const out=[],seen=new Set();let t=0;while(out.length<6&&t++<100){const n=R(120,980),r=Math.round(n/10)*10;if(n%10===0||seen.has(r))continue;seen.add(r);out.push([`${n} → nearest 10`,String(r)])}return out},
 learn:[

function patQ(d){const k=R(0,2);let seq,ans,why;
 if(k===0){const st=R(2,d>.5?19:9),s=R(1,30);seq=[0,1,2,3].map(i=>s+i*st);ans=s+4*st;why=`The rule is +${st} each time, so the next number is ${ans}.`}
 else if(k===1){const st=R(2,9),s=R(60+st*5,200);seq=[0,1,2,3].map(i=>s-i*st);ans=s-4*st;why=`The rule is −${st} each time, so the next number is ${ans}.`}
 else{const s=R(1,4),m=pick([2,3]);seq=[0,1,2,3].map(i=>s*m**i);ans=s*m**4;why=`The rule is ×${m} each time, so the next number is ${ans}.`}
 const q=`${seq.join(", ")}, ▢`;return Math.random()<.5?{t:"inp",q,v:ans,why}:Object.assign({t:"mcq",q,why},numOpts(ans,10))}
function exprQ2(){const k=R(0,4);let q,ans,why,a,b,c,e;
 if(k===0){a=R(2,9);b=R(2,9);c=R(2,9);e=R(2,9);q=`${a} × ${b} + ${c} × ${e}`;ans=a*b+c*e;why=`× first: ${a*b} and ${c*e}, then add: ${ans}.`}
 else if(k===1){a=R(10,40);b=R(2,9);c=R(2,9);e=R(1,Math.min(a+b*c-1,30));q=`${a} + ${b} × ${c} − ${e}`;ans=a+b*c-e;why=`× first: ${b} × ${c} = ${b*c}, then ${a} + ${b*c} = ${a+b*c}, then − ${e} = ${ans}.`}
 else if(k===2){b=R(2,8);a=R(b+1,20);c=R(2,9);q=`(${a} − ${b}) × ${c}`;ans=(a-b)*c;why=`Brackets first: ${a-b}, then × ${c} = ${ans}.`}
 else if(k===3){a=R(2,9);b=R(1,9);c=R(1,9);q=`${a} × (${b} + ${c})`;ans=a*(b+c);why=`Brackets first: ${b+c}, then ${a} × ${b+c} = ${ans}.`}
 else{c=R(2,6);const qq=R(2,9);a=c*qq;b=R(1,9);q=`(${a} ÷ ${c}) + ${b} × ${c}`;ans=qq+b*c;why=`${a} ÷ ${c} = ${qq}, ${b} × ${c} = ${b*c}, so ${qq} + ${b*c} = ${ans}.`}
 return Math.random()<.5?{t:"inp",q:q+" = ▢",v:ans,why}:Object.assign({t:"mcq",q:q+" = ▢",why},numOpts(ans,10))}
function hardWord(){const [N,he]=pick(NAMES),[it]=pick(ITEMS),He=he==="he"?"He":"She",k=R(0,2);let q,ans,why;
 if(k===0){const f=R(2,6),b=f*R(1,4),a=R(2,6);q=`${N} buys ${a} boxes with ${b} ${it} in each box. ${He} shares them equally among ${f} friends. How many ${it} does each friend get?`;ans=a*b/f;why=`${a} × ${b} = ${a*b}, then ${a*b} ÷ ${f} = ${ans}.`}
 else if(k===1){const kk=R(2,6),p=R(3,12),left=R(2,30);q=`${N} had $${kk*p+left}. ${He} bought ${kk} books at $${p} each. How much money is left?`;ans=left;why=`${kk} × ${p} = ${kk*p}, then ${kk*p+left} − ${kk*p} = ${left}.`}
 else{const a=R(45,80),b=R(5,20),c=R(3,15),d=R(2,20);q=`A bus has ${a} passengers. At the first stop ${b} get off and ${c} get on. At the second stop ${d} get off. How many are on the bus now?`;ans=a-b+c-d;why=`${a} − ${b} + ${c} − ${d} = ${ans}.`}
 return Math.random()<.5?{t:"inp",q,v:ans,why}:Object.assign({t:"mcq",q,why},numOpts(ans,10))}

const gameFrom=L=>(i,n)=>{const x=pick(L)(n>1?i/(n-1):1),op=shuffle([x.ans,...x.wrongs]);
 return x.num&&Math.random()<.5?{t:"inp",q:x.q,v:+x.ans,why:x.why}:{t:"mcq",q:x.q,o:op,a:op.indexOf(x.ans),why:x.why}};

const popPick=(good,bad,q,why)=>({t:"pop",q,w:shuffle(good.map(x=>[String(x),1]).concat(bad.map(x=>[String(x),0]))),why});
const uniq=(n,f)=>{const s=new Set();let g=0;while(s.size<n&&g++<500)s.add(f());return[...s]};

const fcA=d=>{const n=pick([12,16,18,20,24,28,30,36,40,42,48,60].filter(x=>d>.5||x<=36)),a=pick(divs(n).filter(x=>x>1&&x<n)),nd=[];for(let i=2;i<n;i++)if(n%i)nd.push(i);

const fcB=d=>{const k=R(3,9),m=R(2,d>.5?12:8),a=k*m;return G(`Which number is a multiple of ${k}?`,a,[a+1,a-1,a+2],`${k} × ${m} = ${a}, so ${a} is in the ${k} times table.`,{num:false,s:v=>`${v} is a multiple of ${k}.`})};

const fcD=d=>{const a=R(2,d>.5?12:9);return Math.random()<.5?G(`${a}² = ▢`,a*a,wn(a*a,[a,2,1]),`${a} × ${a} = ${a*a}.`):G(`The square root of ${a*a} is ▢`,a,wn(a,[1,2]),`${a} × ${a} = ${a*a}.`)};
const fcE=d=>{if(Math.random()<.5){const [a,b,h]=pick([[12,18,6],[8,12,4],[15,25,5],[16,24,8],[20,30,10],[18,24,6],[14,21,7]]);return G(`The highest common factor of ${a} and ${b} is ▢`,h,wn(h,[1,2]),`The biggest number that divides both ${a} and ${b} is ${h}.`)}

const fcW1=d=>{const [N]=pick(NAMES),[a,b,l]=pick([[4,6,12],[3,5,15],[6,8,24],[4,10,20],[6,9,18],[5,12,60]]);return G(`A bus comes every ${a} minutes and a train every ${b} minutes. They arrive together now. In how many minutes will they next arrive together? ▢`,l,wn(l,[a,b,6]),`The lowest common multiple of ${a} and ${b} is ${l}.`,{s:v=>`A bus comes every ${a} minutes and a train every ${b} minutes. They arrive together again after ${v} minutes.`})};
const fcW2=d=>{const [N]=pick(NAMES),[it]=pick(ITEMS),n=pick([12,18,20,24,30,36]),a=pick(divs(n).filter(x=>x>1&&x<n)),nd=[];for(let i=2;i<n;i++)if(n%i)nd.push(i);
 return G(`${N} has ${n} ${it} and wants equal groups with none left over. Which group size works?`,a,shuffle(nd).slice(0,3),`${n} ÷ ${a} = ${n/a} with no remainder.`,{num:false,s:v=>`${N} can make equal groups of ${v} from ${n} ${it} with none left over.`})};

 return G(`Which number is bigger, ${x} or ${y}?`,big,[sm],`Compare place by place: ${big} > ${sm}.`,{num:false,s:v=>`${v} is bigger than ${v===big?sm:big}.`})};
const dcC=d=>{const p=R(11,99),q=R(11,60);if(Math.random()<.6){const r=(p+q)/10;return G(`${(p/10).toFixed(1)} + ${(q/10).toFixed(1)} = ▢`,r.toFixed(1),[(r+.1).toFixed(1),(r-.1).toFixed(1),(r+1).toFixed(1),(r-1).toFixed(1)],`Line up the dots: ${r.toFixed(1)}.`,{num:false})}
 const a=Math.max(p,q)+R(0,9),b=Math.min(p,q),r=(a-b)/10;return G(`${(a/10).toFixed(1)} − ${(b/10).toFixed(1)} = ▢`,r.toFixed(1),[(r+.1).toFixed(1),(r+.2).toFixed(1),(r+1).toFixed(1),(r+.5).toFixed(1)],`Line up the dots: ${r.toFixed(1)}.`,{num:false})};
const dcD=d=>{const k=R(0,3);if(k===0){const p=R(11,99);return G(`${p/10} × 10 = ▢`,p,wn(p,[1,10,9]),`Move each digit one place left: ${p}.`)}

/* ============ QUIZ ENGINE ============ */
let Q;
function startQuiz(wi,st){st=st||"quiz";Q={wi,stage:st,list:buildList(WORLDS[wi],st),i:0,mist:0,xp:0,flag:false,done:false};showQ()}
function goStage(wi,st){st==="match"?viewMatch(wi):startQuiz(wi,st)}
function showQ(){
 const w=WORLDS[Q.wi],q=Q.list[Q.i];Q.flag=false;Q.done=false;let body="";
 const hud=Q.stage==="battle"?`<div class="battle"><span class="mon">${MON[Q.wi%MON.length]}</span><div class="hp"><i style="width:${Math.round(100-Q.i/Q.list.length*100)}%"></i></div><span>${"❤️".repeat(Math.max(0,3-Q.mist))||"💔"}</span></div>`:Q.stage==="speed"?`<div class="tmr"><i id="tmr"></i></div>`:"";const vis=q.vis||"";
 if(q.t==="mcq"){Q.opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));body=`${vis}<div class="opts">${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`}
 else if(q.t==="inp"){body=`${vis}<div class="npd"><div class="disp" id="disp">&nbsp;</div><div class="keys">${["1","2","3","4","5","6","7","8","9","⌫","0","✔"].map(k=>`<button class="key ${k==="✔"?"go":k==="⌫"?"del":""}" data-k="${k}">${k}</button>`).join("")}</div></div>`}
 else if(q.t==="tf"){body=`<div class="tfb"><button class="opt t" data-v="1">✅ True</button><button class="opt f" data-v="0">❌ False</button></div>`}
 else if(q.t==="pop"){Q.popLeft=q.w.filter(x=>x[1]).length;body=`<div class="bubs">${q.w.map((x,i)=>`<button class="bub" data-i="${i}">${esc(x[0])}</button>`).join("")}</div>`}
 else if(q.t==="pair"){body=`<div class="bigword">${q.target}</div><div class="sent">${q.nums.map((x,i)=>`<button class="chip" data-i="${i}">${x}</button>`).join("")}</div>`}
 else if(q.t==="cross"){body=`<div class="vis items">${Array.from({length:q.n},(_,i)=>`<button class="it" data-i="${i}" aria-label="item">${q.e}</button>`).join("")}</div><div id="ans"></div>`}
 else if(q.t==="shoot"){Q.popLeft=q.w.filter(x=>x[1]).length;const L=shuffle(q.w);body=`${vis}<div class="arena" id="arena">${L.map((x,i)=>`<button class="tg" data-i="${q.w.indexOf(x)}" style="top:${6+(i%4)*21}%;--dur:${(4+Math.random()*4).toFixed(1)}s;--dl:-${(Math.random()*5).toFixed(1)}s">${esc(x[0])}</button>`).join("")}<span class="cannon">🚀</span></div><p class="hint">Tap a target to shoot it!</p>`}
 else if(q.t==="type"){const rows=q.num?["1234567890"]:["qwertyuiop","asdfghjkl","zxcvbnm"];body=`<div class="zt" id="zt"><span class="zship">🚀</span></div><div class="zkb">${rows.map((r,ri)=>`<div>${[...r].map(k=>`<button class="zk" data-k="${k}">${k.toUpperCase()}</button>`).join("")}${ri===rows.length-1?`<button class="zk" data-k="⌫" aria-label="Clear">⌫</button>`:""}</div>`).join("")}</div><p class="hint">Type on your keyboard or tap the keys. Typos are ignored; ⌫ restarts a word.</p>`}
 else if(q.t==="catch"){Q.popLeft=q.w.filter(x=>x[1]).length;const rk=shuffle(q.w.map((_,i)=>i));body=`<div class="fall" id="fall">${q.w.map((x,i)=>`<button class="fi" data-i="${i}" style="left:${2+Math.round(rk[i]*(76/q.w.length))}%;--dur:${(3.5+Math.random()*3).toFixed(1)}s;--dl:-${(Math.random()*4).toFixed(1)}s">${esc(x[0])}</button>`).join("")}</div><p class="hint">Tap the right ones as they fall!</p>`}
 else if(q.t==="mole"){body=`<div class="mprog" id="mp2">Hits: 0 / ${q.need}</div><div class="mgr">${Array.from({length:9},(_,i)=>`<button class="mcell" data-ok="" data-exp="0" data-i="${i}" aria-label="hole"></button>`).join("")}</div>`}
 else if(q.t==="share"){body=`<div class="vis" id="pool"></div><div class="frs" id="frs"></div>`}
 view(`<div class="qhead"><button class="x" id="back" aria-label="Quit">✕</button><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div><span class="pill">${Q.i+1}/${Q.list.length}</span></div>
 ${hud}<div class="card"><div class="qtext">${fmtQ(q.q)} <button class="spk" id="spk" aria-label="Read aloud">🔊</button></div>${body}
 <div id="fb"></div></div><button class="big hide" id="next">Next ➜</button>`);
 $("#back").onclick=()=>{if(confirm("Leave this activity?"))viewHub(Q.wi)};
 $("#spk").onclick=()=>say(q.q);
 ({mcq:bindMcq,inp:bindInp,tf:bindTf,pop:bindPop,pair:bindPair,cross:bindCross,share:bindShare,shoot:bindShoot,mole:bindMole,catch:bindCatch,type:bindType})[q.t](q);
 if(Q.stage==="speed"&&q.t==="mcq"){const bar=$("#tmr");if(bar){requestAnimationFrame(()=>{bar.style.transition="width 15s linear";bar.style.width="0%"});GT.push(setTimeout(()=>timeUp(q),15000))}}

}
function wrong(){if(!Q.flag){Q.flag=true;Q.mist++}sfx.no();$("#fb").innerHTML=`<div class="fb b"><span>🦉</span>${pick(OOPS)}</div>`}
function right(q){if(!Q.flag)Q.xp+=10;Q.done=true;sfx.ok();document.onkeydown=null;
 $("#fb").innerHTML=`<div class="fb g"><span>🦉</span><div>${pick(CHEER)}<br><small>${esc(q.why||"")}</small></div></div>`;
 const n=$("#next");n.classList.remove("hide");n.textContent=Q.i===Q.list.length-1?"Finish! 🎉":"Next ➜";n.onclick=()=>{sfx.tap();Q.i++;Q.i>=Q.list.length?finish():showQ()};
 n.scrollIntoView({behavior:"smooth",block:"center"})}
function bindMcq(q){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(Q.done)return;const o=Q.opts[+b.dataset.i];
 if(o.ok){b.classList.add("ok");app.querySelectorAll(".opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{b.classList.add("no");wrong()}})}
function bindTf(q){app.querySelectorAll(".tfb .opt").forEach(b=>b.onclick=()=>{if(Q.done)return;
 if((b.dataset.v==="1")===q.a){b.classList.add("ok");app.querySelectorAll(".tfb .opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{b.classList.add("no");wrong()}})}
function bindPop(q){app.querySelectorAll(".bub").forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("pop"))return;
 if(q.w[+b.dataset.i][1]){b.classList.add("pop");sfx.tap();Q.popLeft--;if(Q.popLeft<=0){Q.done=true;setTimeout(()=>{Q.done=false;right(q)},400)}}
 else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);wrong()}})}
function bindInp(q){Q.inp="";const disp=$("#disp");
 const upd=()=>{disp.innerHTML=Q.inp||"&nbsp;"};
 const press=k=>{if(Q.done)return;
  if(k==="⌫")Q.inp=Q.inp.slice(0,-1);
  else if(k==="✔"){if(!Q.inp){toast("Type your answer first 🙂");return}
   if(+Q.inp===q.v){disp.classList.add("okd");right(q)}
   else{wrong();disp.classList.add("shk");setTimeout(()=>{disp.classList.remove("shk");Q.inp="";upd()},500)}return}
  else if(Q.inp.length<6)Q.inp+=k;
  upd();sfx.tap()};
 app.querySelectorAll(".key").forEach(b=>b.onclick=()=>press(b.dataset.k));
 document.onkeydown=e=>{if(e.key>="0"&&e.key<="9")press(e.key);else if(e.key==="Backspace")press("⌫");else if(e.key==="Enter")press("✔")}}
function bindPair(q){const sel=[];const chips=[...app.querySelectorAll(".chip")];
 chips.forEach(b=>b.onclick=()=>{if(Q.done)return;const i=+b.dataset.i;
  if(b.classList.contains("sel")){b.classList.remove("sel");sel.splice(sel.indexOf(i),1);return}
  b.classList.add("sel");sel.push(i);sfx.tap();
  if(sel.length===2){const[x,y]=sel.map(k=>q.nums[k]);
   const ok=q.op==="+"?x+y===q.target:q.op==="−"?Math.abs(x-y)===q.target:x*y===q.target;
   if(ok){sel.forEach(k=>{chips[k].classList.remove("sel");chips[k].classList.add("ok")});chips.forEach(c=>c.style.pointerEvents="none");right(q)}
   else{wrong();const pr=sel.splice(0);pr.forEach(k=>chips[k].classList.add("no"));setTimeout(()=>pr.forEach(k=>chips[k].classList.remove("no","sel")),500)}}})}
function bindCross(q){let k=0;const items=[...app.querySelectorAll(".it")];
 items.forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("x")||k>=q.k)return;b.classList.add("x");k++;sfx.tap();
  if(k===q.k){
   if(!q.ask){right(q);return}
   $("#ans").innerHTML=`<div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
   $("#ans").querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(Q.done)return;
    if(+o.dataset.i===q.a){o.classList.add("ok");$("#ans").querySelectorAll(".opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{o.classList.add("no");wrong()}})}})}
const MON=["👾","🐉","👹","🦖","🧟","🐙","🦂","🕷️","🦈","👻"];
let LESS=null;
function lessonCards(wi,ci){if(!LESS||LESS.wi!==wi||ci===0)LESS={wi,cards:buildLessons(WORLDS[wi])};return LESS.cards}
function bindCatch(q){app.querySelectorAll(".fi").forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("got"))return;
 if(q.w[+b.dataset.i][1]){b.classList.add("got");sfx.tap();Q.popLeft--;if(Q.popLeft<=0){Q.done=true;setTimeout(()=>{Q.done=false;right(q)},400)}}
 else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);wrong()}})}
function timeUp(q){if(Q.done)return;Q.done=true;if(!Q.flag){Q.flag=true;Q.mist++}sfx.no();
 app.querySelectorAll(".opt").forEach(b=>{b.style.pointerEvents="none";if(Q.opts&&Q.opts[+b.dataset.i]&&Q.opts[+b.dataset.i].ok)b.classList.add("ok")});
 $("#fb").innerHTML=`<div class="fb b"><span>⏰</span><div>Time is up!<br><small>${esc(q.why||"")}</small></div></div>`;
 const n=$("#next");n.classList.remove("hide");n.textContent=Q.i===Q.list.length-1?"Finish! 🎉":"Next ➜";n.onclick=()=>{sfx.tap();Q.i++;Q.i>=Q.list.length?finish():showQ()}}
function bindType(q){const z=$("#zt"),H=340;let en=[],queue=q.items.map(x=>({s:x.s,k:x.k})),left=q.items.length,tgt=null,ty="",tk=0,next=0;
 const sp=()=>window.ZT_SP||1500,base=.5+Math.min(Q.wi,40)*.012;
 const paint=e=>{const t=e.k.slice(0,e.n);e.el.innerHTML=q.num?`${esc(e.s)} = <b>${esc(t)}</b>${"·".repeat(e.k.length-e.n)}`:`<b>${esc(t)}</b>${esc(e.k.slice(e.n))}`;e.el.classList.toggle("lock",e===tgt)};
 const shot=e=>{const s=document.createElement("span");s.className="zsh";s.textContent="✨";s.style.left="50%";s.style.top=(H-30)+"px";z.appendChild(s);requestAnimationFrame(()=>{s.style.left=e.x+"%";s.style.top=e.y+"px"});setTimeout(()=>s.remove(),230)};
 const reset=()=>{ty="";tgt=null;en.forEach(e=>{e.n=0;paint(e)})};
 const kill=e=>{e.dead=true;e.el.classList.add("dead");setTimeout(()=>e.el.remove(),320);en=en.filter(x=>x!==e);left--;sfx.tap();ty="";tgt=null;en.forEach(x=>{x.n=0;paint(x)});
  if(left<=0&&!Q.done){Q.done=true;GT.forEach(clearInterval);document.onkeydown=null;setTimeout(()=>{Q.done=false;right(q)},400)}};
 const press=c=>{if(Q.done)return;const cand=en.filter(e=>e.k.startsWith(ty+c));
  if(!cand.length){sfx.no();return}
  ty+=c;const pick=cand.includes(tgt)?tgt:cand.reduce((a,b)=>b.y>a.y?b:a);tgt=pick;en.forEach(e=>{e.n=(e===tgt)?ty.length:0;paint(e)});shot(pick);
  if(pick.k===ty)kill(pick)};
 const back=()=>{if(!Q.done)reset()};
 document.onkeydown=ev=>{if(ev.ctrlKey||ev.metaKey||ev.altKey)return;if(ev.key==="Backspace"){back();return}
  if(ev.key.length===1&&/[a-z0-9]/i.test(ev.key)){ev.preventDefault();press(ev.key.toLowerCase())}};
 app.querySelectorAll(".zk").forEach(b=>b.onclick=()=>{const k=b.dataset.k;k==="⌫"?back():press(k)});
 const spawn=()=>{const it=queue.shift(),el=document.createElement("span");el.className="zen";el.dataset.k=it.k;const x=14+Math.random()*72;el.style.left=x+"%";z.appendChild(el);
  const e={s:it.s,k:it.k,el,x,y:-10,n:0,dead:false};en.push(e);paint(e)};
 GT.push(setInterval(()=>{if(Q.done)return;tk++;
  if(queue.length&&tk*50>=next){next+=sp();spawn()}
  en.slice().forEach(e=>{e.y+=base;e.el.style.top=e.y+"px";
   if(e.y>H-40){e.el.remove();en=en.filter(x=>x!==e);if(tgt===e){ty="";tgt=null;en.forEach(x=>{x.n=0;paint(x)})}wrong();queue.push({s:e.s,k:e.k})}})},50))}
function bindShoot(q){const ar=$("#arena");
 app.querySelectorAll(".tg").forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("boom"))return;
  const bu=document.createElement("span");bu.className="bul";bu.textContent="✨";ar.appendChild(bu);
  const a=ar.getBoundingClientRect(),r=b.getBoundingClientRect();
  requestAnimationFrame(()=>{bu.style.left=(r.left-a.left+r.width/2)+"px";bu.style.bottom=(a.bottom-r.bottom+r.height/2)+"px"});setTimeout(()=>bu.remove(),320);
  if(q.w[+b.dataset.i][1]){b.classList.add("boom");b.textContent="💥";sfx.tap();Q.popLeft--;
   if(Q.popLeft<=0){Q.done=true;setTimeout(()=>{Q.done=false;right(q)},450)}}
  else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);wrong()}})}
function bindMole(q){const cells=[...app.querySelectorAll(".mcell")];let hits=0;const sp=()=>window.MOLE_MS||850;
 const clr=c=>{c.classList.remove("up","hit","miss");c.textContent="";c.dataset.ok="";c.dataset.exp="0"};
 const show=()=>{if(Q.done)return;cells.forEach(c=>{if(c.classList.contains("up")&&Date.now()>+c.dataset.exp)clr(c)});
  const empty=cells.filter(c=>!c.classList.contains("up")),n=Math.min(empty.length,R(1,2));
  shuffle(empty).slice(0,n).forEach(c=>{const have=cells.filter(x=>x.dataset.ok==="1").length,ok=Math.random()<(have?.35:.85),it=pick(q.w.filter(x=>!!x[1]===ok));
   c.textContent=it[0];c.dataset.ok=it[1]?"1":"0";c.dataset.exp=String(Date.now()+sp()*2.4);c.classList.add("up")})};
 GT.push(setInterval(show,sp()));show();
 cells.forEach(c=>c.onclick=()=>{if(Q.done||!c.classList.contains("up"))return;
  if(c.dataset.ok==="1"){hits++;c.classList.add("hit");sfx.tap();$("#mp2").textContent=`Hits: ${hits} / ${q.need}`;setTimeout(()=>clr(c),150);
   if(hits>=q.need){Q.done=true;GT.forEach(clearInterval);GT=[];setTimeout(()=>{Q.done=false;right(q)},300)}}
  else{c.classList.add("miss");wrong();setTimeout(()=>clr(c),250)}})}
function bindShare(q){const S={left:q.n,c:Array(q.f).fill(0)};
 const draw=()=>{$("#pool").innerHTML=S.left?q.e.repeat(S.left):"✅ All shared!";
  $("#frs").innerHTML=S.c.map((n,i)=>`<button class="fr" data-i="${i}"><span class="face">${FACES[i%FACES.length]}</span><span class="plate">${n?q.e.repeat(n):"&nbsp;"}</span></button>`).join("");
  $("#frs").querySelectorAll(".fr").forEach(b=>b.onclick=()=>{if(Q.done||S.left<=0)return;S.c[+b.dataset.i]++;S.left--;sfx.tap();draw();
   if(S.left===0){if(S.c.every(v=>v===S.c[0]))right(q);else{wrong();setTimeout(()=>{S.left=q.n;S.c.fill(0);draw()},1100)}}})};
 draw()}

/* ============ MEMORY MATCH ============ */
let M;
function viewMatch(wi){
 const w=WORLDS[wi],pr=w.pairs(),n=pr.length;
 const cards=shuffle(pr.flatMap(([a,b])=>[{t:a,k:b,s:"a"},{t:b,k:b,s:"b"}]));
 M={cards,open:[],lock:false,found:0,n};Q={wi,stage:"match",mist:0,xp:0,list:[]};
 const cols=cards.length>12?4:3;
 view(`<div class="qhead"><button class="x" id="back" aria-label="Quit">✕</button><div class="bar"><i id="mb" style="width:0%"></i></div><span class="pill" id="mm">0/${n}</span></div>
 <div class="card"><div class="qtext">🃏 Flip two cards. Match each sum with its answer!</div>
 <div class="mgrid" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="card">❓</button>`).join("")}</div></div>`);
 $("#back").onclick=()=>{if(confirm("Leave this game?"))viewHub(wi)};
 app.querySelectorAll(".mc").forEach(b=>b.onclick=()=>flip(b));
}
function flip(b){
 if(M.lock||b.classList.contains("up")||b.classList.contains("done"))return;
 const i=+b.dataset.i,c=M.cards[i];b.classList.add("up");b.textContent=c.t;sfx.tap();M.open.push(i);
 if(M.open.length<2)return;
 const[x,y]=M.open.map(k=>M.cards[k]),bs=[...app.querySelectorAll(".mc")],pair=M.open.slice();M.lock=true;
 if(x.k===y.k&&x.s!==y.s){setTimeout(()=>{pair.forEach(k=>{bs[k].classList.remove("up");bs[k].classList.add("done")});M.open=[];M.lock=false;M.found++;Q.xp+=5;sfx.ok();
  $("#mm").textContent=M.found+"/"+M.n;$("#mb").style.width=M.found/M.n*100+"%";
  if(M.found===M.n){Q.stars=Q.mist<=M.n?3:Q.mist<=M.n*2?2:1;setTimeout(finish,700)}},400)}
 else{Q.mist++;setTimeout(()=>{pair.forEach(k=>{bs[k].classList.remove("up");bs[k].textContent="❓"});M.open=[];M.lock=false;sfx.no()},900)}
}

/* ============ RESULT / CERTIFICATE ============ */
function finish(){
 const wi=Q.wi,w=WORLDS[wi],p=P(),st=Q.stage,S=stagesOf(w).find(x=>x.id===st);
 const stars=Q.stars||(Q.mist<=1?3:Q.mist<=3?2:1);
 const gain=Q.xp+stars*10,lb=lvl(p.xp);p.xp+=gain;
 if(st==="quiz"){if(stars>(p.stars[w.id]||0))p.stars[w.id]=stars}
 else{p.done=p.done||{};const d=p.done[w.id]=p.done[w.id]||{};if(stars>(d[st]||0))d[st]=stars}
 const t=today(),y=new Date(Date.now()-864e5).toLocaleDateString("en-CA");
 if(p.last!==t){p.streak=p.last===y?(p.streak||0)+1:1;p.last=t}
 const nb=BADGES.filter(b=>!p.badges.includes(b.id)&&b.f(p));nb.forEach(b=>p.badges.push(b.id));save();
 const la=lvl(p.xp),stg=stagesOf(w),dn=stg.filter(x=>isDone(p,w,x.id)).length,next=stg.find(x=>!isDone(p,w,x.id)),comp=dn===stg.length;
 const nextOk=wi+1<WORLDS.length&&(p.stars[w.id]||0)>=1;
 const msg=stars===3?"Perfect! You are a superstar!":stars===2?"Great job! Almost perfect!":"Good work! Try again for more stars.";
 view(`<div class="card res"><div class="owl" style="font-size:64px">${comp?"🎓":S.e}</div><h2>${comp?esc(w.name)+" complete!":esc(S.n)+" done!"}</h2>
 <div class="st">${[1,2,3].map(n=>n<=stars?`<i style="animation-delay:${n*.3}s">⭐</i>`:`<i style="opacity:.25">⭐</i>`).join("")}</div>
 <p class="sub">🦉 ${msg}</p>
 <div class="gain"><div>+${gain} XP</div><div>Mistakes: ${Q.mist}</div>${la>lb?`<div>⬆️ Level ${la}!</div>`:""}</div>
 ${nb.length?`<div class="banner">New badge: ${nb.map(b=>b.i+" "+b.n).join(", ")}</div>`:""}
 <p class="sub">${dn}/${stg.length} activities finished in this world</p>
 ${next?`<button class="big" id="ns">Next: ${next.e} ${esc(next.n)} ➜</button>`:""}
 ${comp?`<button class="big" id="ct">🎓 Get my certificate</button>`:`<p class="sub">🔒 Finish every activity to unlock your certificate</p>`}
 ${nextOk?`<button class="big alt" id="nw">Next world: ${esc(WORLDS[wi+1].name)} ${WORLDS[wi+1].emoji}</button>`:""}
 <button class="big ghost" id="rt">🔁 Play again</button><button class="big ghost" id="hb">📋 World menu</button><button class="big ghost" id="mp">🗺️ Back to map</button></div>`);
 sfx.win();confetti(comp?70:stars*20);
 if(la>lb||nb.length){setTimeout(()=>toast(la>lb?`🎉 Level up! You are now Level ${la}`:`🏅 ${nb[0].n}!`),700)}
 if($("#ns"))$("#ns").onclick=()=>goStage(wi,next.id);
 if($("#ct"))$("#ct").onclick=()=>showCert(wi);
 if($("#nw"))$("#nw").onclick=()=>viewHub(wi+1);
 $("#rt").onclick=()=>goStage(wi,st);$("#hb").onclick=()=>viewHub(wi);$("#mp").onclick=viewMap;
}
function showCert(wi){const w=WORLDS[wi],p=P();if(!complete(p,w)){toast("🔒 Finish every activity first!");return}
 const d=new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
 openOv(`<div class="cert"><div style="font-size:2.6rem">${w.badge}</div><h2>Certificate of Achievement</h2><p>Bismillah — this proudly certifies that</p>
 <div class="nm">${esc(p.name)}</div><p>has completed all ${stagesOf(w).length} activities of <b>${esc(w.name)}</b> in<br><b>Math Adventure</b></p>
 <div style="font-size:2rem">${"⭐".repeat(p.stars[w.id]||1)}</div><p><b>${esc(w.bname)}</b><br>MashaAllah, keep counting!</p><p style="font-size:.9rem">${d} · diinislaam.com/math</p></div>
 <div class="noprint"><button class="big" id="pr">🖨️ Print or save as PDF</button><button class="big ghost" id="cl">Close</button></div>`);
 $("#pr").onclick=()=>window.print();$("#cl").onclick=closeOv}

/* ============ START ============ */
load();
if(DB.cur&&DB.players[DB.cur])viewMap();else{DB.cur=null;viewWelcome()}
</script>
