<style>

.blank{display:inline-block;min-width:52px;border-bottom:4px solid #0ea5e9}
</style>

<script>
/* ============ HELPERS ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const NAMES=[["Amina","she"],["Fatima","she"],["Maryam","she"],["Aisha","she"],["Yusuf","he"],["Bilal","he"],["Omar","he"],["Hamza","he"]];
const ITEMS=[["apples","🍎"],["bananas","🍌"],["cookies","🍪"],["balloons","🎈"],["stars","⭐"],["books","📚"],["pens","✏️"],["oranges","🍊"],["grapes","🍇"]];
const WORDS=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const AV=["🦁","🐼","🦊","🐯","🐸","🐰","🦄","🐨","🐧","🐙"];
const TITLES=["Beginner","Counter","Number Ninja","Math Wizard","Calculation Hero","Math Champion"];
const CHEER=["MashaAllah! 🌟","Brilliant!","You got it!","Super smart!","Amazing!","Well done!","Fantastic!"];
const OOPS=["Almost! Try again 💪","Not quite. You can do it!","Oops! Have another go!","Keep going, you are learning!"];
const FACES=["👧","👦","🧒","🧕","👶"];

function numOpts(ans,sp){const s=new Set();
 const c=shuffle([ans+1,ans-1,ans+2,ans-2,ans+(sp||10),ans-(sp||10),ans+3,ans-3,ans*2,ans+5]);
 for(const v of c){if(v>=0&&v!==ans&&!s.has(v)){s.add(v);if(s.size>=3)break}}
 let g=1;while(s.size<3){const v=ans+g++;if(v!==ans&&v>=0)s.add(v)}
 const arr=shuffle([ans,...s]);return{o:arr.map(String),a:arr.indexOf(ans)}}
const sc=(mn,mx,d)=>Math.max(mn,Math.round(mx*(.55+.45*d)));

/* ============ OPERATION STRUCTURES ============ */
function addArgs(c,d){let a,b,t=0;
 do{a=R(c.aMin,sc(c.aMin,c.aMax,d));b=R(c.bMin,sc(c.bMin,c.bMax,d));t++}
 while(t<80&&(a+b>c.cap||(c.bridge&&a+b<=10)||(c.carry&&(a%10)+(b%10)<10&&Math.random()<.7)));
 if(a+b>c.cap){a=c.aMin;b=c.bMin}return[a,b]}
function subArgs(c,d){let a,b,t=0;
 do{a=R(c.aMin,sc(c.aMin,c.aMax,d));b=R(c.bMin||1,Math.max(c.bMin||1,Math.min(a-1,c.bMax||a-1)));t++}
 while(t<80&&(b>=a||(c.borrow&&(b%10)<=(a%10)&&Math.random()<.7)));
 if(b>=a)b=a-1;return[a,b]}
function mulArgs(c,d){
 if(c.big&&d>.6&&Math.random()<.6){return[R(11,c.bigMax||25),R(2,5)]}
 const t=pick(c.tables),b=R(c.bMin||1,sc(c.bMin||1,c.bMax,d));return Math.random()<.5?[t,b]:[b,t]}
function divArgs(c,d,rem){const f=pick(c.tables),q=R(c.qMin||1,sc(c.qMin||1,c.qMax,d)),r=rem?R(1,f-1):0;return[f*q+r,f,q,r]}
function opS(op,c,d,rem){let x,y,z,r=0;
 if(op==="+"){[x,y]=addArgs(c,d);z=x+y}
 else if(op==="−"){[x,y]=subArgs(c,d);z=x-y}
 else if(op==="×"){[x,y]=mulArgs(c,d);z=x*y}
 else{[x,y,z,r]=divArgs(c,d,rem)}
 const why=(op==="÷"&&r)?`${y} × ${z} = ${y*z}, and ${x} − ${y*z} = ${r}. So ${x} ÷ ${y} = ${z} r ${r}.`:`${x} ${op} ${y} = ${z}`;
 return{x,y,z,r,sym:op,why}}
function visFor(s,e){
 if(s.sym==="+"&&s.z<=20)return`<div class="vis"><span class="grp">${e.repeat(s.x)}</span><b>+</b><span class="grp">${e.repeat(s.y)}</span></div>`;
 if(s.sym==="−"&&s.x<=20)return`<div class="vis"><span class="grp">${e.repeat(s.x-s.y)}<span class="cr">${e.repeat(s.y)}</span></span></div>`;
 if(s.sym==="×"&&s.x*s.y<=60)return`<div class="vis"><div class="arr">${Array(s.x).fill(`<div>${"🔵".repeat(s.y)}</div>`).join("")}</div></div>`;
 if(s.sym==="÷"&&s.x<=30&&!s.r)return`<div class="vis">${Array(s.y).fill(`<span class="grp">${e.repeat(s.z)}</span>`).join("")}</div>`;
 return""}
const cfgFor=(c,op)=>c.sub?c.sub[op]:c;

/* ============ QUESTION GENERATORS ============ */
function remQ(s){const{x,y,z,r}=s;const set=new Set([`${z} r ${r}`]);
 const rd=r+1<y?r+1:r-1;
 [`${z+1} r ${r}`,`${z} r ${rd}`,`${z+1} r ${rd}`,`${Math.max(0,z-1)} r ${r}`,`${z+2} r ${r}`].forEach(t=>{if(set.size<4)set.add(t)});
 const arr=shuffle([...set]);
 return{t:"mcq",q:`${x} ÷ ${y} = ▢`,o:arr,a:arr.indexOf(`${z} r ${r}`),why:s.why}}
function exprQ(){const k=R(0,4);let q,ans,why,a,b,c;
 if(k===0){a=R(2,20);b=R(2,9);c=R(2,9);q=`${a} + ${b} × ${c}`;ans=a+b*c;why=`× first: ${b} × ${c} = ${b*c}, then ${a} + ${b*c} = ${ans}.`}

 if(k==="divshare"){const f=R(2,5),q=R(2,Math.min(c.qMax,5));return{t:"share",q:`Share ${f*q} ${it} equally between ${f} friends. Tap a friend to give one at a time!`,n:f*q,f,e,why:`${f*q} ÷ ${f} = ${q}`}}

function exprList(op,X,c){const o=[];
 if(op==="+"){const hi=c.aMax||99;for(let a=1;a<X;a++){const b=X-a;if(a<=hi&&b<=hi)o.push(`${a} + ${b}`)}}

 else if(op==="×"){const tb=c.tables||[],lim=Math.max(c.bMax||10,...tb);

/* ============ BADGES / STAGES ============ */
const BADGES=[
 {id:"first",i:"👣",n:"First Steps",d:"Finish your first quiz",f:p=>Object.keys(p.stars).length>=1},
 {id:"perfect",i:"💎",n:"Perfect!",d:"Get 3 stars",f:p=>Object.values(p.stars).some(s=>s>=3)},
 {id:"streak3",i:"🔥",n:"3-Day Streak",d:"Learn 3 days in a row",f:p=>p.streak>=3},
 {id:"xp500",i:"⚡",n:"XP Hero",d:"Earn 500 XP",f:p=>p.xp>=500},
 {id:"games",i:"🎮",n:"Game On",d:"Finish a mini-game",f:p=>Object.values(p.done||{}).some(d=>d.game||d.pop||d.match||d.tf)},
 {id:"cert",i:"🎓",n:"Certified!",d:"Earn a certificate",f:p=>WORLDS.some(w=>complete(p,w))},
 {id:"addace",i:"➕",n:"Addition Ace",d:"Certificates in all Addition worlds",f:p=>WORLDS.filter(w=>w.cfg&&w.cfg.op==="+").every(w=>complete(p,w))},
 {id:"subchamp",i:"➖",n:"Subtraction Champ",d:"Certificates in all Subtraction worlds",f:p=>WORLDS.filter(w=>w.cfg&&w.cfg.op==="−").every(w=>complete(p,w))},
 {id:"mulmaster",i:"✖️",n:"Times Master",d:"Certificates in all Multiplication worlds",f:p=>WORLDS.filter(w=>w.cfg&&w.cfg.op==="×").every(w=>complete(p,w))},
 {id:"divhero",i:"➗",n:"Division Hero",d:"Certificates in all Division worlds",f:p=>WORLDS.filter(w=>w.cfg&&w.cfg.op==="÷").every(w=>complete(p,w))},
 {id:"all",i:"🏆",n:"Math Champion",d:"Finish every world and the Grand Challenge",f:p=>Object.keys(p.stars).length>=WORLDS.length},
 {id:"super",i:"🌟",n:"Super Scholar",d:"3 stars in every quiz",f:p=>WORLDS.every(w=>(p.stars[w.id]||0)>=3)}];
const GAMES={collect:["Basket Catch","🧺","Tap to collect"],addpair:["Make the Sum","🧩","Tap two numbers"],subcross:["Cookie Crunch","🍪","Take them away"],subpair:["Difference Duel","⚔️","Find the gap"],mularr:["Array Builder","🧱","Rows and columns"],mulmix:["Times Table Race","🏁","Fast multiplying"],divshare:["Fair Share","🍰","Share equally"],divfam:["Fact Family","👨‍👩‍👧","Link × and ÷"],divrem:["Left Overs","🍱","Find the remainder"],mix:["Mix Master","🎲","Any operation!"]};
function stagesOf(w){const q={id:"quiz",n:"Quiz",e:"🎯",d:"Test what you learned"};if(w.id==="boss")return[q];const g=GAMES[w.gameKey];
 return[q,{id:"word",n:"Story Problems",e:"📝",d:"Math in real life"},{id:"game",n:g[0],e:g[1],d:g[2]},{id:"pop",n:"Bubble Pop",e:"🫧",d:"Pop the right answers"},{id:"match",n:"Memory Match",e:"🃏",d:"Find the matching pairs"},{id:"tf",n:"Lightning Round",e:"⚡",d:"True or false?"}]}
const stageStars=(p,w,s)=>s==="quiz"?(p.stars[w.id]||0):((p.done&&p.done[w.id]&&p.done[w.id][s])||0);
const isDone=(p,w,s)=>stageStars(p,w,s)>0;
const complete=(p,w)=>stagesOf(w).every(s=>isDone(p,w,s.id));
const unlocked=(i,p)=>i===0||(p.stars[WORLDS[i-1].id]||0)>=1;
const lvl=x=>Math.floor(x/120)+1;
const totalStars=p=>Object.values(p.stars).reduce((a,b)=>a+b,0);
const today=()=>new Date().toLocaleDateString("en-CA");
function bossList(){const ws=WORLDS.filter(x=>x.quiz);const list=ws.map(w=>w.quiz(R(4,7),8));list.push(WORLDS.find(x=>x.id==="mixed").quiz(7,8));return list}
function buildList(w,st){if(w.id==="boss")return bossList();
 const mk=(n,f)=>Array.from({length:n},(_,i)=>f(i,n));
 if(st==="quiz")return mk(8,(i,n)=>w.quiz(i,n));
 if(st==="word")return mk(6,(i,n)=>w.word(i,n));
 if(st==="game")return mk(5,(i,n)=>w.gameQ(i,n));
 if(st==="pop"){const u=[];return mk(3,()=>w.popQ(u))}
 return mk(10,(i,n)=>w.tf(i,n))}

/* ============ UI HELPERS ============ */
const app=$("#app");
function view(h){document.onkeydown=null;app.innerHTML=h;window.scrollTo(0,0);closeOv()}
function closeOv(){const o=$("#ov");o.classList.add("hide");o.innerHTML=""}
function openOv(h){const o=$("#ov");o.innerHTML=`<div class="modal">${h}</div>`;o.classList.remove("hide");o.onclick=e=>{if(e.target===o)closeOv()}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function confetti(n=45){const E=["🎉","⭐","✨","🌟","🎈","🔢","💫"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="conf";s.textContent=pick(E);
 s.style.left=Math.random()*100+"vw";s.style.animationDuration=(2+Math.random()*2.5)+"s";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
let AC;
function tone(f,t,d,type="sine",v=.14){if(!DB.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 const s=AC.currentTime+t;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={ok(){[523,659,784].forEach((f,i)=>tone(f,i*.08,.22))},no(){tone(240,0,.2,"triangle");tone(190,.13,.3,"triangle")},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,"square",.07))},tap(){tone(700,0,.05)}};
function say(t){if(!DB.sound)return;try{speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(String(t).replace(/▢/g," what ").replace(/\+/g," plus ").replace(/−/g," minus ").replace(/×/g," times ").replace(/÷/g," divided by ").replace(/=/g," equals ").replace(/→/g," then ").replace(/ r (\d)/g," remainder $1"));
 u.lang="en-US";u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function fmtQ(t){return esc(t).replace(/▢/g,'<span class="blank">&nbsp;&nbsp;&nbsp;</span>')}

 <button class="stg ${stageStars(p,w,"quiz")?"":"go"}" data-s="learn"><span class="em">📖</span><span><b>Lesson</b><small>Learn with examples</small></span></button>
 ${stg.map(x=>`<button class="stg ${isDone(p,w,x.id)?"dn":(first&&first.id===x.id&&stageStars(p,w,"quiz")?"go":"")}" data-s="${x.id}"><span class="em">${isDone(p,w,x.id)?"✅":x.e}</span><span><b>${esc(x.n)}</b><small>${x.d}</small></span><span class="rt">${"⭐".repeat(stageStars(p,w,x.id))}</span></button>`).join("")}
 <button class="stg ${comp?"go":"lock"}" data-s="cert"><span class="em">🎓</span><span><b>Certificate</b><small>${comp?"You earned it! Tap to open":"Finish every activity to unlock"}</small></span><span class="rt">${comp?"":"🔒"}</span></button></div>
 <button class="big ghost" id="mp">🗺️ Back to map</button>`);
 bindHeader();$("#mp").onclick=viewMap;
 app.querySelectorAll(".stg").forEach(b=>b.onclick=()=>{const s=b.dataset.s;sfx.tap();
  if(s==="learn")viewLesson(wi,0);else if(s==="cert"){comp?showCert(wi):(sfx.no(),toast("🔒 Finish every activity first!"))}else goStage(wi,s)});
}

/* ============ LESSON ============ */
function viewLesson(wi,ci){
 const w=WORLDS[wi],c=w.learn[ci],last=ci===w.learn.length-1;
 view(`<div class="qhead"><button class="x" id="back" aria-label="Back">✕</button><div class="bar"><i style="width:${(ci+1)/(w.learn.length+1)*100}%"></i></div></div>
 <div class="card lesson" style="--c:${w.c}"><div class="ico">${c.i}</div><h2>${esc(c.h)} <button class="spk" id="spk" aria-label="Read aloud">🔊</button></h2>
 <p>${esc(c.p)}</p><ul class="exl">${c.ex.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
 <p style="font-size:.9rem;opacity:.7;text-align:center">👆 Tap an example to hear it</p>
 <div class="dotsrow">${w.learn.map((_,i)=>`<i class="${i===ci?"on":""}"></i>`).join("")}</div></div>
 <div style="display:flex;gap:10px">${ci?`<button class="big ghost" id="prev">◀ Back</button>`:""}<button class="big" id="nx">${last?"Play the quiz! 🎮":"Next ▶"}</button></div>`);
 $("#back").onclick=()=>viewHub(wi);$("#spk").onclick=()=>say(c.h+". "+c.p+" "+c.ex.join(". "));hearable(app);
 if($("#prev"))$("#prev").onclick=()=>viewLesson(wi,ci-1);
 $("#nx").onclick=()=>{sfx.tap();last?startQuiz(wi,"quiz"):viewLesson(wi,ci+1)};
}

/* ============ QUIZ ENGINE ============ */
let Q;
function startQuiz(wi,st){st=st||"quiz";Q={wi,stage:st,list:buildList(WORLDS[wi],st),i:0,mist:0,xp:0,flag:false,done:false};showQ()}
function goStage(wi,st){st==="match"?viewMatch(wi):startQuiz(wi,st)}
function showQ(){
 const w=WORLDS[Q.wi],q=Q.list[Q.i];Q.flag=false;Q.done=false;let body="";const vis=q.vis||"";
 if(q.t==="mcq"){Q.opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));body=`${vis}<div class="opts">${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`}
 else if(q.t==="inp"){body=`${vis}<div class="npd"><div class="disp" id="disp">&nbsp;</div><div class="keys">${["1","2","3","4","5","6","7","8","9","⌫","0","✔"].map(k=>`<button class="key ${k==="✔"?"go":k==="⌫"?"del":""}" data-k="${k}">${k}</button>`).join("")}</div></div>`}
 else if(q.t==="tf"){body=`<div class="tfb"><button class="opt t" data-v="1">✅ True</button><button class="opt f" data-v="0">❌ False</button></div>`}
 else if(q.t==="pop"){Q.popLeft=q.w.filter(x=>x[1]).length;body=`<div class="bubs">${q.w.map((x,i)=>`<button class="bub" data-i="${i}">${esc(x[0])}</button>`).join("")}</div>`}
 else if(q.t==="pair"){body=`<div class="bigword">${q.target}</div><div class="sent">${q.nums.map((x,i)=>`<button class="chip" data-i="${i}">${x}</button>`).join("")}</div>`}
 else if(q.t==="cross"){body=`<div class="vis items">${Array.from({length:q.n},(_,i)=>`<button class="it" data-i="${i}" aria-label="item">${q.e}</button>`).join("")}</div><div id="ans"></div>`}
 else if(q.t==="share"){body=`<div class="vis" id="pool"></div><div class="frs" id="frs"></div>`}
 view(`<div class="qhead"><button class="x" id="back" aria-label="Quit">✕</button><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div><span class="pill">${Q.i+1}/${Q.list.length}</span></div>
 <div class="card"><div class="qtext">${fmtQ(q.q)} <button class="spk" id="spk" aria-label="Read aloud">🔊</button></div>${body}
 <div id="fb"></div></div><button class="big hide" id="next">Next ➜</button>`);
 $("#back").onclick=()=>{if(confirm("Leave this activity?"))viewHub(Q.wi)};
 $("#spk").onclick=()=>say(q.q);
 ({mcq:bindMcq,inp:bindInp,tf:bindTf,pop:bindPop,pair:bindPair,cross:bindCross,share:bindShare})[q.t](q);
}
function wrong(){if(!Q.flag){Q.flag=true;Q.mist++}sfx.no();$("#fb").innerHTML=`<div class="fb b"><span>🦉</span>${pick(OOPS)}</div>`}
function right(q){if(!Q.flag)Q.xp+=10;Q.done=true;sfx.ok();document.onkeydown=null;
 $("#fb").innerHTML=`<div class="fb g"><span>🦉</span><div>${pick(CHEER)}<br><small>${esc(q.why||"")}</small></div></div>`;
 const n=$("#next");n.classList.remove("hide");n.textContent=Q.i===Q.list.length-1?"Finish! 🎉":"Next ➜";n.onclick=()=>{sfx.tap();Q.i++;Q.i>=Q.list.length?finish():showQ()};
 n.scrollIntoView({behavior:"smooth",block:"center"})}
function bindMcq(q){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(Q.done)return;const o=Q.opts[+b.dataset.i];
 if(o.ok){b.classList.add("ok");app.querySelectorAll(".opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{b.classList.add("no");wrong()}})}
function bindTf(q){app.querySelectorAll(".tfb .opt").forEach(b=>b.onclick=()=>{if(Q.done)return;
 if((b.dataset.v==="1")===q.a){b.classList.add("ok");app.querySelectorAll(".tfb .opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{b.classList.add("no");wrong()}})}
function bindPop(q){app.querySelectorAll(".bub").forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("pop"))return;
 if(q.w[+b.dataset.i][1]){b.classList.add("pop");sfx.tap();Q.popLeft--;if(Q.popLeft<=0){Q.done=true;setTimeout(()=>{Q.done=false;right(q)},400)}}
 else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);wrong()}})}
function bindInp(q){Q.inp="";const disp=$("#disp");
 const upd=()=>{disp.innerHTML=Q.inp||"&nbsp;"};
 const press=k=>{if(Q.done)return;
  if(k==="⌫")Q.inp=Q.inp.slice(0,-1);
  else if(k==="✔"){if(!Q.inp){toast("Type your answer first 🙂");return}
   if(+Q.inp===q.v){disp.classList.add("okd");right(q)}
   else{wrong();disp.classList.add("shk");setTimeout(()=>{disp.classList.remove("shk");Q.inp="";upd()},500)}return}
  else if(Q.inp.length<4)Q.inp+=k;
  upd();sfx.tap()};
 app.querySelectorAll(".key").forEach(b=>b.onclick=()=>press(b.dataset.k));
 document.onkeydown=e=>{if(e.key>="0"&&e.key<="9")press(e.key);else if(e.key==="Backspace")press("⌫");else if(e.key==="Enter")press("✔")}}
function bindPair(q){const sel=[];const chips=[...app.querySelectorAll(".chip")];
 chips.forEach(b=>b.onclick=()=>{if(Q.done)return;const i=+b.dataset.i;
  if(b.classList.contains("sel")){b.classList.remove("sel");sel.splice(sel.indexOf(i),1);return}
  b.classList.add("sel");sel.push(i);sfx.tap();
  if(sel.length===2){const[x,y]=sel.map(k=>q.nums[k]);
   const ok=q.op==="+"?x+y===q.target:q.op==="−"?Math.abs(x-y)===q.target:x*y===q.target;
   if(ok){sel.forEach(k=>{chips[k].classList.remove("sel");chips[k].classList.add("ok")});chips.forEach(c=>c.style.pointerEvents="none");right(q)}
   else{wrong();const pr=sel.splice(0);pr.forEach(k=>chips[k].classList.add("no"));setTimeout(()=>pr.forEach(k=>chips[k].classList.remove("no","sel")),500)}}})}
function bindCross(q){let k=0;const items=[...app.querySelectorAll(".it")];
 items.forEach(b=>b.onclick=()=>{if(Q.done||b.classList.contains("x")||k>=q.k)return;b.classList.add("x");k++;sfx.tap();
  if(k===q.k){
   if(!q.ask){right(q);return}
   $("#ans").innerHTML=`<div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
   $("#ans").querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(Q.done)return;
    if(+o.dataset.i===q.a){o.classList.add("ok");$("#ans").querySelectorAll(".opt").forEach(x=>x.style.pointerEvents="none");right(q)}else{o.classList.add("no");wrong()}})}})}
function bindShare(q){const S={left:q.n,c:Array(q.f).fill(0)};
 const draw=()=>{$("#pool").innerHTML=S.left?q.e.repeat(S.left):"✅ All shared!";
  $("#frs").innerHTML=S.c.map((n,i)=>`<button class="fr" data-i="${i}"><span class="face">${FACES[i%FACES.length]}</span><span class="plate">${n?q.e.repeat(n):"&nbsp;"}</span></button>`).join("");
  $("#frs").querySelectorAll(".fr").forEach(b=>b.onclick=()=>{if(Q.done||S.left<=0)return;S.c[+b.dataset.i]++;S.left--;sfx.tap();draw();
   if(S.left===0){if(S.c.every(v=>v===S.c[0]))right(q);else{wrong();setTimeout(()=>{S.left=q.n;S.c.fill(0);draw()},1100)}}})};
 draw()}

/* ============ MEMORY MATCH ============ */
let M;
function viewMatch(wi){
 const w=WORLDS[wi],pr=w.pairs(),n=pr.length;
 const cards=shuffle(pr.flatMap(([a,b])=>[{t:a,k:b,s:"a"},{t:b,k:b,s:"b"}]));
 M={cards,open:[],lock:false,found:0,n};Q={wi,stage:"match",mist:0,xp:0,list:[]};
 const cols=cards.length>12?4:3;
 view(`<div class="qhead"><button class="x" id="back" aria-label="Quit">✕</button><div class="bar"><i id="mb" style="width:0%"></i></div><span class="pill" id="mm">0/${n}</span></div>
 <div class="card"><div class="qtext">🃏 Flip two cards. Match each sum with its answer!</div>
 <div class="mgrid" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="card">❓</button>`).join("")}</div></div>`);
 $("#back").onclick=()=>{if(confirm("Leave this game?"))viewHub(wi)};
 app.querySelectorAll(".mc").forEach(b=>b.onclick=()=>flip(b));
}
function flip(b){
 if(M.lock||b.classList.contains("up")||b.classList.contains("done"))return;
 const i=+b.dataset.i,c=M.cards[i];b.classList.add("up");b.textContent=c.t;sfx.tap();M.open.push(i);
 if(M.open.length<2)return;
 const[x,y]=M.open.map(k=>M.cards[k]),bs=[...app.querySelectorAll(".mc")],pair=M.open.slice();M.lock=true;
 if(x.k===y.k&&x.s!==y.s){setTimeout(()=>{pair.forEach(k=>{bs[k].classList.remove("up");bs[k].classList.add("done")});M.open=[];M.lock=false;M.found++;Q.xp+=5;sfx.ok();
  $("#mm").textContent=M.found+"/"+M.n;$("#mb").style.width=M.found/M.n*100+"%";
  if(M.found===M.n){Q.stars=Q.mist<=M.n?3:Q.mist<=M.n*2?2:1;setTimeout(finish,700)}},400)}
 else{Q.mist++;setTimeout(()=>{pair.forEach(k=>{bs[k].classList.remove("up");bs[k].textContent="❓"});M.open=[];M.lock=false;sfx.no()},900)}
}

/* ============ RESULT / CERTIFICATE ============ */
function finish(){
 const wi=Q.wi,w=WORLDS[wi],p=P(),st=Q.stage,S=stagesOf(w).find(x=>x.id===st);
 const stars=Q.stars||(Q.mist<=1?3:Q.mist<=3?2:1);
 const gain=Q.xp+stars*10,lb=lvl(p.xp);p.xp+=gain;
 if(st==="quiz"){if(stars>(p.stars[w.id]||0))p.stars[w.id]=stars}
 else{p.done=p.done||{};const d=p.done[w.id]=p.done[w.id]||{};if(stars>(d[st]||0))d[st]=stars}
 const t=today(),y=new Date(Date.now()-864e5).toLocaleDateString("en-CA");
 if(p.last!==t){p.streak=p.last===y?(p.streak||0)+1:1;p.last=t}
 const nb=BADGES.filter(b=>!p.badges.includes(b.id)&&b.f(p));nb.forEach(b=>p.badges.push(b.id));save();
 const la=lvl(p.xp),stg=stagesOf(w),dn=stg.filter(x=>isDone(p,w,x.id)).length,next=stg.find(x=>!isDone(p,w,x.id)),comp=dn===stg.length;
 const nextOk=wi+1<WORLDS.length&&(p.stars[w.id]||0)>=1;
 const msg=stars===3?"Perfect! You are a superstar!":stars===2?"Great job! Almost perfect!":"Good work! Try again for more stars.";
 view(`<div class="card res"><div class="owl" style="font-size:64px">${comp?"🎓":S.e}</div><h2>${comp?esc(w.name)+" complete!":esc(S.n)+" done!"}</h2>
 <div class="st">${[1,2,3].map(n=>n<=stars?`<i style="animation-delay:${n*.3}s">⭐</i>`:`<i style="opacity:.25">⭐</i>`).join("")}</div>
 <p class="sub">🦉 ${msg}</p>
 <div class="gain"><div>+${gain} XP</div><div>Mistakes: ${Q.mist}</div>${la>lb?`<div>⬆️ Level ${la}!</div>`:""}</div>
 ${nb.length?`<div class="banner">New badge: ${nb.map(b=>b.i+" "+b.n).join(", ")}</div>`:""}
 <p class="sub">${dn}/${stg.length} activities finished in this world</p>
 ${next?`<button class="big" id="ns">Next: ${next.e} ${esc(next.n)} ➜</button>`:""}
 ${comp?`<button class="big" id="ct">🎓 Get my certificate</button>`:`<p class="sub">🔒 Finish every activity to unlock your certificate</p>`}
 ${nextOk?`<button class="big alt" id="nw">Next world: ${esc(WORLDS[wi+1].name)} ${WORLDS[wi+1].emoji}</button>`:""}
 <button class="big ghost" id="rt">🔁 Play again</button><button class="big ghost" id="hb">📋 World menu</button><button class="big ghost" id="mp">🗺️ Back to map</button></div>`);
 sfx.win();confetti(comp?70:stars*20);
 if(la>lb||nb.length){setTimeout(()=>toast(la>lb?`🎉 Level up! You are now Level ${la}`:`🏅 ${nb[0].n}!`),700)}
 if($("#ns"))$("#ns").onclick=()=>goStage(wi,next.id);
 if($("#ct"))$("#ct").onclick=()=>showCert(wi);
 if($("#nw"))$("#nw").onclick=()=>viewHub(wi+1);
 $("#rt").onclick=()=>goStage(wi,st);$("#hb").onclick=()=>viewHub(wi);$("#mp").onclick=viewMap;
}
function showCert(wi){const w=WORLDS[wi],p=P();if(!complete(p,w)){toast("🔒 Finish every activity first!");return}
 const d=new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
 openOv(`<div class="cert"><div style="font-size:2.6rem">${w.badge}</div><h2>Certificate of Achievement</h2><p>Bismillah — this proudly certifies that</p>
 <div class="nm">${esc(p.name)}</div><p>has completed all ${stagesOf(w).length} activities of <b>${esc(w.name)}</b> in<br><b>Math Adventure</b></p>
 <div style="font-size:2rem">${"⭐".repeat(p.stars[w.id]||1)}</div><p><b>${esc(w.bname)}</b><br>MashaAllah, keep counting!</p><p style="font-size:.9rem">${d} · diinislaam.com/math</p></div>
 <div class="noprint"><button class="big" id="pr">🖨️ Print or save as PDF</button><button class="big ghost" id="cl">Close</button></div>`);
 $("#pr").onclick=()=>window.print();$("#cl").onclick=closeOv}

/* ============ START ============ */
load();
if(DB.cur&&DB.players[DB.cur])viewMap();else{DB.cur=null;viewWelcome()}

</script>
</body>
