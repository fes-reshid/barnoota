<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/zaadapp/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zaad: your day, prayer by prayer. Prayer times, Qibla, the 99 names, daily Qur'an goal and adhkar.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3a35">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="zaad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zaad: your day, prayer by prayer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#0b3a35">
  <div id="zaad-loading" style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#e7c873;font-family:Georgia,serif;letter-spacing:.3em;font-size:34px">
    <div>ZAAD<div id="zaad-hint" style="font-size:13px;letter-spacing:.05em;color:#cfe3dc;margin-top:14px;font-family:system-ui,sans-serif">Loading… the first time can take a few seconds.<br>If this stays here, use a recent Chrome, Edge, Safari or Firefox and refresh.</div></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // remove the loading screen once the app has drawn its first frame
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('zaad-loading'); if (e) e.remove();
    });
    // if it has not started after 20 seconds, say what to try instead of staying blank
    setTimeout(function () {
      var e = document.getElementById('zaad-loading'); if (!e) return;
      var m = document.getElementById('zaad-hint');
      if (m) m.innerHTML = 'This is taking too long.<br>Try: hold Shift and press refresh, or open this page in a private window.<br>If it still does not start, your browser or network may be blocking WebAssembly.';
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
