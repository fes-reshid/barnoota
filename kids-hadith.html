<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7778012722329637" crossorigin="anonymous"></script>
<title>Easy Ḥadīth for Kids — Kids Corner</title>
<meta name="description" content="Simple, short sayings of the Prophet Muhammad ﷺ, explained in easy words for kids.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; padding:0;
    background:#e9e2cd; font-family:'Cormorant Garamond', serif; color:var(--ink-brown);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .arabic{ font-family:'Amiri', serif; }

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:var(--maxw); margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:38px; height:38px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none; }
  .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  .back-pill{
    display:flex; align-items:center; gap:6px; text-decoration:none; font-family:'Marcellus';
    font-size:14px; color:var(--ink-brown); background:#fff; border:1px solid var(--gold-soft);
    border-radius:20px; padding:8px 16px;
  }
  .back-pill:hover{ background:var(--parchment-deep); }

  .page-head{ text-align:center; padding:44px 20px 8px; }
  .eyebrow{ font-family:'Marcellus'; color:var(--green); font-size:14px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; }
  .page-head h1{ font-family:'Marcellus'; font-size:clamp(26px,4vw,38px); color:var(--ink-navy); margin:0 0 10px; }
  .page-head p{ font-size:17px; color:#6b5a3f; line-height:1.5; max-width:560px; margin:0 auto; }

  .progress-wrap{ max-width:420px; margin:22px auto 0; padding:0 20px; }
  .progress-track{ background:var(--parchment-deep); border-radius:12px; height:12px; overflow:hidden; }
  .progress-fill{ background:linear-gradient(90deg, var(--gold), var(--green)); height:100%; width:0%; transition:width .4s ease; }
  .progress-text{ text-align:center; font-family:'JetBrains Mono', monospace, monospace; font-size:12.5px; color:var(--ink-navy); margin-top:6px; }

  .hadith-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:22px;
    max-width:var(--maxw); margin:0 auto; padding:28px 20px 90px;
  }
  .hadith-card{
    background:#fff; border:2px solid var(--gold-soft); border-radius:18px; padding:24px;
    display:flex; flex-direction:column; box-shadow:0 6px 16px rgba(60,45,20,.08);
    transition:border-color .2s ease;
  }
  .hadith-card.learned{ border-color:var(--green); background:var(--green-bg); }
  .hadith-icon{ font-size:34px; margin-bottom:10px; }
  .hadith-card h3{ font-family:'Marcellus'; font-size:19px; color:var(--ink-navy); margin:0 0 10px; }
  .hadith-arabic{ font-size:19px; color:var(--gold); margin:0 0 10px; line-height:1.7; }
  .hadith-en{ font-size:15.5px; color:var(--ink-brown); margin:0 0 10px; font-style:italic; line-height:1.5; }
  .hadith-why{ font-size:14px; color:#6b5a3f; line-height:1.5; margin:0 0 16px; flex:1; }
  .learn-btn{
    align-self:flex-start; font-family:'JetBrains Mono', monospace, monospace; font-size:12px;
    letter-spacing:.04em; text-transform:uppercase; padding:9px 18px; border-radius:20px; cursor:pointer;
    border:1.5px solid var(--gold-soft); background:#fff; color:var(--ink-navy); transition:background .15s, border-color .15s, color .15s;
  }
  .hadith-card.learned .learn-btn{ background:var(--green); border-color:var(--green); color:#fff; }
  .learn-btn:hover{ border-color:var(--green); }

  footer{ background:var(--ink-navy); color:#c9d2e0; padding:36px 20px 24px; text-align:center; }
  footer .flinks{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  footer .flinks a{ text-decoration:none; color:#c9d2e0; }
  footer .flinks a:hover{ color:#faf3e0; }
  footer .fine{ font-size:13px; color:#8b96ab; margin:0; }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="brand" href="/">
      <span class="brand-mark arabic">د</span>
      <span class="brand-text">Diin Islaam<small>دين الإسلام</small></span>
    </a>
    <a class="back-pill" href="kids.html">← Kids Corner</a>
  </div>
</header>

<div class="page-head">
  <p class="eyebrow">📜 Easy Ḥadīth</p>
  <h1>Sayings of the Prophet ﷺ</h1>
  <p>Read each one, then tap "I learned this!" to keep track of how many you know.</p>
</div>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-text" id="progress-text">0 / 8 learned</div>
</div>

<div class="hadith-grid" id="hadith-grid"></div>

<footer>
  <p class="arabic">وَقُل رَّبِّ زِدْنِي عِلْمًا</p>
  <div class="flinks">
    <a href="kids.html">Kids Corner</a>
    <a href="hadeeth.html">Ḥadīth</a>
    <a href="/">Diin Islaam Home</a>
  </div>
  <p class="fine">© <span id="year"></span> Diin Islaam · diinislaam.com</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const HADITHS = [
  { icon:'😊', title:'Smiling is Charity', ar:'تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ', en:'"Your smile for your brother is charity."', why:'A small smile can make someone\'s day better — and Allah rewards you for it!' },
  { icon:'🧼', title:'Cleanliness is Half of Faith', ar:'الطُّهُورُ شَطْرُ الْإِيمَانِ', en:'"Cleanliness is half of faith."', why:'Keeping yourself and your things clean is part of being a good Muslim.' },
  { icon:'❤️', title:'Love for Others', ar:'لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ', en:'"None of you truly believes until he loves for his brother what he loves for himself."', why:'Wanting good things for your friends and siblings, just like you want for yourself, is real love.' },
  { icon:'🐾', title:'Be Kind to Little Ones', ar:'لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا', en:'"He is not one of us who does not show mercy to our young ones."', why:'Being gentle and kind to younger children and animals pleases Allah.' },
  { icon:'🗣️', title:'Speak Good or Stay Quiet', ar:'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ', en:'"Whoever believes in Allah and the Last Day should speak good or remain silent."', why:'Before you speak, think — is it kind and true? If not, it\'s better to stay quiet.' },
  { icon:'💪', title:'The Real Strong Person', ar:'لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ', en:'"The strong person is not the one who wrestles well, but the one who controls himself when angry."', why:'Staying calm when you feel angry is a real superpower!' },
  { icon:'🚸', title:'Clearing the Path is Charity', ar:'إِمَاطَةُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ', en:'"Removing something harmful from the road is charity."', why:'Even picking up something that could hurt someone, like a sharp rock, is a good deed.' },
  { icon:'🕋', title:'The Best of You', ar:'خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ', en:'"The best among you are those who are best to their families."', why:'Being kind and helpful at home, to your parents and siblings, matters a lot to Allah.' }
];

const STORAGE_KEY = 'kids-hadith-learned';
function loadLearned(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveLearned(set){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(set))); }catch(e){}
}
let learned = loadLearned();

function updateProgress(){
  const pct = Math.round((learned.size / HADITHS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = learned.size + ' / ' + HADITHS.length + ' learned';
}

function render(){
  const grid = document.getElementById('hadith-grid');
  grid.innerHTML = '';
  HADITHS.forEach((h, i) => {
    const isLearned = learned.has(i);
    const card = document.createElement('div');
    card.className = 'hadith-card' + (isLearned ? ' learned' : '');
    card.innerHTML = `
      <div class="hadith-icon">${h.icon}</div>
      <h3>${h.title}</h3>
      <p class="hadith-arabic arabic">${h.ar}</p>
      <p class="hadith-en">${h.en}</p>
      <p class="hadith-why">${h.why}</p>
      <button class="learn-btn">${isLearned ? '✓ Learned!' : 'I learned this!'}</button>
    `;
    card.querySelector('.learn-btn').addEventListener('click', () => {
      if(learned.has(i)){ learned.delete(i); } else { learned.add(i); }
      saveLearned(learned);
      updateProgress();
      render();
    });
    grid.appendChild(card);
  });
}

updateProgress();
render();
</script>
<script src="/cursor.js" defer></script>
</body>
</html>
