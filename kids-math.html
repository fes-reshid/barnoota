<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice — Kids Corner</title>
<meta name="description" content="Grade-by-grade math practice for kids, from Foundation to Grade 6: counting, addition, multiplication, fractions, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --sky:#2e86ab; --sky-dark:#215f78; --danger:#8a3324;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; padding:0;
    background:#e9e2cd; font-family:'Cormorant Garamond', serif; color:var(--ink-brown);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .arabic{ font-family:'Amiri', serif; }

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:var(--maxw); margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:38px; height:38px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none; }
  .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  .back-pill{
    display:flex; align-items:center; gap:6px; text-decoration:none; font-family:'Marcellus';
    font-size:14px; color:var(--ink-brown); background:#fff; border:1px solid var(--gold-soft);
    border-radius:20px; padding:8px 16px;
  }
  .back-pill:hover{ background:var(--parchment-deep); }

  .page-head{ text-align:center; padding:40px 20px 8px; }
  .eyebrow{ font-family:'Marcellus'; color:var(--sky); font-size:14px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; }
  .page-head h1{ font-family:'Marcellus'; font-size:clamp(26px,4vw,38px); color:var(--ink-navy); margin:0 0 10px; }
  .page-head p{ font-size:17px; color:#6b5a3f; line-height:1.5; max-width:520px; margin:0 auto; }

  .wrap{ max-width:560px; margin:0 auto; padding:24px 20px 90px; }

  .grade-row{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .grade-btn{
    font-family:'JetBrains Mono', monospace, monospace; font-size:12px; letter-spacing:.03em;
    padding:8px 14px; border-radius:18px; cursor:pointer; border:1.5px solid var(--gold-soft);
    background:#fff; color:var(--ink-navy); transition:background .15s, color .15s;
  }
  .grade-btn.active{ background:var(--sky); border-color:var(--sky); color:#fff; }
  .grade-desc{ text-align:center; font-size:14.5px; color:#8a7654; margin:0 0 20px; }

  .start-card{ text-align:center; background:#fff; border:2px solid var(--gold-soft); border-radius:20px; padding:34px 26px; }
  .start-card .icon{ font-size:44px; margin-bottom:10px; }
  .start-card h2{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); margin:0 0 10px; }
  .start-card p{ font-size:15.5px; color:#6b5a3f; margin:0 0 20px; }

  .stat-row{ display:flex; justify-content:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-chip{
    background:#fff; border:1.5px solid var(--gold-soft); border-radius:16px; padding:8px 18px;
    font-family:'JetBrains Mono', monospace, monospace; font-size:13px; color:var(--ink-navy); font-weight:700;
  }
  .stat-chip b{ color:var(--sky); }

  .quiz-panel{
    background:#fff; border:2px solid var(--gold-soft); border-radius:20px; padding:34px 26px;
    text-align:center; box-shadow:0 8px 20px rgba(60,45,20,.08);
  }
  .question{ font-family:'Marcellus'; font-size:clamp(28px,7vw,42px); color:var(--ink-navy); margin:0 0 26px; line-height:1.3; }
  .question .objects{ font-size:clamp(22px,6vw,32px); letter-spacing:4px; display:block; margin-bottom:10px; }
  .answer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .answer-grid.two-col{ grid-template-columns:1fr 1fr; }
  .answer-btn{
    font-family:'Marcellus'; font-size:22px; padding:16px; border-radius:14px; cursor:pointer;
    border:2px solid var(--gold-soft); background:var(--parchment); color:var(--ink-navy);
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .answer-btn:hover:not(:disabled){ transform:translateY(-2px); border-color:var(--sky); }
  .answer-btn:disabled{ cursor:default; }
  .answer-btn.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green-dark); }
  .answer-btn.incorrect{ background:#f6e2dd; border-color:var(--danger); color:var(--danger); }

  .feedback{ min-height:26px; margin-top:18px; font-size:16px; font-weight:700; }
  .feedback.right{ color:var(--green-dark); }
  .feedback.wrong{ color:var(--danger); }

  .session-summary{ display:none; text-align:center; }
  .session-summary.show{ display:block; animation:popIn .4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .session-summary h2{ font-family:'Marcellus'; color:var(--sky-dark); margin:0 0 8px; font-size:26px; }
  .session-summary .score-big{ font-family:'Marcellus'; font-size:44px; color:var(--ink-navy); margin:8px 0; }
  .btn{
    display:inline-block; text-decoration:none; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:16px; padding:11px 26px; border-radius:26px; border:none; cursor:pointer;
    background:var(--sky); color:#fff; transition:transform .15s ease, background .15s ease; margin-top:8px;
  }
  .btn:hover{ transform:translateY(-2px); background:var(--sky-dark); }
  .hidden{ display:none !important; }

  footer{ background:var(--ink-navy); color:#c9d2e0; padding:36px 20px 24px; text-align:center; margin-top:20px; }
  footer .flinks{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  footer .flinks a{ text-decoration:none; color:#c9d2e0; }
  footer .flinks a:hover{ color:#faf3e0; }
  footer .fine{ font-size:13px; color:#8b96ab; margin:0; }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="brand" href="/">
      <span class="brand-mark arabic">د</span>
      <span class="brand-text">Diin Islaam<small>دين الإسلام</small></span>
    </a>
    <a class="back-pill" href="kids.html">← Kids Corner</a>
  </div>
</header>

<div class="page-head">
  <p class="eyebrow">🔢 Math Practice</p>
  <h1>Number Fun</h1>
  <p>Pick your class, then answer 10 quick questions made just for that level.</p>
</div>

<div class="wrap">
  <div class="grade-row" id="grade-row"></div>
  <p class="grade-desc" id="grade-desc"></p>

  <div id="start-block" class="start-card">
    <div class="icon">🚀</div>
    <h2 id="start-title"></h2>
    <p id="start-desc"></p>
    <button class="btn" id="start-btn">Start Practicing</button>
  </div>

  <div id="quiz-block" class="hidden">
    <div class="stat-row">
      <div class="stat-chip">Question: <b id="q-count">1</b> / 10</div>
      <div class="stat-chip">Score: <b id="score-count">0</b></div>
      <div class="stat-chip">Streak: <b id="streak-count">0</b></div>
    </div>

    <div class="quiz-panel" id="quiz-panel">
      <div class="question" id="question"></div>
      <div class="answer-grid" id="answer-grid"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="session-summary" id="session-summary">
      <h2>🎉 Round Complete!</h2>
      <div class="score-big" id="final-score"></div>
      <p id="final-msg"></p>
      <button class="btn" id="play-again-btn">Play Again</button>
      <button class="btn" id="change-grade-btn" style="background:var(--gold-soft); color:var(--ink-navy);">Choose Another Class</button>
    </div>
  </div>
</div>

<footer>
  <p class="arabic">وَقُل رَّبِّ زِدْنِي عِلْمًا</p>
  <div class="flinks">
    <a href="kids.html">Kids Corner</a>
    <a href="/">Diin Islaam Home</a>
  </div>
  <p class="fine">© <span id="year"></span> Diin Islaam · diinislaam.com</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const TOTAL_QUESTIONS = 10;
const OBJECT_EMOJIS = ['🍎','⭐','🎈','🐟','🌸','🚗'];

const GRADES = [
  { id:'foundation', label:'Foundation', title:'Foundation — Counting', desc:'Count the pictures and pick the right number.' },
  { id:'g1', label:'Grade 1', title:'Grade 1 — Add & Subtract to 20', desc:'Simple addition and subtraction up to 20.' },
  { id:'g2', label:'Grade 2', title:'Grade 2 — Add & Subtract to 100', desc:'Addition and subtraction up to 100.' },
  { id:'g3', label:'Grade 3', title:'Grade 3 — Multiplication & Division', desc:'Times tables 1–10 and simple division facts.' },
  { id:'g4', label:'Grade 4', title:'Grade 4 — Bigger Multiplication', desc:'2-digit × 1-digit multiplication and division with a remainder-free split.' },
  { id:'g5', label:'Grade 5', title:'Grade 5 — Fractions & Percent', desc:'Adding simple fractions and finding percentages of numbers.' },
  { id:'g6', label:'Grade 6', title:'Grade 6 — Order of Operations', desc:'Order of operations and working with negative numbers.' }
];

let currentGrade = localStorage.getItem('kids-math-grade') || 'foundation';
let qIndex = 0, score = 0, streak = 0, current = null, locked = false;

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function uniqueOptionsAround(answer, spread, count, minVal){
  const floor = minVal === undefined ? -Infinity : minVal;
  const options = new Set([answer]);
  let guard = 0;
  while(options.size < count && guard < 50){
    guard++;
    const delta = randInt(-spread, spread) || 1;
    const val = answer + delta;
    if(val >= floor) options.add(val);
  }
  return shuffle(Array.from(options));
}

function getCtx(){
  if(!window.__actx) window.__actx = new (window.AudioContext || window.webkitAudioContext)();
  return window.__actx;
}
function beep(freq, dur, type){
  try{
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }catch(e){}
}
function playRight(){ beep(660, 0.12, 'sine'); setTimeout(()=>beep(880,0.16,'sine'), 90); }
function playWrong(){ beep(180, 0.2, 'sawtooth'); }
function playDone(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sine'), i*140)); }

/* ---------- question generators, one per grade ---------- */
function genFoundation(){
  const n = randInt(1, 10);
  const emoji = OBJECT_EMOJIS[randInt(0, OBJECT_EMOJIS.length - 1)];
  return {
    display: emoji.repeat(n),
    text: 'How many are there?',
    answer: n,
    options: uniqueOptionsAround(n, 3, 4, 1)
  };
}
function genG1(){
  const op = Math.random() < 0.5 ? '+' : '−';
  let a, b, answer;
  if(op === '+'){ a = randInt(0,15); b = randInt(0, 20 - a); answer = a + b; }
  else { a = randInt(0,20); b = randInt(0,a); answer = a - b; }
  return { text: a + ' ' + op + ' ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 4, 4, 0) };
}
function genG2(){
  const op = Math.random() < 0.5 ? '+' : '−';
  let a, b, answer;
  if(op === '+'){ a = randInt(10,70); b = randInt(5, 100 - a); answer = a + b; }
  else { a = randInt(20,100); b = randInt(0,a); answer = a - b; }
  return { text: a + ' ' + op + ' ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 6, 4, 0) };
}
function genG3(){
  if(Math.random() < 0.6){
    const a = randInt(1,10), b = randInt(1,10);
    const answer = a * b;
    return { text: a + ' × ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 8, 4, 0) };
  } else {
    const b = randInt(2,10), answer = randInt(1,10), a = b * answer;
    return { text: a + ' ÷ ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 3, 4, 0) };
  }
}
function genG4(){
  if(Math.random() < 0.6){
    const a = randInt(10,99), b = randInt(2,9);
    const answer = a * b;
    return { text: a + ' × ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 15, 4, 0) };
  } else {
    const b = randInt(2,12), answer = randInt(3,15), a = b * answer;
    return { text: a + ' ÷ ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 4, 4, 0) };
  }
}
function genG5(){
  if(Math.random() < 0.5){
    const denom = randInt(4,10);
    const n1 = randInt(1, denom - 2);
    const n2 = randInt(1, denom - n1 - 1) || 1;
    const answer = n1 + n2;
    return { text: n1 + '⁄' + denom + ' + ' + n2 + '⁄' + denom + ' = ?⁄' + denom, answer, options: uniqueOptionsAround(answer, 2, 4, 1) };
  } else {
    const pct = [10,20,25,50][randInt(0,3)];
    const multiple = pct === 25 ? 4 : pct === 50 ? 2 : pct === 20 ? 5 : 10;
    const num = randInt(2,10) * multiple;
    const answer = Math.round(num * pct / 100);
    return { text: pct + '% of ' + num + ' = ?', answer, options: uniqueOptionsAround(answer, Math.max(2, Math.round(answer*0.3)), 4, 0) };
  }
}
function genG6(){
  if(Math.random() < 0.5){
    const a = randInt(1,9), b = randInt(1,9), c = randInt(1,9);
    const useMultFirst = Math.random() < 0.5;
    let text, answer;
    if(useMultFirst){ answer = a + b * c; text = a + ' + ' + b + ' × ' + c + ' = ?'; }
    else { answer = a * b - c; text = a + ' × ' + b + ' − ' + c + ' = ?'; }
    return { text, answer, options: uniqueOptionsAround(answer, 6, 4, undefined) };
  } else {
    const a = randInt(-10,10) || 3, b = randInt(1,10);
    const op = Math.random() < 0.5 ? '+' : '−';
    const answer = op === '+' ? a + b : a - b;
    return { text: a + ' ' + op + ' ' + b + ' = ?', answer, options: uniqueOptionsAround(answer, 5, 4, undefined) };
  }
}

const GENERATORS = { foundation: genFoundation, g1: genG1, g2: genG2, g3: genG3, g4: genG4, g5: genG5, g6: genG6 };

function renderGradeRow(){
  const row = document.getElementById('grade-row');
  row.innerHTML = '';
  GRADES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'grade-btn' + (g.id === currentGrade ? ' active' : '');
    btn.textContent = g.label;
    btn.addEventListener('click', () => {
      currentGrade = g.id;
      localStorage.setItem('kids-math-grade', currentGrade);
      renderGradeRow();
      showStartCard();
    });
    row.appendChild(btn);
  });
  const g = GRADES.find(x => x.id === currentGrade);
  document.getElementById('grade-desc').textContent = g.desc;
}

function showStartCard(){
  const g = GRADES.find(x => x.id === currentGrade);
  document.getElementById('grade-desc').textContent = g.desc;
  document.getElementById('start-title').textContent = g.title;
  document.getElementById('start-desc').textContent = g.desc;
  document.getElementById('start-block').classList.remove('hidden');
  document.getElementById('quiz-block').classList.add('hidden');
}

function renderQuestion(){
  current = GENERATORS[currentGrade]();
  locked = false;
  const qEl = document.getElementById('question');
  qEl.innerHTML = (current.display ? '<span class="objects">' + current.display + '</span>' : '') + current.text;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  const grid = document.getElementById('answer-grid');
  grid.innerHTML = '';
  current.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    grid.appendChild(btn);
  });
  document.getElementById('q-count').textContent = qIndex + 1;
}

function handleAnswer(opt, btn){
  if(locked) return;
  locked = true;
  const buttons = document.querySelectorAll('#answer-grid .answer-btn');
  const fb = document.getElementById('feedback');
  const correct = opt === current.answer;
  buttons.forEach(b => {
    b.disabled = true;
    if(Number(b.textContent) === current.answer) b.classList.add('correct');
    else if(b === btn) b.classList.add('incorrect');
  });
  if(correct){
    score++; streak++;
    playRight();
    fb.textContent = ['Great job! 🌟','Correct! 🎉','You got it! 👍','Nice work! ✨'][randInt(0,3)];
    fb.classList.add('right');
  } else {
    streak = 0;
    playWrong();
    fb.textContent = 'Not quite — the answer was ' + current.answer + '.';
    fb.classList.add('wrong');
  }
  document.getElementById('score-count').textContent = score;
  document.getElementById('streak-count').textContent = streak;

  setTimeout(() => {
    qIndex++;
    if(qIndex >= TOTAL_QUESTIONS){ showSummary(); }
    else { renderQuestion(); }
  }, 1200);
}

function showSummary(){
  playDone();
  document.getElementById('quiz-panel').style.display = 'none';
  const pct = Math.round((score / TOTAL_QUESTIONS) * 100);
  document.getElementById('final-score').textContent = score + ' / ' + TOTAL_QUESTIONS;
  const msg = pct === 100 ? "Perfect score — you're a math star! 🌟" :
              pct >= 70 ? "Great job! Keep practicing to get even better." :
              "Good try! Play again to beat your score.";
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('session-summary').classList.add('show');
}

function startRound(){
  qIndex = 0; score = 0; streak = 0;
  document.getElementById('score-count').textContent = 0;
  document.getElementById('streak-count').textContent = 0;
  document.getElementById('quiz-panel').style.display = '';
  document.getElementById('session-summary').classList.remove('show');
  document.getElementById('start-block').classList.add('hidden');
  document.getElementById('quiz-block').classList.remove('hidden');
  renderQuestion();
}

document.getElementById('start-btn').addEventListener('click', startRound);
document.getElementById('play-again-btn').addEventListener('click', startRound);
document.getElementById('change-grade-btn').addEventListener('click', showStartCard);

renderGradeRow();
showStartCard();
</script>
<script src="/cursor.js" defer></script>
</body>
</html>
