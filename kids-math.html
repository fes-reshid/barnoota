<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice — Kids Corner</title>
<meta name="description" content="Fun, quick math practice for kids: addition, subtraction, and multiplication with instant feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b46; --ink-brown:#3c2f26;
    --parchment:#faf3e0; --parchment-deep:#f2e6c9;
    --gold:#a97c25; --gold-soft:#d3ac5c;
    --green:#2e6b58; --green-dark:#1f4f40; --green-bg:#e4efe6;
    --sky:#2e86ab; --sky-dark:#215f78; --danger:#8a3324;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; }
  body{
    margin:0; padding:0;
    background:#e9e2cd; font-family:'Cormorant Garamond', serif; color:var(--ink-brown);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .arabic{ font-family:'Amiri', serif; }

  header.site{
    position:sticky; top:0; z-index:50;
    background:rgba(250,243,224,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:var(--maxw); margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:38px; height:38px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; color:#faf3e0; font-family:'Amiri'; font-size:19px; flex:none; }
  .brand-text{ font-family:'Marcellus'; font-size:22px; color:var(--ink-navy); line-height:1.1; }
  .brand-text small{ display:block; font-family:'Amiri'; font-size:13px; color:var(--gold); font-weight:400; }
  .back-pill{
    display:flex; align-items:center; gap:6px; text-decoration:none; font-family:'Marcellus';
    font-size:14px; color:var(--ink-brown); background:#fff; border:1px solid var(--gold-soft);
    border-radius:20px; padding:8px 16px;
  }
  .back-pill:hover{ background:var(--parchment-deep); }

  .page-head{ text-align:center; padding:44px 20px 8px; }
  .eyebrow{ font-family:'Marcellus'; color:var(--sky); font-size:14px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; }
  .page-head h1{ font-family:'Marcellus'; font-size:clamp(26px,4vw,38px); color:var(--ink-navy); margin:0 0 10px; }
  .page-head p{ font-size:17px; color:#6b5a3f; line-height:1.5; max-width:520px; margin:0 auto; }

  .wrap{ max-width:560px; margin:0 auto; padding:24px 20px 90px; }

  .level-row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
  .level-btn{
    font-family:'JetBrains Mono', monospace, monospace; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase;
    padding:9px 18px; border-radius:20px; cursor:pointer; border:1.5px solid var(--gold-soft);
    background:#fff; color:var(--ink-navy); transition:background .15s, color .15s;
  }
  .level-btn.active{ background:var(--sky); border-color:var(--sky); color:#fff; }

  .stat-row{ display:flex; justify-content:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-chip{
    background:#fff; border:1.5px solid var(--gold-soft); border-radius:16px; padding:8px 18px;
    font-family:'JetBrains Mono', monospace, monospace; font-size:13px; color:var(--ink-navy); font-weight:700;
  }
  .stat-chip b{ color:var(--sky); }

  .quiz-panel{
    background:#fff; border:2px solid var(--gold-soft); border-radius:20px; padding:34px 26px;
    text-align:center; box-shadow:0 8px 20px rgba(60,45,20,.08);
  }
  .question{ font-family:'Marcellus'; font-size:clamp(34px,8vw,52px); color:var(--ink-navy); margin:0 0 26px; }
  .answer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .answer-btn{
    font-family:'Marcellus'; font-size:24px; padding:16px; border-radius:14px; cursor:pointer;
    border:2px solid var(--gold-soft); background:var(--parchment); color:var(--ink-navy);
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .answer-btn:hover:not(:disabled){ transform:translateY(-2px); border-color:var(--sky); }
  .answer-btn:disabled{ cursor:default; }
  .answer-btn.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green-dark); }
  .answer-btn.incorrect{ background:#f6e2dd; border-color:var(--danger); color:var(--danger); }

  .feedback{ min-height:26px; margin-top:18px; font-size:16px; font-weight:700; }
  .feedback.right{ color:var(--green-dark); }
  .feedback.wrong{ color:var(--danger); }

  .session-summary{ display:none; text-align:center; }
  .session-summary.show{ display:block; animation:popIn .4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .session-summary h2{ font-family:'Marcellus'; color:var(--sky-dark); margin:0 0 8px; font-size:26px; }
  .session-summary .score-big{ font-family:'Marcellus'; font-size:44px; color:var(--ink-navy); margin:8px 0; }
  .btn{
    display:inline-block; text-decoration:none; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:16px; padding:11px 26px; border-radius:26px; border:none; cursor:pointer;
    background:var(--sky); color:#fff; transition:transform .15s ease, background .15s ease; margin-top:8px;
  }
  .btn:hover{ transform:translateY(-2px); background:var(--sky-dark); }

  footer{ background:var(--ink-navy); color:#c9d2e0; padding:36px 20px 24px; text-align:center; margin-top:20px; }
  footer .flinks{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  footer .flinks a{ text-decoration:none; color:#c9d2e0; }
  footer .flinks a:hover{ color:#faf3e0; }
  footer .fine{ font-size:13px; color:#8b96ab; margin:0; }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="brand" href="/">
      <span class="brand-mark arabic">د</span>
      <span class="brand-text">Diin Islaam<small>دين الإسلام</small></span>
    </a>
    <a class="back-pill" href="kids.html">← Kids Corner</a>
  </div>
</header>

<div class="page-head">
  <p class="eyebrow">🔢 Math Practice</p>
  <h1>Number Fun</h1>
  <p>Pick a level, then answer 10 quick questions. Ready, set, go!</p>
</div>

<div class="wrap">
  <div class="level-row" id="level-row">
    <button class="level-btn active" data-level="easy">Easy (+ / −  to 10)</button>
    <button class="level-btn" data-level="medium">Medium (+ / − to 50)</button>
    <button class="level-btn" data-level="hard">Hard (× tables)</button>
  </div>

  <div class="stat-row">
    <div class="stat-chip">Question: <b id="q-count">1</b> / 10</div>
    <div class="stat-chip">Score: <b id="score-count">0</b></div>
    <div class="stat-chip">Streak: <b id="streak-count">0</b></div>
  </div>

  <div class="quiz-panel" id="quiz-panel">
    <div class="question" id="question"></div>
    <div class="answer-grid" id="answer-grid"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="session-summary" id="session-summary">
    <h2>🎉 Round Complete!</h2>
    <div class="score-big" id="final-score"></div>
    <p id="final-msg"></p>
    <button class="btn" id="play-again-btn">Play Again</button>
  </div>
</div>

<footer>
  <p class="arabic">وَقُل رَّبِّ زِدْنِي عِلْمًا</p>
  <div class="flinks">
    <a href="kids.html">Kids Corner</a>
    <a href="/">Diin Islaam Home</a>
  </div>
  <p class="fine">© <span id="year"></span> Diin Islaam · diinislaam.com</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const TOTAL_QUESTIONS = 10;
let level = 'easy';
let qIndex = 0;
let score = 0;
let streak = 0;
let current = null;
let locked = false;

function getCtx(){
  if(!window.__actx) window.__actx = new (window.AudioContext || window.webkitAudioContext)();
  return window.__actx;
}
function beep(freq, dur, type){
  try{
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }catch(e){}
}
function playRight(){ beep(660, 0.12, 'sine'); setTimeout(()=>beep(880,0.16,'sine'), 90); }
function playWrong(){ beep(180, 0.2, 'sawtooth'); }
function playDone(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sine'), i*140)); }

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

function makeQuestion(){
  let a, b, op, answer;
  if(level === 'easy'){
    op = Math.random() < 0.5 ? '+' : '−';
    if(op === '+'){ a = randInt(0,10); b = randInt(0,10); answer = a + b; }
    else { a = randInt(0,10); b = randInt(0,a); answer = a - b; }
  } else if(level === 'medium'){
    op = Math.random() < 0.5 ? '+' : '−';
    if(op === '+'){ a = randInt(5,50); b = randInt(5,50); answer = a + b; }
    else { a = randInt(10,50); b = randInt(0,a); answer = a - b; }
  } else {
    op = '×';
    a = randInt(1,10); b = randInt(1,10); answer = a * b;
  }
  const options = new Set([answer]);
  while(options.size < 4){
    const delta = randInt(-6, 6) || 1;
    const wrong = answer + delta;
    if(wrong >= 0) options.add(wrong);
  }
  const optionList = shuffle(Array.from(options));
  return { text: a + ' ' + op + ' ' + b + ' = ?', answer, options: optionList };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion(){
  current = makeQuestion();
  locked = false;
  document.getElementById('question').textContent = current.text;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  const grid = document.getElementById('answer-grid');
  grid.innerHTML = '';
  current.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt, btn));
    grid.appendChild(btn);
  });
  document.getElementById('q-count').textContent = qIndex + 1;
}

function handleAnswer(opt, btn){
  if(locked) return;
  locked = true;
  const buttons = document.querySelectorAll('.answer-btn');
  const fb = document.getElementById('feedback');
  const correct = opt === current.answer;
  buttons.forEach(b => {
    b.disabled = true;
    if(Number(b.textContent) === current.answer) b.classList.add('correct');
    else if(b === btn) b.classList.add('incorrect');
  });
  if(correct){
    score++; streak++;
    playRight();
    fb.textContent = ['Great job! 🌟','Correct! 🎉','You got it! 👍','Nice work! ✨'][randInt(0,3)];
    fb.classList.add('right');
  } else {
    streak = 0;
    playWrong();
    fb.textContent = 'Not quite — the answer was ' + current.answer + '.';
    fb.classList.add('wrong');
  }
  document.getElementById('score-count').textContent = score;
  document.getElementById('streak-count').textContent = streak;

  setTimeout(() => {
    qIndex++;
    if(qIndex >= TOTAL_QUESTIONS){ showSummary(); }
    else { renderQuestion(); }
  }, 1100);
}

function showSummary(){
  playDone();
  document.getElementById('quiz-panel').style.display = 'none';
  const pct = Math.round((score / TOTAL_QUESTIONS) * 100);
  document.getElementById('final-score').textContent = score + ' / ' + TOTAL_QUESTIONS;
  const msg = pct === 100 ? "Perfect score — you're a math star! 🌟" :
              pct >= 70 ? "Great job! Keep practicing to get even better." :
              "Good try! Play again to beat your score.";
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('session-summary').classList.add('show');
}

function startRound(){
  qIndex = 0; score = 0; streak = 0;
  document.getElementById('score-count').textContent = 0;
  document.getElementById('streak-count').textContent = 0;
  document.getElementById('quiz-panel').style.display = '';
  document.getElementById('session-summary').classList.remove('show');
  renderQuestion();
}

document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    startRound();
  });
});
document.getElementById('play-again-btn').addEventListener('click', startRound);

startRound();
</script>
<script src="/cursor.js" defer></script>
</body>
</html>
