  .banner-in::before{content:'';position:absolute;inset:7px;border:1.5px solid rgba(232,207,134,.5);border-radius:14px;pointer-events:none}
  .banner h3{margin:0 0 6px;font:800 21px Nunito;letter-spacing:.08em;text-transform:uppercase;color:#f3dc8e}

<body>
<header><div class="wrap"><span class="ar">تُحْفَةُ الأَطْفَال</span><div class="brand">Diin Islaam · Tajweed Quest · Parent view</div><h1 id="pName">Loading…</h1><div class="sub" id="pSub"></div></div></header>
<main class="wrap" id="main"><div class="center muted">Loading your child’s progress…</div></main>
<footer>This private page is read-only. Please don’t share the link — anyone with it can see this summary.<br>Questions? Message the teacher through your child’s account, or speak to them in class.</footer>
<script>
(function(){
  const PROJECT = 'diinislaam-8fdeb';
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const day = iso => { if(!iso) return '—'; const d = new Date(String(iso).length === 10 ? iso + 'T12:00' : iso); return isNaN(d) ? '—' : d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' }); };
  const token = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g, '');
  const fail = msg => { $('pName').textContent = 'Parent view'; $('main').innerHTML = '<div class="card center"><div style="font-size:44px">🔒</div><h2>' + esc(msg) + '</h2><p class="muted">Ask your child’s teacher for a new parent link.</p></div>'; };
  if(token.length < 16){ fail('This link is not complete.'); return; }
  fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/kids_quest_parent/' + token)
    .then(r => r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(doc => {
      if(!doc){ fail('This link has expired or was reset.'); return; }
      const f = doc.fields || {}, parse = k => { try { return JSON.parse((f[k] && f[k].stringValue) || 'null'); } catch(e){ return null; } };
      render(parse('data') || {}, parse('staffData') || {}, (f.updatedAt && f.updatedAt.stringValue) || '');
    }).catch(() => fail('We couldn’t load the page. Check your connection and try again.'));

  function render(d, sd, updated){
    document.title = (d.name || 'Student') + ' · Parent view';
    $('pName').textContent = d.name || 'Your child';
    $('pSub').innerHTML = [d.username ? '👤 @' + d.username : '', (d.classes || []).length ? '🏫 ' + d.classes.join(', ') : '', '🗓 Updated ' + day(updated)].filter(Boolean).map(t => '<span class="chip">' + esc(t) + '</span>').join('');
    const lbl = { done:'✓ Done', lateDone:'✓ Done late', late:'⚠ Late — not done', pending:'… Not yet due', open:'… To do' };
    const att = sd.attendance || null;
    let h = '<div class="tiles">' +
      '<div class="tile"><b>' + (d.pct || 0) + '%</b><span>of the course<br>' + (d.lessons || 0) + ' / ' + (d.total || 62) + ' lessons</span></div>' +
      '<div class="tile"><b>' + (d.memorised || 0) + '</b><span>line' + (d.memorised === 1 ? '' : 's') + ' memorised' + ((d.memoWeek || []).length ? '<br>+' + d.memoWeek.length + ' this week' : '') + '</span></div>' +
      '<div class="tile"><b>🔥 ' + ((d.streak && d.streak.count) || 0) + '</b><span>day streak<br>' + (d.streak && d.streak.last ? 'last ' + day(d.streak.last) : 'not started') + '</span></div>' +
      '<div class="tile"><b>' + (att && att.total ? Math.round(((att.present || 0) + (att.late || 0)) / att.total * 100) + '%' : (d.certs || 0) + '/15') + '</b><span>' + (att && att.total ? 'attendance<br>' + att.total + ' session' + (att.total === 1 ? '' : 's') : 'maps approved') + '</span></div></div>';
    const first = esc(String(d.name || 'Your child').split(/\s+/)[0]), approved = Number(d.certs) || 0;
    h += '<section class="banner"><div class="banner-in"><div class="orn">✦ ✦ ✦</div><h3>' + (approved ? 'Mā shā’ Allāh — beautiful recitation!' : 'Every letter is rewarded') + '</h3>' +
      '<p class="praise">' + (approved ? 'Well done, <b>' + first + '</b>! A teacher has listened to ' + first + '’s recitation and approved <b>' + approved + ' map' + (approved === 1 ? '' : 's') + '</b> for correct Tajweed and memorisation. May Allah make the Qur’an a light for them.' : '<b>' + first + '</b> is learning to recite the Qur’an with Tajweed. Every effort counts — whether the reading is already fluent or still takes effort. Please keep encouraging them at home.') + '</p>' +
      '<p class="hadith-ar">«الْمَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ، وَالَّذِي يَقْرَأُ الْقُرْآنَ وَيَتَتَعْتَعُ فِيهِ وَهُوَ عَلَيْهِ شَاقٌّ لَهُ أَجْرَانِ»</p>' +
      '<p class="hadith-en">“The one who is skilled in reciting the Qur’an will be with the noble and righteous scribes (the angels), and the one who recites the Qur’an and stumbles over it, finding it difficult, will have two rewards.”</p>' +
      '<span class="ref">The Prophet ﷺ · Sahih Muslim 798 · also in Sahih al-Bukhari 4937</span></div></section>';
    h += '<div class="card"><h2>📍 Where they are</h2><p style="margin:0 0 6px">Now on <b>' + esc(d.currentMap || 'Map 1') + '</b> · ' + (d.certs || 0) + ' of 15 maps approved by a teacher</p><div class="bar"><span style="width:' + (d.pct || 0) + '%"></span></div>' +
      ((d.memoWeek || []).length ? '<p style="margin:10px 0 0">🧠 Memorised this week: <b>line ' + d.memoWeek.map(esc).join(', ') + '</b></p>' : '') + '</div>';
    if((d.homework || []).length) h += '<div class="card"><h2>📚 Homework</h2><table><tr><th>Task</th><th>Due</th><th>Status</th></tr>' + d.homework.map(x => '<tr><td>' + esc(x.title) + '</td><td>' + esc(day(x.due)) + '</td><td class="st-' + esc(x.status) + '">' + (lbl[x.status] || esc(x.status)) + (x.at ? ' <small class="muted">' + esc(day(x.at)) + '</small>' : '') + '</td></tr>').join('') + '</table></div>';
    if(att && att.total) h += '<div class="card"><h2>📋 Attendance</h2><div class="att"><span class="pill">✅ Present ' + (att.present || 0) + '</span><span class="pill">⏰ Late ' + (att.late || 0) + '</span><span class="pill">❌ Absent ' + (att.absent || 0) + '</span><span class="pill">📝 Excused ' + (att.excused || 0) + '</span></div>' +
      ((att.recent || []).length ? '<table><tr><th>Date</th><th>Class</th><th>Mark</th></tr>' + att.recent.map(r => '<tr><td>' + esc(day(r.date)) + '</td><td>' + esc(r.cls || '') + '</td><td>' + ({ present:'✅ Present', late:'⏰ Late', absent:'❌ Absent', excused:'📝 Excused' }[r.mark] || esc(r.mark)) + '</td></tr>').join('') + '</table>' : '') + '</div>';
    if((d.badges || []).length) h += '<div class="card"><h2>🏅 Badges</h2><div class="badges">' + d.badges.map(b => '<span class="badge" title="' + esc(day(b.at)) + '">' + esc(b.icon) + ' ' + esc(b.name) + '</span>').join('') + '</div></div>';
    if((sd.recitations || []).length) h += '<div class="card"><h2>🎙️ Teacher feedback on recitation</h2><p class="muted" style="margin:0 0 6px">' + esc(String(d.name || 'Your child').split(/\s+/)[0]) + ' recorded these lines and the teacher listened.</p>' + sd.recitations.map(r => '<div class="note"><small>Line ' + esc(r.line) + (r.memorise ? ' · 🧠 recited from memory' : '') + (r.by ? ' · ' + esc(r.by) : '') + ' · ' + esc(day(r.at)) + '</small>' + esc(r.feedback) + '</div>').join('') + '</div>';
    if((d.notes || []).length) h += '<div class="card"><h2>💬 Teacher notes</h2>' + d.notes.map(n => '<div class="note"><small>' + esc(n.map) + (n.teacher ? ' · ' + esc(n.teacher) : '') + ' · ' + esc(day(n.at)) + '</small>' + esc(n.note) + '</div>').join('') + '</div>';
    if((d.messages || []).length) h += '<div class="card"><h2>✉️ Recent messages with the teacher</h2>' + d.messages.map(m => '<div class="msg ' + (m.from === 'student' ? 'me' : '') + '">' + esc(m.text) + '<small>' + (m.from === 'student' ? esc(d.name || 'Student') : '🧑‍🏫 ' + esc(m.author || 'Teacher')) + ' · ' + esc(day(m.at)) + '</small></div>').join('') + '</div>';
    if((d.quizzes || []).length) h += '<div class="card"><h2>📝 Teacher quizzes</h2><table><tr><th>Quiz</th><th>Best score</th><th>Last taken</th></tr>' + d.quizzes.map(q => '<tr><td>' + esc(q.title) + '</td><td>' + esc(q.best) + ' / ' + esc(q.total) + '</td><td>' + esc(day(q.at)) + '</td></tr>').join('') + '</table></div>';
    if((d.maps || []).length) h += '<div class="card"><h2>🗺️ Maps</h2><table><tr><th>Map</th><th>Lessons</th><th>Challenge</th><th>Teacher check</th></tr>' + d.maps.map(m => '<tr><td>' + esc(m.name) + '</td><td>' + esc(m.done) + ' / ' + esc(m.count) + '</td><td>' + (m.challenge != null ? esc(m.challenge) + '/15' : '—') + '</td><td>' + (m.approved ? '✅' : '—') + '</td></tr>').join('') + '</table></div>';
    $('main').innerHTML = h;
  }
})();
</script>
</body>
</html>
