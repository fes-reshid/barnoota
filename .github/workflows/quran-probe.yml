name: Quran.com word check (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/quran-probe.mjs', '.github/workflows/quran-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/quran-probe.mjs
