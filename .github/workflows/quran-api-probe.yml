# One-off check of the Quran.com API responses Seeraa uses (removed after reading the log).
name: Quran.com API probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/quran-api-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          H='Origin: https://diinislaam.com'
          probe() { echo "===== $1"; curl -sS -m 30 -D h.txt -H "$H" "$1" -o b.txt; grep -iE '^(HTTP|access-control-allow-origin|content-type|accept-ranges|content-length)' h.txt; head -c ${2:-1500} b.txt; echo; }
          probe 'https://api.quran.com/api/v4/resources/recitations?language=en' 2500
          probe 'https://api.quran.com/api/v4/resources/chapter_reciters?language=en' 2500
          probe 'https://api.quran.com/api/v4/recitations/7/by_ayah/20:114' 1200
          probe 'https://api.quran.com/api/v4/recitations/7/by_ayah/20:114?fields=segments' 1500
          probe 'https://api.quran.com/api/v4/chapter_recitations/7/20?segments=true' 600
          python3 - <<'PY'
          import json,urllib.request
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'probe'}),timeout=30))
          try:
              d=get('https://api.quran.com/api/v4/chapter_recitations/7/20?segments=true')
              af=d.get('audio_file',d); print('chapter keys',list(af.keys()))
              ts=af.get('timestamps') or af.get('verse_timings') or []
              print('n timestamps',len(ts)); print([t for t in ts if t.get('verse_key')=='20:114'] or ts[113:114])
          except Exception as e: print('chapter ERR',e)
          try:
              d=get('https://api.qurancdn.com/api/qdc/audio/reciters/7/audio_files?chapter=20&segments=true')
              af=d['audio_files'][0]; print('qdc keys',list(af.keys()),af.get('audio_url'))
              vt=af.get('verse_timings',[]); print([t for t in vt if t.get('verse_key')=='20:114'])
          except Exception as e: print('qdc ERR',e)
          try:
              d=get('https://api.quran.com/api/v4/verses/by_key/20:114?words=true&word_fields=text_uthmani,text_imlaei_simple&fields=text_uthmani')
              v=d['verse']; print('verse keys',list(v.keys())); print('text',v.get('text_uthmani'))
              print([(w.get('position'),w.get('char_type_name'),w.get('text_uthmani'),w.get('text_imlaei_simple'),w.get('text')) for w in v['words']])
          except Exception as e: print('verse ERR',e)
          PY
          probe 'https://api.qurancdn.com/api/qdc/audio/reciters/7/audio_files?chapter=96&segments=true' 400
          probe 'https://api.quran.com/api/v4/verses/by_key/96:1?words=true' 300
          for u in 'https://verses.quran.com/Alafasy/mp3/096001.mp3' 'https://download.quranicaudio.com/qdc/mishari_al_afasy/murattal/20.mp3'; do echo "===== HEAD $u"; curl -sSI -m 30 -H "$H" -H 'Range: bytes=0-99' "$u" | grep -iE '^(HTTP|access-control-allow-origin|content-type|accept-ranges|content-range|content-length)'; done
