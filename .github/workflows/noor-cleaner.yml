# Builds the two Windows programs in noor-cleaner/ whenever it changes (or by hand:
# Actions > NoorCleaner and NoorGuard > Run workflow):
#   NoorCleaner  storage cleaner:  NoorCleaner-Setup.exe (installer) and NoorCleaner.exe
#   NoorGuard    security program: NoorGuard-Setup.exe (installer) and NoorGuard.exe
# The installers ask for English / Arabic / Afaan Oromoo. A hand-run also publishes each program as its
# own public release (noorcleaner-latest and noorguard-latest).
name: NoorCleaner and NoorGuard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'noor-cleaner/**'
      - '.github/workflows/noor-cleaner.yml'

permissions:
  contents: write

concurrency:
  group: noor-cleaner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: cleaner
            name: NoorCleaner
            entry: noor_cleaner.py
            tag: noorcleaner-latest
            notes: Free storage cleaner for Windows, by Noorsoft. Download NoorCleaner-Setup.exe and run it.
          - key: guard
            name: NoorGuard
            entry: noor_guard.py
            tag: noorguard-latest
            notes: Free security program for Windows, by Noorsoft. Download NoorGuard-Setup.exe and run it.
    defaults:
      run:
        working-directory: noor-cleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.11.1 pillow==11.0.0 pystray==0.19.5
      - run: python -m unittest discover -s tests -v
      - name: Build ${{ matrix.name }}.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ${{ matrix.name }} --hidden-import pystray._win32 --icon assets\icon.ico --add-data "signatures.txt;." --add-data "assets\icon.ico;assets" --add-data "locales;locales" ${{ matrix.entry }}
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist\${{ matrix.name }}.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "${{ matrix.name }}.exe exited straight away (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = python -c "import ui_base; print(ui_base.VERSION)"
          & $iscc "/DAppKey=${{ matrix.key }}" "/DAppVersion=$version" installer\NoorApp.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      # Only keep the files when run by hand, so routine pushes don't use Actions storage.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.name }}-Windows
          path: |
            noor-cleaner/dist/${{ matrix.name }}-Setup.exe
            noor-cleaner/dist/${{ matrix.name }}.exe
          retention-days: 7
      - name: Publish the download (release ${{ matrix.tag }})
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import ui_base; print(ui_base.VERSION)"
          gh release view ${{ matrix.tag }} --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ matrix.tag }} --repo ${{ github.repository }} --target ${{ github.sha }} --title "${{ matrix.name }}" --notes "${{ matrix.notes }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release" }
          }
          gh release edit ${{ matrix.tag }} --repo ${{ github.repository }} --title "${{ matrix.name }} $version"
          gh release upload ${{ matrix.tag }} dist/${{ matrix.name }}-Setup.exe dist/${{ matrix.name }}.exe --clobber --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the files" }
