# Builds NoorCleaner.exe (the Windows storage cleaner & virus scanner in noor-cleaner/) whenever it
# changes (or by hand: Actions > NoorCleaner > Run workflow).
name: NoorCleaner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'noor-cleaner/**'
      - '.github/workflows/noor-cleaner.yml'

permissions:
  contents: read

concurrency:
  group: noor-cleaner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: noor-cleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.11.1
      - name: Build NoorCleaner.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name NoorCleaner --icon assets\icon.ico --add-data "signatures.txt;." --add-data "assets\icon.ico;assets" noor_cleaner.py
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist\NoorCleaner.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "NoorCleaner.exe exited straight away (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      # Only keep the exe when run by hand, so routine pushes don't use Actions storage.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: NoorCleaner-Windows
          path: noor-cleaner/dist/NoorCleaner.exe
          retention-days: 7
