# Builds NoorScanner.exe (the Windows file & virus scanner in noor-scanner/) whenever it
# changes (or by hand: Actions > NoorScanner > Run workflow).
name: NoorScanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'noor-scanner/**'
      - '.github/workflows/noor-scanner.yml'

permissions:
  contents: read

concurrency:
  group: noor-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: noor-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.11.1
      - name: Build NoorScanner.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name NoorScanner --add-data "signatures.txt;." noor_scanner.py
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist\NoorScanner.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "NoorScanner.exe exited straight away (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      # Only keep the exe when run by hand, so routine pushes don't use Actions storage.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: NoorScanner-Windows
          path: noor-scanner/dist/NoorScanner.exe
          retention-days: 7
