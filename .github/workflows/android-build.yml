name: Android build (Noor Shield)

# Builds the Noor Shield Android app (noor-shield-app/). This runs on
# GitHub's own hosted runner, which has its own unrestricted network access
# and a preinstalled Android SDK — unlike a locally sandboxed dev
# environment, it isn't blocked from reaching dl.google.com for the Android
# Gradle Plugin and SDK platform files.
on:
  workflow_dispatch:
  push:
    paths:
      - "noor-shield-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noor-shield-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-shield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
