# Builds the Zaad phone app (Android and iPhone) from zaad_app/.
#   test:    checks the code and runs the tests (the same ones you can run on your own computer)
#   android: builds a test APK you can install on an Android phone
#   ios:     checks the iPhone app compiles (signing and the App Store upload need a Mac and an Apple developer account)
# Runs for every pull request that touches the app, for pushes to main, and by hand:
# Actions > Zaad app > Run workflow (then download the APK from the run).
name: Zaad app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'zaad_app/**'
      - '.github/workflows/zaad-app.yml'
  push:
    branches: [main]
    paths:
      - 'zaad_app/**'
      - '.github/workflows/zaad-app.yml'

permissions:
  contents: read

concurrency:
  group: zaad-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zaad_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # the screenshots in test/golden_test.dart are made on demand (see zaad_app/README.md), not checked here
      - run: flutter test test/logic_test.dart test/app_test.dart
        env:
          TZ: Australia/Melbourne

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: zaad_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build the test APK
        run: flutter build apk --debug
      # Keep the APK for pull requests and hand runs (a few days), but not for every push to main.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        with:
          name: zaad-android-test
          path: zaad_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  ios:
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zaad_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build for the iPhone simulator (no signing)
        run: flutter build ios --simulator --debug --no-codesign
