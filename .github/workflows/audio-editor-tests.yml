name: Audio editor tests

on:
  pull_request:
    paths:
      - 'audio-editor/**'
      - '.github/workflows/audio-editor-tests.yml'
  push:
    branches: [main]
    paths:
      - 'audio-editor/**'
      - '.github/workflows/audio-editor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-editor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    defaults:
      run:
        working-directory: audio-editor/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audio-editor/tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-${{ matrix.project }}
          path: audio-editor/tests/playwright-report
          retention-days: 7
