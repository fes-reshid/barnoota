# Temporary (removed after one run): finds each Seeraa scene speech bubble in Ar-Raheeq al-Makhtum.
name: Ar-Raheeq bubble check (temporary)
on:
  push:
    paths: ['.github/workflows/raheeq-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          curl -sSL -A "Mozilla/5.0" -o book.pdf https://www.muslim-library.com/dl/books/English_ArRaheeq_AlMakhtum_THE_SEALED_NECTAR.pdf || true
          if ! pdftotext book.pdf book.txt 2>/dev/null; then echo "muslim-library copy unreadable, using archive.org"; curl -sSL -o book.pdf https://archive.org/download/Ar-raheeqAl-makhtum/sealed-nectar.pdf; pdftotext book.pdf book.txt; fi
          ls -la book.pdf; wc -l book.txt
          tr '\n' ' ' < book.txt | sed 's/  */ /g' > flat.txt
          show() { echo; echo "=== $1"; grep -o -i -E ".{0,260}($2).{0,260}" flat.txt | head -${3:-4} || true; echo "(matches: $(grep -o -i -E "$2" flat.txt | wc -l))"; }
          show "Zamzam: takbir?" "dig Zamzam|well of Zamzam gushed" 3
          show "Black Stone: al-Amin" "Al-Ameen|Ameen" 6
          show "Negus: safe in my land" "safe in my land|secure in my land|safe in my country|my land in safety" 4
          show "Ja'far's speech" "people (of|in a state of) ignorance|in ignorance" 3
          show "Building the mosque / Trench: Hereafter" "life of the Hereafter|good of the Hereafter|life but the life" 6
          show "Trench: pledge as long as we live" "as long as we (live|are alive|remain)|pledged? to Muhammad|pledge to Muhammad" 4
          show "Farewell: asked about me" "asked about me|be asked about me" 3
          show "Farewell: bear witness" "bear witness that you|O All.h, bear witness|O All.h! Bear witness" 4
          show "5:3 perfected your religion" "perfected your religion" 3
          show "Suraqah" "Suraqa" 4
          show "Hijrah: pursuers caught up" "caught up with us|overtaken|pursuer" 4
          show "Hira: Read" "Read in the Name of your Lord" 2
