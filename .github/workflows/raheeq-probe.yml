# Temporary (removed after one run): finds each Seeraa scene speech bubble in Ar-Raheeq al-Makhtum.
name: Ar-Raheeq bubble check (temporary)
on:
  push:
    paths: ['.github/workflows/raheeq-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: tools
        timeout-minutes: 4
        run: |
          echo "start $(date -u +%T)"; command -v pdftotext || (sudo apt-get -o DPkg::Lock::Timeout=60 install -y -qq poppler-utils >/dev/null 2>&1; echo "installed $(date -u +%T)"); command -v pdftotext
      - name: book
        timeout-minutes: 5
        run: |
          echo "download $(date -u +%T)"
          curl -sSL -m 90 -A "Mozilla/5.0" -o book.pdf https://www.muslim-library.com/dl/books/English_ArRaheeq_AlMakhtum_THE_SEALED_NECTAR.pdf || echo "muslim-library download failed"
          ls -la book.pdf 2>/dev/null; file book.pdf 2>/dev/null || true
          if ! timeout 120 pdftotext book.pdf book.txt 2>/dev/null || [ ! -s book.txt ]; then echo "using archive.org $(date -u +%T)"; curl -sSL -m 120 -o book.pdf https://archive.org/download/Ar-raheeqAl-makhtum/sealed-nectar.pdf; timeout 120 pdftotext book.pdf book.txt; fi
          echo "text $(date -u +%T)"; wc -l book.txt; head -c 200 book.txt | tr "\n" " "; echo
      - name: search
        timeout-minutes: 2
        run: |
          export LC_ALL=C.UTF-8
          show() { echo; echo "=== $1 (matching lines: $(grep -c -i -E "$2" book.txt))"; grep -n -i -E -B ${4:-2} -A ${5:-14} "$2" book.txt | head -$(( ${3:-3} * 18 )) || true; }
          show "Black Stone and al-Amin" "Black Stone" 4 2 14
          show "al-Amin spelled with a space" "Al- Ameen|Al-Ameen|the trustworthy" 4 4 6
          show "Ja'far before the Negus" "O king|O King" 3 2 22
          show "Negus answers" "Negus (said|replied|answered)|said the Negus|Go, you|you may go|are safe|in safety|in security" 5 3 6
          show "Trench chant" "[Tt]rench" 3 1 12
          show "Trench: we pledged / Jihad" "for Jihad|[Jj]ihad as long|swore|sworn allegiance|pledge(d)? (to|of allegiance)" 4 3 5
          show "Suraqah's words" "begged of the Prophet" 1 4 14
          show "Hira: first revelation" "Read!|Read in the|Iqra" 2 3 12
