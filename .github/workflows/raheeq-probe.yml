# Temporary (removed after one run): finds each Seeraa scene speech bubble in Ar-Raheeq al-Makhtum.
name: Ar-Raheeq bubble check (temporary)
on:
  push:
    paths: ['.github/workflows/raheeq-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: tools
        timeout-minutes: 4
        run: |
          echo "start $(date -u +%T)"; command -v pdftotext || (sudo apt-get -o DPkg::Lock::Timeout=60 install -y -qq poppler-utils >/dev/null 2>&1; echo "installed $(date -u +%T)"); command -v pdftotext
      - name: book
        timeout-minutes: 5
        run: |
          echo "download $(date -u +%T)"
          curl -sSL -m 90 -A "Mozilla/5.0" -o book.pdf https://www.muslim-library.com/dl/books/English_ArRaheeq_AlMakhtum_THE_SEALED_NECTAR.pdf || echo "muslim-library download failed"
          ls -la book.pdf 2>/dev/null; file book.pdf 2>/dev/null || true
          if ! timeout 120 pdftotext book.pdf book.txt 2>/dev/null || [ ! -s book.txt ]; then echo "using archive.org $(date -u +%T)"; curl -sSL -m 120 -o book.pdf https://archive.org/download/Ar-raheeqAl-makhtum/sealed-nectar.pdf; timeout 120 pdftotext book.pdf book.txt; fi
          echo "text $(date -u +%T)"; wc -l book.txt; head -c 200 book.txt | tr "\n" " "; echo
      - name: search
        timeout-minutes: 2
        run: |
          export LC_ALL=C.UTF-8
          show() { echo; echo "=== $1 (matching lines: $(grep -c -i -E "$2" book.txt))"; grep -n -i -E -B 3 -A 4 "$2" book.txt | head -$(( ${3:-3} * 9 )) || true; }
          show "Zamzam: takbir?" "dig Zamzam|well of Zamzam gushed" 3
          show "Black Stone: al-Amin" "Al-Ameen|Ameen" 6
          show "Negus: safe in my land" "safe in my land|secure in my land|safe in my country|my land in safety" 4
          show "Ja'far's speech" "people (of|in a state of) ignorance|in ignorance" 3
          show "Building the mosque / Trench: Hereafter" "of the Hereafter|the Hereafter, so|Ansar and the" 6
          show "Trench: pledge as long as we live" "as long as we|to Muhammad to" 4
          show "Farewell: asked about me" "asked about me|be asked about me" 3
          show "Farewell: bear witness" "bear witness that you|O All.h, bear witness|O All.h! Bear witness" 4
          show "5:3 perfected your religion" "perfected your religion" 3
          show "Suraqah" "Suraqa" 4
          show "Hijrah: pursuers caught up" "caught up with us|overtaken|pursuer" 4
          show "Hira: Read" "Read in the Name of your Lord" 2
